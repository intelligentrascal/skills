<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grill page directions</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --wash: #efede8;
    --rule: #e2dfd8;
    --rule-2: #cfcac0;
    --ink: #1c1b19;
    --ink-2: #4f4b45;
    --ink-3: #69645c;
    --accent: #1f5fbf;
    --accent-wash: #e8effa;
    --on-ink: #fbfaf7;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
    --ui: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    --serif: ui-serif, "New York", Charter, "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--ui); letter-spacing: -0.005em;
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- bar ---- */
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule);
  }
  .bar h1 { font: 400 18px/1.2 var(--serif); letter-spacing: -0.012em; margin: 0; white-space: nowrap; }
  .bar h1 span { color: var(--ink-3); font: 500 12px var(--ui); margin-left: 6px; letter-spacing: 0; }
  .tabs { display: flex; min-width: 0; gap: 2px; padding: 3px; background: var(--wash); border-radius: 999px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; padding: 5px 12px; border-radius: 999px;
    color: var(--ink-2); font-weight: 500; font-size: 13px; white-space: nowrap; cursor: pointer;
    transition: background-color 160ms var(--ease), color 160ms var(--ease);
  }
  .tab .n { font-variant-numeric: tabular-nums; color: var(--ink-3); margin-right: 5px; }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-2); }
  .tab[aria-selected="true"] .n { color: var(--accent); }
  @media (hover: hover) { .tab:hover:not([aria-selected="true"]) { color: var(--ink); background: rgb(0 0 0 / 0.04); } }
  .tab:active { transform: scale(0.98); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); padding: 4px 12px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .btn {
    border: 1px solid var(--rule-2); background: var(--panel); border-radius: 999px;
    padding: 4px 12px; font-size: 12.5px; color: var(--ink); cursor: pointer;
    transition: border-color 160ms var(--ease);
  }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  @media (hover: hover) { .btn:hover { border-color: var(--ink-3); } }
  .btn:active, .seg button:active { transform: scale(0.98); }
  .dir-only[hidden] { display: none; }

  /* ---- views ---- */
  main { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; overflow: auto; }
  .view[hidden] { display: none; }

  /* direction view: stage + notes */
  .dir { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .dir.with-notes { grid-template-columns: minmax(0, 1fr) 380px; }
  .stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: stretch; }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--panel); }
  .stage.phone { display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; background: var(--wash); }
  .stage.phone .device {
    width: 390px; height: 844px; max-height: 100%; border-radius: 36px; overflow: hidden;
    box-shadow: 0 0 0 10px #1c1b19, 0 24px 60px -20px rgb(28 27 25 / 0.45);
    background: var(--panel); flex: none;
  }
  .stage:not(.phone) .device { width: 100%; height: 100%; }
  .notes { border-left: 1px solid var(--rule); background: var(--panel); overflow: auto; padding: 20px 22px 40px; }
  .dir:not(.with-notes) .notes { display: none; }

  .notes h2 { font: 400 26px/1.1 var(--serif); letter-spacing: -0.02em; margin: 2px 0 6px; text-wrap: balance; }
  .notes .tagline { color: var(--ink-2); margin: 0 0 14px; font-size: 14.5px; text-wrap: pretty; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .chip { font: 500 12px/20px var(--ui); padding: 0 8px; border-radius: var(--r-sm); background: var(--wash); color: var(--ink-2); }
  .chip.lead { background: var(--ink); color: var(--on-ink); }
  .notes h3 { font: 600 12px var(--ui); color: var(--ink-3); margin: 20px 0 6px; letter-spacing: 0; }
  .notes p { margin: 0 0 8px; text-wrap: pretty; }
  .notes ul { margin: 0; padding: 0; list-style: none; }
  .notes li { padding: 7px 0; border-top: 1px solid var(--rule); }
  .notes li:first-child { border-top: 0; }
  .notes li b { font-weight: 600; display: block; }
  .notes li span { color: var(--ink-2); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .sw { border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; font-size: 11.5px; }
  .sw i { display: block; height: 34px; }
  .sw div { padding: 5px 7px; line-height: 1.3; }
  .sw code { font: 11px var(--mono); color: var(--ink-3); }

  /* brief + compare */
  .doc { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
  .doc h2 { font: 400 40px/1.06 var(--serif); letter-spacing: -0.022em; margin: 0 0 12px; text-wrap: balance; }
  .doc .lead { font-size: 17px; color: var(--ink-2); max-width: 64ch; margin: 0 0 32px; text-wrap: pretty; }
  .doc h3 { font: 400 22px/1.2 var(--serif); letter-spacing: -0.012em; margin: 36px 0 10px; }
  .doc p, .doc li { max-width: 72ch; text-wrap: pretty; }
  .doc ul { padding-left: 18px; }
  .doc li { margin: 4px 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 18px;
    text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    transition: border-color 160ms var(--ease);
  }
  @media (hover: hover) { .card:hover { border-color: var(--ink-3); } }
  .card:active { transform: scale(0.99); }
  .card .n { font: 500 12px var(--ui); color: var(--accent); font-variant-numeric: tabular-nums; }
  .card h4 { font: 400 22px/1.15 var(--serif); letter-spacing: -0.015em; margin: 0; }
  .card p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .card .chips { margin: 6px 0 0; }
  .card .open { margin-top: auto; padding-top: 8px; font-weight: 500; color: var(--accent); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-lg); overflow: hidden; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-top: 1px solid var(--rule); }
  thead th { border-top: 0; font: 400 18px/1.2 var(--serif); letter-spacing: -0.012em; background: var(--wash); }
  tbody th { font-weight: 600; color: var(--ink-2); width: 150px; font-size: 12.5px; }
  td ul { margin: 0; padding-left: 16px; }
  .table-wrap { overflow-x: auto; border-radius: var(--r-lg); }
  .pal { display: flex; gap: 3px; flex-wrap: wrap; }
  .pal i { width: 22px; height: 22px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }

  @media (max-width: 1000px) {
    .dir.with-notes { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .dir.with-notes .notes { position: absolute; inset: auto 0 0 0; max-height: 70%; border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0; box-shadow: 0 -16px 40px -16px rgb(28 27 25 / 0.3); z-index: 2; }
    .cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .bar { gap: 8px; padding: 8px 12px; }
    .bar h1 span { display: none; }
    .tabs { order: 3; flex-basis: 100%; }
    .doc { padding: 24px 16px 60px; }
    .doc h2 { font-size: 30px; }
    .stage.phone { padding: 0; }
    .stage.phone .device { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .tab:active, .btn:active, .card:active, .seg button:active { transform: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Grill page <span>three new directions · 2026-09-25</span></h1>
  <div class="tabs" role="tablist" aria-label="Views" id="tabs"></div>
  <div class="spacer"></div>
  <div class="seg dir-only" role="group" aria-label="Viewport" id="vp" hidden>
    <button type="button" data-vp="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-vp="phone" aria-pressed="false">Phone</button>
  </div>
  <button type="button" class="btn dir-only" id="notesBtn" aria-pressed="true" hidden>Notes</button>
</header>
<main id="main"></main>

<script>
/*__DIRECTIONS__*/
</script>
<script>
(() => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const main = document.getElementById("main"), tabsEl = document.getElementById("tabs");
  const vpEl = document.getElementById("vp"), notesBtn = document.getElementById("notesBtn");
  const pref = { vp: "desktop", notes: innerWidth > 1000 };
  const SKILL = {
    "hallmark": "Hallmark", "web-design-engineer": "Web Design Engineer", "ui-ux-pro-max": "UI/UX Pro Max",
    "taste-skill": "Taste", "gpt-taste": "GPT Taste", "gpt-tasteskill": "GPT Taste",
    "make-interfaces-feel-better": "Make Interfaces Feel Better",
  };
  const skillChips = (d) => `<div class="chips">${(d.skills || []).map((s, i) => `<span class="chip${i === 0 ? " lead" : ""}">${esc(SKILL[s] || s)}${i === 0 ? " · lead" : ""}</span>`).join("")}</div>`;

  const views = [{ id: "brief", label: "Brief" }, ...DIRECTIONS.map((d, i) => ({ id: "d" + (i + 1), label: d.name, n: i + 1 })), { id: "compare", label: "Compare" }];

  tabsEl.innerHTML = views.map((v) => `<button type="button" class="tab" role="tab" id="tab-${v.id}" aria-controls="view-${v.id}" aria-selected="false" tabindex="-1" data-id="${v.id}">${v.n ? `<span class="n">${v.n}</span>` : ""}${esc(v.label)}</button>`).join("");

  // ---- brief ----
  const brief = `<div class="doc">
    <h2>Three ways the grill page could beat Inbox</h2>
    <p class="lead">Inbox is what we settled on: a list of questions by round, one focused card and a discussion pane. These are three alternatives built on the same data and the same rules, each from a different mix of design skills. Every one is a working mockup: stage answers, hover the visual, press <kbd>?</kbd> for keys.</p>
    <div class="cards">${DIRECTIONS.map((d, i) => `<button type="button" class="card" data-go="d${i + 1}">
      <span class="n">Direction ${i + 1}</span><h4>${esc(d.name)}</h4><p>${esc(d.tagline)}</p>
      <p><b>Model:</b> ${esc(d.model)}</p>${skillChips(d)}<span class="open">Open →</span></button>`).join("")}</div>
    <h3>What we're after</h3>
    <p>The job is fast shared understanding between you and the agent. At a glance you should see what the agent is asking and recommending and why, what's decided, what's open and what you've staged, the discussion on each question, and the visual and how it links to the questions. Then you should be able to clear a round of 7–8 open questions quickly and find any earlier decision in one look.</p>
    <h3>Held constant across all three</h3>
    <ul>
      <li>Same data: the real <code>grill-with-ui</code> session (rounds 1–8), with round 9 open, Q15 and Q16 reopened, Q23 deferred and the visual stale.</li>
      <li>Same semantics: nothing is sent until Send; one Send is one turn; Explore deeper and Visualize send at once, with undo; Finish asks for confirmation and shows the doc path.</li>
      <li>Same visual contract: a sandboxed iframe with <code>data-q</code> regions and two-way hover and click linkage over postMessage.</li>
      <li>Same keys: <kbd>j</kbd>/<kbd>k</kbd>, <kbd>1</kbd>–<kbd>4</kbd>, <kbd>a</kbd>, <kbd>r</kbd>, <kbd>f</kbd>, <kbd>d</kbd>/<kbd>o</kbd>, <kbd>e</kbd>, <kbd>v</kbd>, <kbd>u</kbd>, <kbd>⌘↵</kbd>, <kbd>Esc</kbd>, <kbd>?</kbd>.</li>
      <li>Product rules win over the skills: no network, system fonts only, light theme, WCAG AA, no horizontal scroll at 390 px.</li>
    </ul>
    <h3>Usability findings every direction had to fix</h3>
    <ul>
      <li>Auto-advance to the next open question after Accept or stage.</li>
      <li>Open counts that count down as you stage.</li>
      <li>One unambiguous path for free-text answers and pushback.</li>
      <li>Reopened questions that don't look settled.</li>
      <li>A visual that is first-class and discoverable, with linkage you can see.</li>
      <li>The current round first, with earlier rounds one step away.</li>
      <li>No nested scroll strips on phone, and content before chrome.</li>
      <li>Shortcuts that never fire while focus is moving to a text field.</li>
    </ul>
  </div>`;

  // ---- compare ----
  const row = (label, f) => `<tr><th scope="row">${label}</th>${DIRECTIONS.map((d) => `<td>${f(d)}</td>`).join("")}</tr>`;
  const list = (a, fn) => `<ul>${(a || []).map((x) => `<li>${fn(x)}</li>`).join("")}</ul>`;
  const compare = `<div class="doc" style="max-width:1200px">
    <h2>Side by side</h2>
    <p class="lead">Same functionality, three different bets on what matters most.</p>
    <div class="table-wrap"><table>
      <thead><tr><th></th>${DIRECTIONS.map((d, i) => `<th scope="col">${i + 1}. ${esc(d.name)}</th>`).join("")}</tr></thead>
      <tbody>
        ${row("Layout model", (d) => esc(d.model))}
        ${row("Skills", (d) => skillChips(d))}
        ${row("Philosophy", (d) => esc(d.philosophy))}
        ${row("Best for", (d) => esc(d.bestFor))}
        ${row("Costs vs Inbox", (d) => list(d.tradeoffs, esc))}
        ${row("Type", (d) => esc(d.type))}
        ${row("Palette", (d) => `<div class="pal">${(d.palette || []).map((p) => `<i style="background:${esc(p.hex)}" title="${esc(p.name)} ${esc(p.hex)}: ${esc(p.role)}"></i>`).join("")}</div>`)}
      </tbody>
    </table></div>
  </div>`;

  // ---- direction views ----
  const notes = (d, i) => `<p class="chip" style="display:inline-block;margin:0 0 8px">Direction ${i + 1}</p>
    <h2>${esc(d.name)}</h2><p class="tagline">${esc(d.tagline)}</p>${skillChips(d)}
    <h3>Layout model</h3><p>${esc(d.model)}</p>
    <h3>Philosophy</h3><p>${esc(d.philosophy)}</p>
    <h3>Principles → decisions</h3>${list(d.principles, (p) => `<b>${esc(p.principle)}</b><span>${esc(p.decision)}</span>`)}
    <h3>Usability findings → fixes</h3>${list(d.fixes, (f) => `<b>${esc(f.finding)}</b><span>${esc(f.how)}</span>`)}
    <h3>Costs vs Inbox</h3>${list(d.tradeoffs, esc)}
    <h3>Best for</h3><p>${esc(d.bestFor)}</p>
    <h3>Palette</h3><div class="swatches">${(d.palette || []).map((p) => `<div class="sw"><i style="background:${esc(p.hex)}"></i><div>${esc(p.name)}<br><code>${esc(p.hex)}</code><br><span style="color:var(--ink-3)">${esc(p.role)}</span></div></div>`).join("")}</div>
    <h3>Type</h3><p>${esc(d.type)}</p>
    ${(d.skillOverrides || []).length ? `<h3>Where product rules overrode a skill</h3>${list(d.skillOverrides, (o) => esc(typeof o === "string" ? o : [o.skill, o.advice, o.override || o.why].filter(Boolean).join(": ")))}` : ""}`;

  main.innerHTML = `<section class="view" id="view-brief" role="tabpanel" aria-labelledby="tab-brief" hidden>${brief}</section>` +
    DIRECTIONS.map((d, i) => `<section class="view dir" id="view-d${i + 1}" role="tabpanel" aria-labelledby="tab-d${i + 1}" hidden>
      <div class="stage"><div class="device"></div></div><aside class="notes" aria-label="Notes on ${esc(d.name)}">${notes(d, i)}</aside></section>`).join("") +
    `<section class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>${compare}</section>`;

  // Each direction is its own document, mounted lazily on first view so its keyboard layer and state stay isolated.
  const mount = (i) => {
    const dev = document.querySelector(`#view-d${i + 1} .device`);
    if (dev.firstChild) return;
    const f = document.createElement("iframe");
    f.title = DIRECTIONS[i].name + " mockup";
    f.srcdoc = DOCS[i];
    dev.appendChild(f);
  };

  const apply = () => {
    document.querySelectorAll(".dir").forEach((el) => el.classList.toggle("with-notes", pref.notes));
    document.querySelectorAll(".stage").forEach((el) => el.classList.toggle("phone", pref.vp === "phone"));
    vpEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vp === pref.vp)));
    notesBtn.setAttribute("aria-pressed", String(pref.notes));
  };

  const show = (id, focusTab) => {
    if (!views.some((v) => v.id === id)) id = "brief";
    views.forEach((v) => {
      const on = v.id === id, t = document.getElementById("tab-" + v.id);
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
      document.getElementById("view-" + v.id).hidden = !on;
    });
    const isDir = /^d\d$/.test(id);
    vpEl.hidden = notesBtn.hidden = !isDir;
    if (isDir) mount(+id.slice(1) - 1);
    const t = document.getElementById("tab-" + id);
    t.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (focusTab) t.focus();
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  };

  tabsEl.addEventListener("click", (e) => { const t = e.target.closest(".tab"); if (t) show(t.dataset.id); });
  tabsEl.addEventListener("keydown", (e) => {
    const ids = views.map((v) => v.id), cur = ids.indexOf(document.activeElement.dataset.id);
    const next = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: ids.length - 1 }[e.key];
    if (next === undefined || cur < 0) return;
    e.preventDefault(); show(ids[(next + ids.length) % ids.length], true);
  });
  main.addEventListener("click", (e) => { const c = e.target.closest("[data-go]"); if (c) show(c.dataset.go, true); });
  vpEl.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { pref.vp = b.dataset.vp; apply(); } });
  notesBtn.addEventListener("click", () => { pref.notes = !pref.notes; apply(); });
  addEventListener("hashchange", () => show(location.hash.slice(1)));

  apply();
  show(location.hash.slice(1) || "brief");
})();
</script>
</body>
</html>
