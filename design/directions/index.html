<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grill page directions</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --wash: #efede8;
    --rule: #e2dfd8;
    --rule-2: #cfcac0;
    --ink: #1c1b19;
    --ink-2: #4f4b45;
    --ink-3: #69645c;
    --accent: #1f5fbf;
    --accent-wash: #e8effa;
    --on-ink: #fbfaf7;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
    --ui: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    --serif: ui-serif, "New York", Charter, "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--ui); letter-spacing: -0.005em;
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- bar ---- */
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule);
  }
  .bar h1 { font: 400 18px/1.2 var(--serif); letter-spacing: -0.012em; margin: 0; white-space: nowrap; }
  .bar h1 span { color: var(--ink-3); font: 500 12px var(--ui); margin-left: 6px; letter-spacing: 0; }
  .tabs { display: flex; min-width: 0; gap: 2px; padding: 3px; background: var(--wash); border-radius: 999px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; padding: 5px 12px; border-radius: 999px;
    color: var(--ink-2); font-weight: 500; font-size: 13px; white-space: nowrap; cursor: pointer;
    transition: background-color 160ms var(--ease), color 160ms var(--ease);
  }
  .tab .n { font-variant-numeric: tabular-nums; color: var(--ink-3); margin-right: 5px; }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-2); }
  .tab[aria-selected="true"] .n { color: var(--accent); }
  @media (hover: hover) { .tab:hover:not([aria-selected="true"]) { color: var(--ink); background: rgb(0 0 0 / 0.04); } }
  .tab:active { transform: scale(0.98); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--rule-2); background: var(--panel); border-radius: 999px;
    padding: 4px 12px; font-size: 12.5px; color: var(--ink); cursor: pointer;
    transition: border-color 160ms var(--ease);
  }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  @media (hover: hover) { .btn:hover { border-color: var(--ink-3); } }
  .btn:active { transform: scale(0.98); }
  .dir-only[hidden] { display: none; }

  /* ---- views ---- */
  main { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; overflow: auto; }
  .view[hidden] { display: none; }

  /* direction view: stage + notes */
  .dir { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: stretch; }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--panel); }
  .device { width: 100%; height: 100%; }
  /* Notes float over the mockup so each direction renders at its full designed width. */
  .notes { position: absolute; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 2; border-left: 1px solid var(--rule); background: var(--panel); overflow: auto; padding: 20px 22px 40px; box-shadow: -18px 0 40px -24px rgb(28 27 25 / 0.35); }
  .dir:not(.with-notes) .notes { display: none; }

  .notes h2 { font: 400 26px/1.1 var(--serif); letter-spacing: -0.02em; margin: 2px 0 6px; text-wrap: balance; }
  .notes .tagline { color: var(--ink-2); margin: 0 0 14px; font-size: 14.5px; text-wrap: pretty; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .chip { font: 500 12px/20px var(--ui); padding: 0 8px; border-radius: var(--r-sm); background: var(--wash); color: var(--ink-2); }
  .chip.is-lead { background: var(--ink); color: var(--on-ink); }
  .notes h3 { font: 600 12px var(--ui); color: var(--ink-3); margin: 20px 0 6px; letter-spacing: 0; }
  .notes p { margin: 0 0 8px; text-wrap: pretty; }
  .notes ul { margin: 0; padding: 0; list-style: none; }
  .notes li { padding: 7px 0; border-top: 1px solid var(--rule); }
  .notes li:first-child { border-top: 0; }
  .notes li b { font-weight: 600; display: block; }
  .notes li span { color: var(--ink-2); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .sw { border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; font-size: 11.5px; }
  .sw i { display: block; height: 34px; }
  .sw div { padding: 5px 7px; line-height: 1.3; }
  .sw code { font: 11px var(--mono); color: var(--ink-3); }

  /* brief + compare */
  .doc { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
  .doc h2 { font: 400 40px/1.06 var(--serif); letter-spacing: -0.022em; margin: 0 0 12px; text-wrap: balance; }
  .doc .lead { font-size: 17px; color: var(--ink-2); max-width: 64ch; margin: 0 0 32px; text-wrap: pretty; }
  .doc h3 { font: 400 22px/1.2 var(--serif); letter-spacing: -0.012em; margin: 36px 0 10px; }
  .doc p, .doc li { max-width: 72ch; text-wrap: pretty; }
  .doc ul { padding-left: 18px; }
  .doc li { margin: 4px 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 18px;
    text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    transition: border-color 160ms var(--ease);
  }
  @media (hover: hover) { .card:hover { border-color: var(--ink-3); } }
  .card:active { transform: scale(0.99); }
  .card .n { font: 500 12px var(--ui); color: var(--accent); font-variant-numeric: tabular-nums; }
  .card h4 { font: 400 22px/1.15 var(--serif); letter-spacing: -0.015em; margin: 0; }
  .card p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .card .chips { margin: 6px 0 0; }
  .card .open { margin-top: auto; padding-top: 8px; font-weight: 500; color: var(--accent); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-lg); overflow: hidden; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-top: 1px solid var(--rule); }
  thead th { border-top: 0; font: 400 18px/1.2 var(--serif); letter-spacing: -0.012em; background: var(--wash); }
  tbody th { font-weight: 600; color: var(--ink-2); width: 150px; font-size: 12.5px; }
  td ul { margin: 0; padding-left: 16px; }
  .table-wrap { overflow-x: auto; border-radius: var(--r-lg); }
  .pal { display: flex; gap: 3px; flex-wrap: wrap; }
  .pal i { width: 22px; height: 22px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }

  @media (max-width: 1000px) {
    .cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .bar { gap: 8px; padding: 8px 12px; }
    .bar h1 span { display: none; }
    .tabs { order: 3; flex-basis: 100%; }
    .doc { padding: 24px 16px 60px; }
    .doc h2 { font-size: 30px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .tab:active, .btn:active, .card:active { transform: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Grill page <span>three new directions · 2026-09-25</span></h1>
  <div class="tabs" role="tablist" aria-label="Views" id="tabs"></div>
  <div class="spacer"></div>
  <button type="button" class="btn dir-only" id="popBtn" hidden title="Open this direction on its own at full window size">Open full window ↗</button>
  <button type="button" class="btn dir-only" id="notesBtn" aria-pressed="false" hidden>About this direction</button>
</header>
<main id="main"></main>

<script>
const DIRECTIONS = [{"name":"The Crit Wall","tagline":"The agent's prototype is pinned up as the stage; questions are pins on it, decisions are labels beside it, and your unsent marks are the only colour in the room.","skills":["hallmark","web-design-engineer","make-interfaces-feel-better"],"model":"Annotate the work in place: select a pin, read the recommendation first, answer with one key, the note moves to the next pin, and Send hands every mark back as one turn.","philosophy":"A design review does not happen in a list; it happens on the wall, in front of the work, with everyone pointing at the same region. So the prototype is the room and everything else is annotation on or beside it. State is encoded physically: pins for what is being asked, orange marks for what is mine and unsent, dashed and tilted pins for what has been unsettled, labels with leader lines for what is decided, and a sepia print with an inked seal for a drawing that has gone out of date. The right edge is deliberately not a pane: it is the record you consult and the tray you hand back.","principles":[{"principle":"BLUF / inverted pyramid","decision":"The note at a pin opens with the recommendation and its cost before the options; the strip line, the labels and the ledger all lead with the decision statement, not the question."},{"principle":"Recognition over recall (visual as the room)","decision":"Every question that has a region, or whose direct dependency has one, is a numbered pin on that region of the print; several on one region cluster into one marker with a count. You recognise where a question lives instead of recalling it."},{"principle":"Preattentive state encoding, hierarchy before colour","decision":"Open = paper pin; staged = the one accent, grease-pencil orange; reopened = dashed ring, tilted 14°, hatched region; deferred = hollow ring; decided = a label beside the print with a leader line. Colour is reserved for what is mine and unsent."},{"principle":"One primary action per view","decision":"Inside a note the only filled button is Accept; on the page the only accent-filled button is Send, fixed at the bottom-right corner of the viewport (Fitts's law) so it is the easiest target on screen."},{"principle":"Progressive disclosure","decision":"The print shows numbers and decision labels only; the body, options, why, thread and free-text field live in the note that opens at the pin; siblings on the same marker are one click away in the note header."},{"principle":"Gestalt: common region and proximity","decision":"Pins sit on the top-right edge of the region they concern; a leader line joins each decision label to its region; questions without a region stay in the strip and say so, rather than being pinned somewhere false."},{"principle":"Norman's signifiers and feedback","decision":"The stale drawing is sepia with an inked OUT OF DATE seal and a red caption naming the reopened questions; staging turns the pin orange, drops the open count, and the tray lists what Send will ship; Send toasts what shipped and the lamp goes to working."},{"principle":"Statements, not chrome","decision":"Labels and ledger rows read 'Q2 · Transport — Simpler: the web app writes to a local JSON…', derived from the accepted option or the user's own words; durable ones carry a locked mark."}],"fixes":[{"finding":"Capability 2: every state unmistakable","how":"Six visually distinct pin states (open paper, staged accent fill, reopened dashed+tilted with a 'Qn reopened' tag and a hatched region, deferred hollow ring, decided rust ring, rec-updated chip) repeated identically on the print, in the round strip and in the note header; reopened questions also strike their old answer and show the agent's reason in the note; dependants of a reopened question tilt the other way and carry an 'after Q15 ↺' chip."},{"finding":"Capability 3: answering","how":"1–4 pick, a accepts the rec, f is the single free-text field ('In my words — an answer or a pushback', staged with ⌘↵), d defers, o reopens a decided question, e explores deeper at once with an Undo toast, r replies in the thread where staged replies are labelled 'staged · not sent'. Clicking an option row does the same as its key."},{"finding":"Capability 4: staging","how":"Counts in the strip update live (open goes down, staged goes up in accent); after each mark the note auto-advances to the next open pin and, when the round is clear, focuses Send; u or the × in the tray unstages; the Handing-back tray lists every mark as a statement and the button reads 'Send N as one turn'."},{"finding":"Capability 5: the visual, two-way","how":"Hovering or selecting any pin, label or ledger row posts {highlight:[region]} to the sandboxed frame and lights the region overlay; a click inside the frame posts {clicked:id} and selects that question (a decided one opens as a record with Reopen). The stale print is sepia with a seal and caption; v or Redraw asks the agent, the lamp works for ~2 s, then v4 arrives clean."},{"finding":"Capability 8: find a past decision","how":"The Settled ledger is always on screen, newest round first, each row a statement with a locked mark; / focuses the find field and 'transport' leaves one row (Q2) with the match highlighted; clicking it opens the record note at the row, with the decision, the agent's recommendation and whether it was taken or overruled."}],"tradeoffs":["Pins carry numbers, not titles, so the first read of a marker needs the strip line or a hover; a list shows titles for free.","Because pins are placed where the visual has regions, the coverage of the print decides how much of the round is spatial; a visual with few regions pushes most questions into the strip and the wall reads emptier.","The note opens over the gutter and the top of the record while you answer, so the decision labels and the top ledger rows are hidden until Esc; a fixed side pane would never cover them.","The print is scaled with a CSS transform to fill the stage, so region coordinates are multiplied by the scale on the parent side; at scales below 1 the prototype's text is smaller than the agent drew it. The sandbox is untouched: the frame stays sandbox=\"allow-scripts\", talks only via postMessage, and the parent filters on e.source."],"bestFor":"Rounds where the agent has drawn a prototype and most questions are about parts of it: reviewing layout, surfaces and flows with the work in front of you, mostly from the keyboard.","palette":[{"name":"Wall","hex":"#2b2622","role":"room surface; oklch(21% 0.012 55), warm charcoal with grain and a top light"},{"name":"Wall deep","hex":"#251f1c","role":"masthead and margin surfaces; the shadowed edges of the room"},{"name":"Ink","hex":"#ebe7df","role":"text on the wall; oklch(93% 0.010 80)"},{"name":"Muted","hex":"#a29b90","role":"secondary text on the wall; ≥ 4.5:1"},{"name":"Print","hex":"#f6f3ec","role":"paper of the pinned prototype, the notes and the toasts; oklch(96.5% 0.010 80)"},{"name":"Paper ink","hex":"#2c2621","role":"text on paper"},{"name":"Grease pencil","hex":"#f08a5a","role":"the one accent: my staged marks, the Send button, the lit region; oklch(73% 0.165 42)"},{"name":"Accent deep","hex":"#b3491f","role":"the same pencil on paper (staged text inside a note)"},{"name":"Stamp","hex":"#8a4a3a","role":"rust stamp ink: reopened tags, the OUT OF DATE seal, decided rings; oklch(46% 0.11 30)"},{"name":"Focus","hex":"#f2c26a","role":"focus ring on the wall; pins get a paper ring over a dark halo so it reads on both surfaces"}],"type":"Bricolage Grotesque (variable; opsz/wdth/wght, latin, text-subset) for the topic, round, pin numerals at 85% width and note titles; IBM Plex Sans (variable 100–700, latin) for all reading text at 13–14 px; JetBrains Mono (variable, latin) as the single machine register: keys, doc path, question ids, label titles, stamps and seals. Scale: 11 · 12.5 · 14 · 16 · 20 · 25 px. Embedded as base64 @font-face, about 170 KB of woff2.","skillOverrides":["Hallmark 2+1 rule: the mono outlier appears in more than two slots (keys, ids, paths, label titles, stamps); it is one register, machine text, and every instance of that role uses it.","Hallmark gate 24 (4 px spacing scale): dense tool paddings use 5/7/9/11 px odd values where optical alignment with 1 px rules needs them.","Hallmark gate 25 (45–75 ch measure): ledger statements and gutter labels run at ~28–36 ch because they are index entries, not prose; the note body keeps ~45 ch.","Hallmark 'one shadow' rule: the print and the note use layered shadows (make-interfaces-feel-better surfaces guidance) because they are the two physically elevated objects in the room.","make-interfaces-feel-better scale-on-press 0.96: rectangular buttons press with translateY(1px) per Hallmark; only the round pins use scale(0.96).","Hallmark design-context gate: could not ask the PM the three questions from inside a parallel design run; inferred audience = the developer being interviewed, use = clear a round fast and find any decision, tone = technical studio (crit wall), and stated them in the CSS stamp.","web-design-engineer checkpoints (design-system confirmation, v0 pause): run without pauses because the brief asked for a finished direction; the Design Read is recorded here instead: artifact = tool prototype, visual-variance 8, motion 3, density 8, asset-dependence 2, brand-fidelity 2."],"contractChanges":["Child posts {regions:[{id,x,y,w,h}], w, h} on load and resize (ids matched to /^q\\d+$/, numbers only) so the parent can place pins, labels and hatches and size the print to its content. Implemented by appending a 9-line listener to VISUAL_HTML before \u003c/body> at runtime."]},{"name":"The Interview","tagline":"Each round is an issue: one question at full volume, the agent's verdict as a pull-quote, your reply as a first-class voice, and everything decided typeset as the record.","skills":["taste-skill","ui-ux-pro-max","make-interfaces-feel-better"],"model":"Editorial interview: filmstrip of the round on top, one question per page, verdict-first choices, a flip-over record, and the visual as a captioned plate.","philosophy":"A grill is a conversation about decisions, so the page is typeset like an interview rather than laid out like an inbox. Hierarchy comes from scale first: the question at 58px, the agent's recommendation as an italic pull-quote with its why and cost right under it, the alternatives beside it, and everything else in a margin. Red is the only colour and it means one thing: not yet printed (staged, reopened, stale, new recommendation). Black is settled, grey is parked. The record and the plate are not panes; they are pages you flip to with one key and back with Esc.","principles":[{"principle":"BLUF / inverted pyramid","decision":"Each page reads top-down as question, then the recommendation as a pull-quote with WHY and COST split out, then the alternatives, then the actions. The cost sentence is detected from the rec's why and labelled in red so the trade-off is never buried."},{"principle":"Hierarchy by scale and weight before colour","decision":"Newsreader display at 58px for the question, 28px italic for the verdict, 17px for other options, 12px mono for kickers. One accent (vermilion) carries only the not-yet-settled states; decided is plain ink."},{"principle":"Hick's law and one primary action per view","decision":"The recommendation is the first choice (keys 1 and a), the remaining options are listed under 'Or instead', and there is exactly one path for writing: 'Object, or answer in your own words' (r). Send is the single dark block in the corner."},{"principle":"Recognition over recall","decision":"The kicker names what the question hangs off (Q9 What Finish writes) and the margin prints that dependency's actual decision; the strip shows every frame of the round with its state word, so you never remember where you are."},{"principle":"Preattentive state encoding and Gestalt common region","decision":"Open, staged, decided, deferred, reopened and new-rec are words plus one hue plus one form: staged edits are red proofreader marks (open ^ B) in the send bar, reopened gets a red band above the title that says 'Not settled', decided gets an ink band."},{"principle":"Norman's signifiers and feedback","decision":"Every action shows its key as a keycap; staging changes the option row, the strip frame, the counts and the send bar in the same beat; Send toasts 'Sent N actions as one turn' and the masthead lamp pulses while the agent works; Explore sends at once with an Undo toast."},{"principle":"Fitts's law for Send","decision":"Send is a full-height black block pinned to the bottom-right corner of the viewport, with ⌘↵ printed on it."},{"principle":"Statements, not chrome","decision":"The record is a typeset document of statements ('Transport: \"Simpler: the web app writes to a local JSON...\"', 'Chose B over the recommended A', 'Locked'), grouped by round with the agent's refinement under each, filtered as you type."}],"fixes":[{"finding":"Capability 2: states must be unmistakable, reopened must not read as settled","how":"State is always a word, never a dot: the strip frame shows OPEN / STAGED / DECIDED / DEFERRED / REOPENED, NEW REC; the page opens with a red band 'Reopened by the agent at 22:44. Not settled.' quoting the old answer and the agent's reason; the record strikes the old statement through and prints the reopen note in red italic; a new recommendation is tagged 'updated' in red beside 'The agent recommends'."},{"finding":"Capability 3: pick 1-4, accept, one unambiguous way to write, defer, reopen, explore, thread with staged messages","how":"The pull-quote is option 1/a; other options keyed by their letter position; one 'Object, or answer in your own words' path (r, f is an alias) opens a red-ruled voice block directly under the question, Enter stages it; d defers; o on a decided question opens the same voice block as a reopen note; e sends 'explore deeper' at once with a 5 s Undo; the margin thread shows AGENT/YOU entries with times and staged messages in red italic marked 'staged'."},{"finding":"Capability 4: live counts, auto-advance, unstage, clear Send summary","how":"The strip header counts open / staged / reopened in tabular numerals and ticks as you stage; after any stage the page slides to the next unstaged open or reopened question; u unstages; the send bar lists every staged edit as a proofreader mark (Q18 open ^ accept A) and the button reads 'Send 3 as one turn'."},{"finding":"Capability 5: visual with two-way linkage and redraw when stale","how":"One sandboxed iframe is drawn as a small plate in the margin and expands to a full spread on v; hovering a frame, dependency or figure caption posts {highlight}; the child posts {clicked} and the page jumps to that question and takes keyboard focus back; figure pins (Q1, Q12, Q15...) are placed from the child's region boxes; the stale banner names which reopened question invalidated it and 'Visualize again' (shift+v) redraws to v4 after the working state."},{"finding":"Capability 8: find a past decision in one look or one action","how":"l flips to the record: a document with summary numerals (14 decided, 6 locked, 2 reopened...), a round index, and one statement per question; typing 'transport' filters live to 'Q2 Transport: \"Simpler: the web app writes to a local JSON...\" In your own words, instead of the recommended A. AGENT 21:11 Refinement: two files...'; Enter opens it on the stage. Dependencies in the kicker and margin also open the record at that decision."}],"tradeoffs":["One question per page means you cannot scan a whole round's option texts at once; the strip gives states and titles only, and you clear the round by moving through it.","The margin plate is a picture, not a hit target (the iframe is pointer-events:none while small); region clicks need the full plate (v), which is one extra key.","Editorial scale eats vertical room: with the reply open at 1440x900 the options drop just below the fold until you stage or close it.","The record is a filtered document rather than a graph; the dependency graph appears only locally (hangs off / feeds), not as a drawn tree."],"bestFor":"A developer clearing a round of 7-8 questions from the keyboard who wants to read the agent's verdict and cost at a glance, object in their own words without hunting for a textarea, and re-read what was decided as prose rather than as a list of cards.","palette":[{"name":"Newsprint","hex":"#EEEDE7","role":"page"},{"name":"Newsprint 2","hex":"#E6E4DD","role":"hover and quiet bands"},{"name":"Sheet","hex":"#F5F4EF","role":"plate backing"},{"name":"Ink","hex":"#161513","role":"text, settled state, Send block"},{"name":"Ink 2","hex":"#514E48","role":"body copy, secondary text (7.0:1)"},{"name":"Ink 3","hex":"#66625A","role":"kickers and labels (5.1:1)"},{"name":"Rule","hex":"#CFCDC5","role":"hairlines"},{"name":"Edge","hex":"#86837A","role":"control borders and keycaps (3.05:1)"},{"name":"Vermilion","hex":"#BA2A12","role":"the only accent: staged, reopened, stale, new rec, cost (5.2:1 on page)"},{"name":"Vermilion tint","hex":"#F3DDD7","role":"reopened band, picked option"}],"type":"Newsreader (Google Fonts, static latin instances): opsz 72 at 400 and 300 for display (question 58px at 1440, 50px at 1280, 84px at 1920; 'The record' and 'Plate v3' 44px), opsz 36 italic 400 for the verdict pull-quote (28/26/36px), opsz 16 at 400/500/600 and italic 400 for body (19px), options (17px), record statements (19px) and margin (15px). IBM Plex Mono 400/500 for keycaps, kickers, counts, states, Q numbers and paths at 10.5-13px. All embedded as base64 woff2, 179 KB total.","skillOverrides":["taste-skill serif discipline: a serif is the default here because the concept is explicitly a publication/interview; Newsreader was chosen (not Fraunces or Instrument Serif) and is paired with a mono, no UI sans.","taste-skill dark-mode-by-default: shipped light-only, using its own exception for print-emulating editorial; the palette is a cool newsprint grey, not the banned warm cream + brass family.","taste-skill rotated-text ban: the two chapter dividers in the filmstrip ('Reopened', 'Deferred') are set vertically because they are real section labels in a 78px strip, not decoration.","taste-skill 'no hand-rolled SVG / real images': the page has no images by design; the only picture is the agent's live prototype in the sandboxed iframe.","ui-ux-pro-max 44px touch targets: desktop-only tool, so the floor is make-interfaces-feel-better's 32-40px for dense desktop; every visible control is at least 32px tall.","Brief key map kept but extended: l flips to the record, / also opens it in find mode, shift+v redraws a stale plate, f is an alias of r."],"contractChanges":["Child also posts {regions:[{id,x,y,w,h}]} on load and resize (ids and integers only), so the parent can place figure pins over the plate. Demoed by appending a 300-byte listener to VISUAL_HTML before assigning srcdoc; the sandbox (allow-scripts, no same-origin) and postMessage-only contract are unchanged."]},{"name":"Blast Radius","tagline":"The grill drawn as the graph of decisions it is: rounds flow down, dependencies are edges, and every settled node states what we decided.","skills":["gpt-taste","web-design-engineer (Dieter Rams / Braun recipe, pushed dark)","hallmark (slop test as gate)","make-interfaces-feel-better"],"model":"A dependency map you read and drive like an instrument: the map is the surface, a console under it opens the selected node in place, and a command palette answers or acts on any question in one line.","philosophy":"The real shape of a grill is a dependency graph, not a list: settling Q1 unlocked Q2, and reopening Q15 puts Q17, Q19 and Q20 at risk. So the graph is the page. Time runs top to bottom like a commit log, the frontier row is the heaviest thing on screen because it is where the work is, and every decided node carries its decision as a short statement so the map itself answers 'what did we decide?'. Everything that needs my hand is the single signal colour; everything settled is neutral. Motion exists only to explain causality: a ripple travels down the edges when something reopens, and a commit flash marks what Send just shipped.","principles":[{"principle":"Recognition over recall","decision":"Settled nodes print the decision (\"Q2 Transport · the web app writes to a local JSON…\") on the map; hovering shows the full sentence. You never open anything to remember a past decision."},{"principle":"BLUF / inverted pyramid","decision":"The console leads with the recommendation in a signal-bordered block (option text, then the why that names the cost); the options list and your-words field follow."},{"principle":"Preattentive state encoding","decision":"State is shape and fill before colour: decided = filled neutral, open = signal ring with a soft glow, staged = hatched signal fill with a → line, reopened = dashed signal ring with the old answer struck through, deferred = dotted neutral, at risk = dashed with a lit edge. One accent hue carries all of 'needs me'."},{"principle":"Norman's feedback and causality","decision":"Hovering Reopen previews the ripple; staging it sends a one-shot dash travel down every downstream edge with a depth-staggered flash on each dependent, and the rail chip says 'Q5 reopen → Q8 Q9 Q12 … at risk' before you Send."},{"principle":"One primary action per view","decision":"Accept is the only filled button in the console; Send is the only filled button on the page, pinned in the bottom-right corner (Fitts) and labelled with the live action count."},{"principle":"Hick's law","decision":"Round 9's seven questions are cleared with a, 1–4, d or f; each stage auto-advances to the next open node. The palette's 'Accept the recommendation on all open (7)' collapses the round to one decision when the recs are right."},{"principle":"Gestalt: common region and proximity","decision":"Rounds are horizontal bands with a left label; the frontier band is taller and carries a signal bar. Children are placed at the barycentre of their parents so most edges are short and vertical."},{"principle":"Data-ink ratio","decision":"No cards inside cards, no icons; the map is nodes, edges and labels. Edges not in the selected lineage dim so the lineage reads; the visual's regions connect to nodes with a single dotted leader instead of a legend."}],"fixes":[{"finding":"Every question state unmistakable (cap. 2)","how":"Six visually distinct node treatments by shape and fill (see principles), a 'rec updated' dot and a filled 'durable' square as marks, plus a header readout with live counts: open · reopened · staged · decided · deferred. Reopened nodes strike through the old answer and the console tag reads 'reopened · not settled'."},{"finding":"Answering, one way to write my own words (cap. 3)","how":"a accepts, 1–4 pick, f focuses the single 'answer or push back in your words' field (Enter stages), r focuses the thread reply (a discussion message, visually separate), d defers, o reopens with a hover preview of the blast radius, e explores at once with an undo toast. Staged text answers and replies appear in the thread inside a dashed signal box labelled 'staged, not sent'."},{"finding":"Staging with live counts, auto-advance, unstage, and a clear Send summary (cap. 4)","how":"Counts in the header change as you stage; after each stage the next open node in reading order is selected; u unstages, each rail chip has ×, and the rail lists every staged action as a statement ('Q18 accept A: Copy it next to the doc…', 'Q5 reopen → Q8 Q9 … at risk'). Send shows 'Sent N actions as one turn', flashes a commit ring on each shipped node, and the lamp blinks 'agent working…' for 2 s."},{"finding":"The visual with two-way linkage and redraw (cap. 5)","how":"The visual docks as a picture-in-picture screen in the console (v expands it to 58vh and shrinks the map to a compact strip). Hovering a node posts {highlight} and draws a dotted leader from its region in the PiP up to the node; clicking a region in the frame selects the node; nodes drawn in the visual carry a small outline mark. Stale state is a hatched overlay plus a strip 'stale since Q15 was reopened · Visualize'; Visualize redraws (v3 → v4) with a working state."},{"finding":"Find a past decision in one look or one action (cap. 8)","how":"One look: the statement is printed on the node. One action: ⌘K then 'transport' shows 'Q2 Transport — decided · Transport: the web app writes to a local JSON…' as the top item; Enter opens it with the full decision, the agent's refinement in the thread, and its lineage lit on the map."}],"tradeoffs":["Time runs top to bottom (rounds as rows) rather than left to right as the concept sketched; it was the only way to fit 25 nodes with readable statements at 1440×900 and 1280×800. The trade is that the console sits under the map, so the map gets ~470 px of height and the frontier row's titles are clamped to two lines.","A graph is denser to learn than a list: state is carried by six node treatments plus edges, so the first minute costs more than an inbox. The payoff is that dependencies, blast radius and history are visible at once instead of being reconstructed.","At 1280×800 the question body is hidden in the console (only the title, recommendation, why and options remain) to keep the map's two-line nodes; the body is one hover or one node click away.","The sandboxed iframe contract is kept intact (sandbox=\"allow-scripts\", postMessage only, source check). The one extension, the child posting its region rectangles, is appended at runtime and is ids and numbers only; without it the leader lines simply do not draw."],"bestFor":"Sessions past round 3, where dependencies and reopens matter more than the next card: multi-week design grills with durable decisions, and anyone who asks 'what did we decide on X, and what depends on it?' more than once a day.","palette":[{"name":"paper","hex":"#1a1815","role":"ground, warm charcoal (oklch 17% 0.007 60)"},{"name":"paper-2 / paper-3 / paper-4","hex":"#201d1a / #29251f / #332e28","role":"console, decided-node fill, raised surfaces"},{"name":"ink","hex":"#ece7dd","role":"primary text, selection outline, lineage edges"},{"name":"ink-2","hex":"#bab3a6","role":"secondary text, durable mark"},{"name":"muted","hex":"#978f82","role":"labels, statements on decided nodes, readout keys"},{"name":"signal","hex":"#f08a44","role":"the one accent: open ring, staged hatch, reopened dash, at-risk edges, Accept and Send, agent lamp"},{"name":"signal-ink","hex":"#1e1612","role":"text on signal fills"}],"type":"IBM Plex Sans (variable, 400–600) for titles, body and controls; IBM Plex Mono 400/500 for ids, statements, readouts, key caps and the palette meta. Scale 11 / 12 / 13 / 14 / 15 / 17 px; node title 13 medium, statement 11 mono, console title 17 medium, recommendation 15 medium. Tabular numerals on every live count. Embedded latin subsets, ~59 KB raw / ~79 KB base64.","skillOverrides":["gpt-taste: ignored the marketing-page directives (AIDA sections, hero, bento, GSAP, picsum imagery); kept its no-emoji, no-meta-label and container-width discipline. Round labels and question ids are real data axes, not meta-labels.","web-design-engineer: skipped the confirm-before-coding checkpoints (no user in the loop) and used the Dieter Rams / Braun recipe inverted to a dark faceplate with the single signal orange instead of a light concrete ground.","hallmark: no macrostructure catalog rotation, nav or footer archetype (this is an app surface, not a page); the stamp, token discipline, slop-test contrast gates and the ban on italic headers and re-drawn chrome were applied. The visual's own browser chrome belongs to the agent's VISUAL_HTML and is left untouched.","make-interfaces-feel-better: shadows-for-elevation was not applied to nodes because their borders carry state; scale-on-press at 0.96, tabular numerals, concentric radii (2/3/4 px) and property-specific transitions were."],"contractChanges":["The child also posts {regions:[{id,x,y,w,h}]} on load and resize (and on document resize via ResizeObserver), ids and rounded numbers only; the parent uses it to draw dotted leader lines from a region to its node. Demoed by appending a 9-line listener to VISUAL_HTML before assigning srcdoc. Highlight and clicked messages are unchanged."]}];

ar(--paper-muted); }\n.note-f .deps b { color: var(--paper-ink-2); font-weight: 500; }\n\n/* ── dialogs ─────────────────────────────────────────── */\ndialog {\n  position: fixed; inset: 0; margin: auto; height: fit-content; max-height: min(80vh, 640px); overflow: auto;\n  width: min(560px, calc(100vw - 48px)); padding: 0; border: 1px solid var(--rule); border-radius: 4px;\n  background: var(--wall-2); color: var(--ink); box-shadow: 0 30px 60px -20px oklch(0 0 0 / 0.7);\n}\ndialog::backdrop { background: oklch(10% 0.01 55 / 0.55); }\n.dlg-h { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 6px; }\n.dlg-h h2 { font-size: var(--text-xl); letter-spacing: -0.015em; }\n.dlg-h span { font-size: var(--text-sm); color: var(--muted); }\n.dlg-b { padding: 6px 22px 22px; }\n.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; margin: 8px 0 0; }\n.keys div { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--rule-2); }\n.keys kbd { color: var(--ink); border-color: var(--rule); min-width: 22px; height: 20px; }\n.keys .k2 { display: inline-flex; gap: 4px; }\n.keys .grp { grid-column: 1 / -1; padding: 14px 0 2px; border: 0; font: 600 12.5px/1 var(--font-display); color: var(--muted); }\n.term { padding: 10px 0 12px; border-bottom: 1px solid var(--rule-2); display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 16px; }\n.term:last-child { border-bottom: 0; }\n.term h3 { font-size: var(--text-md); font-weight: 600; }\n.term p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }\n.term .avoid { grid-column: 2; font-size: var(--text-sm); color: var(--muted); }\n.term .avoid s { text-decoration-color: var(--accent); color: var(--ink-2); margin-right: 8px; }\n.dlg-a { display: flex; justify-content: flex-end; gap: 8px; padding: 0 22px 22px; }\n.dlg-a .mbtn { height: 36px; padding: 0 14px; }\n.dlg-a .mbtn.primary { background: var(--ink); color: var(--wall-deep); border-color: var(--ink); }\n.dlg-a .mbtn.primary:hover { background: var(--ink-2); color: var(--wall-deep); }\n.dlg-p { font-size: 14px; line-height: 1.55; color: var(--ink-2); margin: 0 0 8px; }\n.dlg-p b { color: var(--ink); font-weight: 500; }\n.dlg-list { margin: 8px 0 0; padding: 0 0 0 18px; color: var(--ink-2); font-size: 13.5px; }\n.dlg-list li { padding: 2px 0; }\n\n/* ── toasts ─────────────────────────────────────────── */\n.toasts { position: fixed; left: var(--space-lg); bottom: var(--space-lg); z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }\n.toast {\n  pointer-events: auto; display: flex; align-items: center; gap: 14px; min-width: 280px; max-width: 460px;\n  padding: 11px 12px 11px 14px; border-radius: 4px; background: var(--paper); color: var(--paper-ink); box-shadow: var(--shadow-note);\n  font-size: 13.5px; opacity: 0; transform: translateY(8px);\n  transition: opacity var(--dur-long) var(--ease-out), transform var(--dur-long) var(--ease-out);\n}\n.toast.in { opacity: 1; transform: none; }\n.toast.out { opacity: 0; transform: translateY(-8px); transition-duration: 220ms; transition-timing-function: var(--ease-in); }\n.toast button { margin-left: auto; height: 28px; padding: 0 10px; border-radius: 3px; border: 1px solid var(--paper-rule); font-size: 12.5px; color: var(--accent-deep); font-weight: 500; }\n.toast button:hover { background: var(--paper-2); }\n.toast .close { color: var(--paper-muted); border: 0; font-family: var(--font-mono); padding: 0 6px; margin-left: 0; }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 150ms !important; animation-iteration-count: 1 !important; transition-duration: 120ms !important; }\n  .note, .toast { transform: none !important; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"mast\">\n  \u003cdiv class=\"mast-l\">\n    \u003ch1 class=\"topic\" id=\"topic\">—\u003c/h1>\n    \u003cspan class=\"doc mono\">→ \u003cb id=\"docpath\">—\u003c/b>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"mast-r\">\n    \u003cbutton class=\"agent-status\" id=\"agent\" data-state=\"waiting\" title=\"Agent status · click cycles the state for this demo\">\u003ci class=\"lamp\">\u003c/i>\u003cspan id=\"agent-text\">Agent waiting on you\u003c/span>\u003c/button>\n    \u003cbutton class=\"mbtn\" id=\"btn-terms\">Terms \u003ckbd>t\u003c/kbd>\u003c/button>\n    \u003cbutton class=\"mbtn icon\" id=\"btn-keys\" aria-label=\"Keyboard shortcuts\">?\u003c/button>\n    \u003cbutton class=\"mbtn\" id=\"btn-finish\">Finish\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain class=\"room\">\n  \u003csection class=\"wall\" id=\"wall\" aria-label=\"The wall\">\n    \u003cdiv class=\"strip\" id=\"strip\" aria-label=\"This round\">\n      \u003cdiv class=\"round\" id=\"roundline\">\u003c/div>\n      \u003cdiv class=\"strip-pins\" id=\"strip-pins\" role=\"list\">\u003c/div>\n      \u003cdiv class=\"strip-cur\" id=\"strip-cur\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"print\" id=\"print\">\n      \u003ciframe id=\"frame\" sandbox=\"allow-scripts\" title=\"Agent prototype\">\u003c/iframe>\n    \u003c/div>\n    \u003cdiv class=\"overlay\" id=\"overlay\">\u003c/div>\n    \u003cdiv class=\"seal\" id=\"seal\" hidden>out of date\u003c/div>\n    \u003cdiv class=\"caption\" id=\"caption\">\u003c/div>\n    \u003cdiv class=\"vthread\" id=\"vthread\" aria-label=\"Notes on the drawing\">\u003c/div>\n  \u003c/section>\n\n  \u003caside class=\"margin\" aria-label=\"Margin: the record and the handback tray\">\n    \u003cdiv class=\"ledger-wrap\">\n      \u003cdiv>\n        \u003cdiv class=\"mhead\">\u003ch2>Settled\u003c/h2>\u003cspan id=\"settled-sub\">the record\u003c/span>\u003c/div>\n        \u003cinput class=\"find\" id=\"find\" type=\"search\" placeholder=\"Find a decision   /\" aria-label=\"Find a decision\">\n      \u003c/div>\n      \u003col class=\"ledger\" id=\"ledger\">\u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"slip\">\n      \u003cdiv class=\"slip-h\">\u003ch2>Handing back\u003c/h2>\u003cspan id=\"slip-sub\">nothing staged\u003c/span>\u003c/div>\n      \u003cul class=\"slip-list\" id=\"slip-list\">\u003c/ul>\n      \u003cbutton class=\"send\" id=\"btn-send\" data-empty>Send to agent \u003ckbd>⌘↵\u003c/kbd>\u003c/button>\n    \u003c/div>\n  \u003c/aside>\n\u003c/main>\n\n\u003carticle class=\"note\" id=\"note\" role=\"dialog\" aria-modal=\"false\" aria-label=\"Question\">\u003c/article>\n\n\u003cdialog id=\"dlg-keys\">\n  \u003cdiv class=\"dlg-h\">\u003ch2>Keys\u003c/h2>\u003cspan>ignored while typing, except ⌘↵ and Esc\u003c/span>\u003c/div>\n  \u003cdiv class=\"dlg-b\">\n    \u003cdiv class=\"keys\" id=\"keys\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"dlg-a\">\u003cbutton class=\"mbtn\" data-close>Close \u003ckbd>Esc\u003c/kbd>\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"dlg-terms\">\n  \u003cdiv class=\"dlg-h\">\u003ch2>Terms\u003c/h2>\u003cspan>settled vocabulary, with words to avoid\u003c/span>\u003c/div>\n  \u003cdiv class=\"dlg-b\" id=\"terms\">\u003c/div>\n  \u003cdiv class=\"dlg-a\">\u003cbutton class=\"mbtn\" data-close>Close \u003ckbd>Esc\u003c/kbd>\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"dlg-finish\">\n  \u003cdiv class=\"dlg-h\">\u003ch2>Finish the grill?\u003c/h2>\u003c/div>\n  \u003cdiv class=\"dlg-b\" id=\"finish-body\">\u003c/div>\n  \u003cdiv class=\"dlg-a\">\u003cbutton class=\"mbtn\" data-close>Keep going\u003c/button>\u003cbutton class=\"mbtn primary\" id=\"finish-go\">Write the doc\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cdiv class=\"toasts\" id=\"toasts\" aria-live=\"polite\">\u003c/div>\n\u003cdiv class=\"sr\" id=\"live\" aria-live=\"polite\">\u003c/div>\n\n\u003cscript>// Mockup data for design/mockups (spec §9.1). Inlined into each *.template.html by build.mjs.\n// SESSION is in the real state.json shape (spec §4; Jason's schema, grill-with-ui SKILL.md:392-417):\n// questions is an ARRAY; rounds are derived from question.round.\n// Rounds 1–8 are Jason Ku's real grill-with-ui design session of 2026-09-06 (commit daafa1e,\n// design/mockups/data.js), text unchanged. Round 9 (q18–q25) is synthetic: 7 open + q23 deferred;\n// q15 and q16 were answered, then reopened (see their threads); the visual (v3) is stale.\n// VISUAL_HTML is the v3 prototype: regions carry data-q and it ends with the verbatim\n// grilling-ui linkage listener (plan Task 20). \"\u003c\\/script>\" keeps it safe when inlined in \u003cscript>.\nconst SESSION = {\n  \"topic\": \"grill-with-ui skill\",\n  \"doc\": \"docs/design.md\",\n  \"project\": \"~/Projects/grill-with-ui\",\n  \"created\": \"2026-09-06T21:00:00Z\",\n  \"agent\": {\n    \"status\": \"waiting\",\n    \"since\": \"2026-09-06T22:46:00Z\",\n    \"handled\": 9\n  },\n  \"note\": \"Round 9 is open. Q15 and Q16 were reopened by later answers; Q23 is deferred.\",\n  \"visual\": {\n    \"kind\": \"prototype\",\n    \"version\": 3,\n    \"at\": \"2026-09-06T22:31:00Z\",\n    \"stale\": true,\n    \"note\": \"v3: Inbox layout with the doc path in the send bar per Q9; stale since Q15 was reopened\",\n    \"thread\": [\n      {\n        \"who\": \"user\",\n        \"text\": \"Put the doc path next to Finish so I can see where it will write.\",\n        \"at\": \"2026-09-06T22:26:00Z\"\n      },\n      {\n        \"who\": \"agent\",\n        \"text\": \"Done in v3: the send bar shows → docs/design.md and the section order from Q16.\",\n        \"at\": \"2026-09-06T22:31:00Z\"\n      }\n    ]\n  },\n  \"terms\": [\n    {\n      \"term\": \"Round\",\n      \"def\": \"One agent turn's worth of new questions: the current frontier.\",\n      \"avoid\": [\n        \"batch\",\n        \"wave\"\n      ]\n    },\n    {\n      \"term\": \"Frontier\",\n      \"def\": \"Questions whose prerequisites are all settled and can be asked now.\",\n      \"avoid\": [\n        \"queue\",\n        \"next up\"\n      ]\n    },\n    {\n      \"term\": \"Send\",\n      \"def\": \"One press of Send to Agent: every staged action shipped as a single event.\",\n      \"avoid\": [\n        \"submit\",\n        \"reply\"\n      ]\n    },\n    {\n      \"term\": \"Durable decision\",\n      \"def\": \"Hard to reverse, surprising without context, a real trade-off. Goes under Locked decisions.\",\n      \"avoid\": [\n        \"ADR\",\n        \"big decision\"\n      ]\n    }\n  ],\n  \"questions\": [\n    {\n      \"id\": \"q1\",\n      \"round\": 1,\n      \"deps\": [],\n      \"title\": \"UI surface\",\n      \"body\": \"What is the UI surface, and how does it talk to the running session? This is the root decision; state format, threads and resume all hang off it.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Local browser app. A tiny bundled server serves a page and reads/writes one state file per session. Terminal stays a parallel input.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Read-only side panel. Claude re-renders an HTML summary each turn; you still answer in the terminal by number.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"MCP app panel. Only if Claude Code renders it. Heavier to build and install.\"\n        },\n        {\n          \"k\": \"D\",\n          \"text\": \"Terminal TUI. Doesn't solve scrollback. Listed to rule out.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Works in any terminal today, nothing to install, and the file protocol is agent-neutral so a Codex version is packaging, not a rewrite.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\",\n        \"text\": \"A is exactly what I was thinking\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q2\",\n      \"round\": 2,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Transport\",\n      \"body\": \"How does a browser answer reach the running Claude session? Docs check: Monitor wakes an idle session; a background shell exiting does not; Channels need a launch flag.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Persistent Monitor on the server's WebSocket. Every browser action is one event and one Claude turn.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Claude Code Channels. Officially blessed, but needs a startup flag and a plugin.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Manual nudge: answer in the browser, type 'go' in the terminal.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"No startup flags, works from inside the skill. Live test fired while idle: verified.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"text\",\n        \"text\": \"Simpler: the web app writes to a local JSON and the agent has a file-change watcher on it.\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"agent\",\n          \"text\": \"Yes, and simpler than what I proposed. Refinement: two files, not one. state.json written only by the agent; events.jsonl appended only by the web app, watched with plain tail -F.\",\n          \"at\": \"2026-09-06T21:11:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q3\",\n      \"round\": 3,\n      \"deps\": [\n        \"q2\"\n      ],\n      \"title\": \"Questions per turn\",\n      \"body\": \"When Claude replies to a batch, how many new questions does it post on top of the thread replies?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Exactly one new primary question per turn. Keeps 'resolve dependencies one by one'.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Up to a few new questions when they're independent. Fewer round trips; recommendations can go stale.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"You already batch on your side; keeping Claude to one at a time is what makes recommendations trustworthy.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"option\",\n        \"option\": \"B\",\n        \"text\": \"\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q4\",\n      \"round\": 3,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Thread context\",\n      \"body\": \"What does 'chat more about a question without losing context' mean mechanically?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"One Claude session; threads are labeled messages. Nothing is separate under the hood.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"A subagent per thread, seeded with a summary. Isolation, but loses exactly the context you want.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"The thing you're missing is navigation, not isolation. The page provides that.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q5\",\n      \"round\": 4,\n      \"deps\": [\n        \"q4\"\n      ],\n      \"title\": \"Question card shape\",\n      \"body\": \"What does a question look like on the page, and how do you answer it? This fixes the state schema.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Structured card: title, body, lettered options, a recommendation pointing at one, a rationale. Answer by option, Accept, or free text. Thread box separate.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Free text everywhere. Simpler schema, no one-click accept.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Grilling already produces lettered options and a named recommendation, so structure costs nothing.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q6\",\n      \"round\": 4,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Terminal role\",\n      \"body\": \"What does the terminal do while a grill runs in the page?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"One-line status per turn, plus the URL. Terminal typing still works and is recorded into state.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Terminal goes silent. Launch only.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Terminal mirrors the full text. Defeats the purpose.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Same scrollback cost as silence, and it gives you the 'Claude is waiting' signal where you're already looking.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q7\",\n      \"round\": 4,\n      \"deps\": [\n        \"q2\"\n      ],\n      \"title\": \"Server lifecycle\",\n      \"body\": \"Who starts and stops the local server, and how do we guarantee it dies? Orphaned processes have bitten this machine before.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"The server is the monitor. It lives exactly as long as the monitor: killed at session end or on Finish. Nothing to orphan.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Server in the background, separate tail watcher. Needs its own shutdown story; every option is a way to leak.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Same file-based design, with writer and watcher collapsed into one process the harness already manages.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q8\",\n      \"round\": 5,\n      \"deps\": [\n        \"q5\"\n      ],\n      \"title\": \"Finish + deliverable\",\n      \"body\": \"How does a grill end, and what's the deliverable? Past grills all ended as design docs.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Explicit Finish button; Claude writes a markdown decisions doc from state. Doc path asked once at start.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"No explicit end; the state file is the record.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Writing from a structured state file is more faithful than writing from a long transcript.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"user\",\n          \"text\": \"Can you also look up Matt Pocock's grill-with-docs skill to see what we can borrow for the docs part, and compare it to the docs we already generate?\", v class=\"app assumed\" data-q=\"q15\" data-tag=\"assumed · Q15 open\">\n    \u003cnav>\n      \u003cdiv>R1 · UI surface ✓\u003c/div>\u003cdiv>R2 · Transport ✓\u003c/div>\u003cdiv>R8 · Page visual direction ↺\u003c/div>\u003cdiv class=\"cur\">R9 · Where does Finish save…\u003c/div>\u003cdiv>R9 · Should the visual run…\u003c/div>\n    \u003c/nav>\n    \u003cmain>\n      \u003cdiv class=\"card\" data-q=\"q5\">\n        \u003ch2>Where does Finish save the visual?\u003c/h2>\n        \u003cdiv class=\"opt rec\">A · Copy it next to the doc as docs/&lt;slug&gt;-visual.html\u003c/div>\n        \u003cdiv class=\"opt\">B · Leave it in the session folder\u003c/div>\n        \u003cdiv class=\"opt\">C · Inline a screenshot\u003c/div>\n      \u003c/div>\n    \u003c/main>\n  \u003c/div>\n  \u003cfooter data-q=\"q9\">\u003cspan class=\"doc\">→ docs/design.md · Terms · Locked · Routine\u003c/span>\u003cbutton>Finish grill\u003c/button>\u003cbutton class=\"primary\">Send to Agent\u003c/button>\u003c/footer>\n  \u003cdiv class=\"term\" data-q=\"q6\">● grill-with-ui: round 9 posted · 7 open · waiting on the page\u003c/div>\n\u003cscript>\n/* grilling-ui linkage: copy verbatim */\n(() => {\n  const P = window.parent;\n  const st = document.createElement(\"style\");\n  st.textContent = \".grill-hl{outline:2px solid #8a5a12;outline-offset:2px}\";\n  document.head.appendChild(st);\n  addEventListener(\"message\", (e) => {\n    if (e.source !== P || !e.data || !Array.isArray(e.data.highlight)) return;\n    const ids = e.data.highlight.filter((x) => /^q\\\\d+$/.test(x));\n    document.querySelectorAll(\"[data-q]\").forEach((el) => el.classList.toggle(\"grill-hl\", ids.includes(el.dataset.q)));\n  });\n  addEventListener(\"click\", (e) => { const r = e.target.closest(\"[data-q]\"); if (r) P.postMessage({ clicked: r.dataset.q }, \"*\"); });\n  addEventListener(\"keydown\", (e) => {\n    if ((e.metaKey || e.ctrlKey) && e.key === \"Enter\") { e.preventDefault(); P.postMessage({ key: \"send\" }, \"*\"); }\n    else if (e.key === \"Escape\") P.postMessage({ key: \"escape\" }, \"*\");\n  });\n})();\n\u003c\\/script>\n\u003c/body>\n\u003c/html>\n`;\n\u003c/script>\n\u003cscript>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };\nconst S = SESSION;\nconst Q = S.questions;\nconst byId = Object.fromEntries(Q.map(q => [q.id, q]));\nconst num = id => id.replace(/^q/, '');\nconst FRONTIER_ROUND = Math.max(...Q.map(q => q.round));\n\n// ── state ───────────────────────────────────────────────\nconst staged = new Map();        // id -> {kind, option?, text?}\nconst stagedReplies = new Map(); // id -> [text]\nlet selected = null;\nlet noteOpen = false;\nlet regions = {};                // id -> {x,y,w,h} in child px\nlet child = { w: 760, h: 440 };\nlet geo = { L: 0, T: 0, s: 1 };\nlet visual = { version: S.visual.version, stale: S.visual.stale, at: S.visual.at, note: S.visual.note };\nlet agent = S.agent.status === 'waiting' ? 'waiting' : S.agent.status === 'working' ? 'working' : 'none';\nlet sendTimer = null;\nlet booted = false;\n\n// ── helpers on questions ────────────────────────────────\nconst effStatus = q => staged.has(q.id) ? 'staged' : q.status;\nconst isFrontier = q => q.round === FRONTIER_ROUND || q.status === 'reopened';\nconst frontier = () => Q.filter(isFrontier);\nconst settled = () => Q.filter(q => q.status === 'answered' || q.status === 'deferred' || (isFrontier(q) && staged.has(q.id) && ['reopen'].includes(staged.get(q.id).kind)));\nconst optText = (q, k) => (q.options.find(o => o.k === k) || {}).text || '';\nfunction statement(q) {\n  const a = q.answer; if (!a) return '';\n  if (a.kind === 'text') return a.text;\n  return optText(q, a.option);\n}\nfunction short(s, n = 68) {\n  if (!s) return '';\n  let t = s.split(/(?\u003c=[.!?])\\s/)[0];\n  if (t.length > n) t = t.slice(0, n - 1).replace(/\\s+\\S*$/, '') + '…';\n  return t;\n}\nfunction stagedLabel(q) {\n  const st = staged.get(q.id); if (!st) return '';\n  if (st.kind === 'accept') return `accept ${st.option} · ${short(optText(q, st.option), 48)}`;\n  if (st.kind === 'option') return `${st.option} · ${short(optText(q, st.option), 48)}`;\n  if (st.kind === 'text') return `in my words · ${short(st.text, 52)}`;\n  if (st.kind === 'defer') return 'defer';\n  if (st.kind === 'reopen') return 'reopen';\n  return st.kind;\n}\nconst reopenedNow = () => Q.filter(q => q.status === 'reopened' || (staged.get(q.id) || {}).kind === 'reopen').map(q => q.id);\nconst shakenBy = q => q.deps.filter(d => reopenedNow().includes(d));\n\n// anchor rule: own region → direct dep's region → hang off a pinned parent → margin\nfunction anchorOf(q, seen = new Set()) {\n  if (regions[q.id]) return { region: q.id, depth: 0 };\n  for (const d of q.deps) if (regions[d]) return { region: d, depth: 1, via: d };\n  for (const d of q.deps) {\n    const p = byId[d]; if (!p || seen.has(d) || !isFrontier(p)) continue;\n    seen.add(d); const a = anchorOf(p, seen); if (a) return { region: a.region, depth: 2, via: d };\n  }\n  return null;\n}\nconst navOrder = () => frontier().sort((a, b) => +num(a.id) - +num(b.id));\n\n// ── masthead ─────────────────────────────────────────────\n$('#topic').textContent = S.topic;\n$('#docpath').textContent = S.doc;\nfunction renderCounts() {\n  const f = frontier();\n  const open = f.filter(q => effStatus(q) === 'open').length;\n  const reop = f.filter(q => effStatus(q) === 'reopened').length;\n  const st = staged.size + [...stagedReplies.values()].reduce((n, a) => n + a.length, 0);\n  const def = f.filter(q => effStatus(q) === 'deferred').length;\n  const b = (n) => `\u003cb class=\"num\"${n ? '' : ' data-zero'}>${n}\u003c/b>`;\n  $('#roundline').innerHTML = `\u003cstrong>Round ${FRONTIER_ROUND}\u003c/strong>\u003cspan class=\"counts\">${b(open)} open · ${b(reop)} reopened · \u003cb class=\"num mine\"${st ? '' : ' data-zero'}>${st}\u003c/b> staged · ${b(def)} deferred\u003c/span>`;\n}\nfunction setAgent(state) {\n  agent = state;\n  const a = $('#agent'); a.dataset.state = state;\n  $('#agent-text').textContent = state === 'waiting' ? 'Agent waiting on you' : state === 'working' ? 'Agent working…' : 'No agent listening · requests queue';\n  renderSlip();\n}\n$('#agent').addEventListener('click', () => setAgent(agent === 'waiting' ? 'none' : agent === 'none' ? 'working' : 'waiting'));\n\n// ── the print (visual) ───────────────────────────────────\nconst frame = $('#frame'), print = $('#print'), wall = $('#wall'), overlay = $('#overlay'), seal = $('#seal'), caption = $('#caption');\nconst EXT = `\u003cscript>/* grilling-ui contract extension: regions + size, ids and numbers only */(()=>{const P=window.parent;const send=()=>{const r=[...document.querySelectorAll('[data-q]')].map(e=>{const b=e.getBoundingClientRect();return{id:e.dataset.q,x:Math.round(b.left+scrollX),y:Math.round(b.top+scrollY),w:Math.round(b.width),h:Math.round(b.height)}});P.postMessage({regions:r,w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight},'*')};addEventListener('load',send);addEventListener('resize',send);})();\u003c` + `/script>`;\nfunction loadVisual() { frame.srcdoc = VISUAL_HTML.replace('\u003c/body>', EXT + '\u003c/body>'); }\nwindow.addEventListener('message', (e) => {\n  if (e.source !== frame.contentWindow || !e.data) return;\n  const d = e.data;\n  if (Array.isArray(d.regions)) {\n    regions = {}; for (const r of d.regions) if (/^q\\d+$/.test(r.id) && [r.x, r.y, r.w, r.h].every(Number.isFinite)) regions[r.id] = r;\n    if (Number.isFinite(d.h)) child = { w: d.w || 820, h: Math.max(240, d.h) };\n    layout(); renderFrontier(); if (noteOpen) positionNote();\n    if (!booted) { booted = true; const first = navOrder().find(q => ['open', 'reopened'].includes(effStatus(q)) && q.status !== 'reopened') || navOrder()[0]; if (first) select(first.id, { open: true }); }\n  }\n  if (typeof d.clicked === 'string' && byId[d.clicked]) { select(d.clicked, { open: true }); }\n  if (d.key === 'send') doSend();\n  if (d.key === 'escape') escape();\n});\nfunction postHighlight(ids) { lastHighlight = ids; try { frame.contentWindow.postMessage({ highlight: ids }, '*'); } catch (_) {} }\nlet lastHighlight = [];\n\nfunction layout() {\n  const W = wall.clientWidth, H = wall.clientHeight;\n  const padL = 40, gutter = 212, top = 92, bottom = 56;\n  const fw = 760, fh = child.h;\n  let s = Math.min((W - padL - gutter) / fw, (H - top - bottom) / fh, 1.5);\n  s = Math.max(0.55, s);\n  const L = Math.round(Math.max(padL, (W - gutter - fw * s) / 2)), T = top;\n  geo = { L, T, s, fw, fh };\n  frame.style.height = fh + 'px';\n  print.style.transform = `translate(${L}px, ${T}px) scale(${s})`;\n  print.classList.toggle('is-stale', visual.stale);\n  // caption under the print\n  caption.style.left = L + 'px'; caption.style.top = Math.round(T + fh * s + 14) + 'px';\n  const vt = $('#vthread'); vt.style.left = L + 'px'; vt.style.top = Math.round(T + fh * s + 48) + 'px'; vt.style.width = Math.round(fw * s) + 'px';\n  seal.hidden = !visual.stale;\n  seal.style.left = Math.round(L + fw * s - 124) + 'px'; seal.style.top = Math.round(T + fh * s - 24) + 'px';\n  renderOverlay();\n}\nnew ResizeObserver(() => layout()).observe(wall);\n\nfunction renderCaption() {\n  const t = new Date(visual.at);\n  const hh = t.toISOString().slice(11, 16);\n  caption.innerHTML = '';\n  const v = el('span'); v.innerHTML = `Prototype \u003cb>v${visual.version}\u003c/b> · drawn ${hh}`;\n  caption.append(v);\n  if (visual.stale) {\n    const w = el('span', 'warn'); const reop = Q.filter(q => q.status === 'reopened').map(q => 'Q' + num(q.id));\n    w.textContent = `out of date since ${reop.join(' and ')} reopened`; caption.append(w);\n    const b = el('button'); b.innerHTML = `Redraw \u003ckbd>v\u003c/kbd>`; b.disabled = agent === 'working'; b.addEventListener('click', doVisualize); caption.append(b);\n  } else {\n    const ok = el('span'); ok.textContent = 'current'; caption.append(ok);\n  }\n  const vt = $('#vthread'); vt.innerHTML = '';\n  for (const m of (S.visual.thread || [])) {\n    const row = el('div', 'vmsg ' + m.who); row.innerHTML = `\u003cspan class=\"who\">${m.who === 'agent' ? 'agent' : 'me'} \u003cspan class=\"at\">${fmtAt(m.at)}\u003c/span>\u003c/span>\u003cspan>${escapeHtml(m.text)}\u003c/span>`; vt.append(row);\n  }\n  vt.style.left = geo.L + 'px'; vt.style.top = Math.round(geo.T + geo.fh * geo.s + 48) + 'px'; vt.style.width = Math.round(geo.fw * geo.s) + 'px';\n}\n\n// overlay: regions, pins, stamps\nconst pinEls = new Map();   // id -> pin element on the print\nconst regEls = new Map();\nfunction renderOverlay() {\n  overlay.innerHTML = ''; pinEls.clear(); regEls.clear();\n  const { L, T, s } = geo;\n  const rect = r => ({ x: L + r.x * s, y: T + r.y * s, w: r.w * s, h: r.h * s });\n  // region boxes\n  for (const [id, r] of Object.entries(regions)) {\n    const q = byId[id]; const b = rect(r);\n    const d = el('div', 'reg'); d.dataset.id = id;\n    Object.assign(d.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });\n    if (q && reopenedNow().includes(id)) d.classList.add('hatch');\n    overlay.append(d); regEls.set(id, d);\n  }\n  // decided regions → labels in the gutter beside the print, with a leader to the region\n  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'leads'); svg.setAttribute('aria-hidden', 'true'); overlay.append(svg);\n  const gx = Math.round(L + geo.fw * s + 22);\n  const decided = Object.entries(regions).filter(([id]) => byId[id] && byId[id].status === 'answered')\n    .map(([id, r]) => ({ id, q: byId[id], b: rect(r) })).sort((a, b) => (a.b.y + a.b.h / 2) - (b.b.y + b.b.h / 2));\n  let prevBottom = T - 8;\n  for (const { id, q, b } of decided) {\n    const lab = el('button', 'label' + (q.du  if (repTa) repTa.addEventListener('keydown', taKeys(() => act('reply-stage', q), () => act('reply-cancel', q)));\n}\nconst taKeys = (stageFn, cancelFn) => (e) => {\n  if (e.isComposing) return;\n  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); stageFn(); }\n  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelFn(); }\n};\nfunction act(kind, q) {\n  switch (kind) {\n    case 'accept': stage(q.id, { kind: 'accept', option: q.rec.option }); break;\n    case 'defer': stage(q.id, { kind: 'defer' }); break;\n    case 'reopen': stage(q.id, { kind: 'reopen' }); break;\n    case 'own': openNote('own'); break;\n    case 'own-cancel': openNote(); break;\n    case 'own-stage': { const t = ($('#own-ta').value || '').trim(); if (!t) { $('#own-ta').focus(); return; } stage(q.id, { kind: 'text', text: t }); break; }\n    case 'reply': openNote('reply'); break;\n    case 'reply-cancel': openNote(); break;\n    case 'reply-stage': { const t = ($('#reply-ta').value || '').trim(); if (!t) { $('#reply-ta').focus(); return; } (stagedReplies.get(q.id) || stagedReplies.set(q.id, []).get(q.id)).push(t); refresh(); openNote(); break; }\n    case 'explore': doExplore(q); break;\n    case 'unstage': staged.delete(q.id); refresh(); openNote(); break;\n  }\n}\nfunction stage(id, what) {\n  staged.set(id, what);\n  refresh();\n  advance(id);\n}\nfunction advance(fromId) {\n  const order = navOrder();\n  const i = order.findIndex(q => q.id === fromId);\n  const next = [...order.slice(i + 1), ...order.slice(0, i)].find(q => ['open', 'reopened'].includes(effStatus(q)));\n  if (next) { select(next.id, { open: true }); }\n  else { closeNote(); $('#btn-send').focus({ preventScroll: true }); $('#live').textContent = 'Round cleared. Send when ready.'; }\n}\nfunction refresh() { renderCounts(); renderOverlay(); renderFrontier(); renderLedger($('#find').value); renderSlip(); if (noteOpen) { renderNote(byId[selected]); positionNote(); } }\n\n// ── send / explore / visualize / finish ──────────────────\nfunction work(then, ms = 2000) {\n  setAgent('working'); renderCaption();\n  clearTimeout(sendTimer);\n  sendTimer = setTimeout(() => { setAgent('waiting'); if (then) then(); renderCaption(); }, ms);\n}\nfunction doSend() {\n  if (agent === 'working') return;\n  const n = staged.size + [...stagedReplies.values()].reduce((a, b) => a + b.length, 0);\n  if (!n) { toast('Nothing staged to send.'); return; }\n  if (agent === 'none') { toast(`Queued ${n} ${n === 1 ? 'action' : 'actions'} · they send when an agent listens.`); return; }\n  // apply staged marks to the record\n  for (const [id, st] of staged) {\n    const q = byId[id];\n    if (st.kind === 'defer') { q.status = 'deferred'; q.answer = null; }\n    else if (st.kind === 'reopen') { q.status = 'reopened'; (q.thread ||= []).push({ who: 'user', text: 'Reopened from the wall.', at: new Date().toISOString() }); }\n    else { q.status = 'answered'; q.answer = st.kind === 'text' ? { kind: 'text', text: st.text } : { kind: st.kind, option: st.option, text: '' }; }\n  }\n  for (const [id, arr] of stagedReplies) for (const t of arr) (byId[id].thread ||= []).push({ who: 'user', text: t, at: new Date().toISOString() });\n  staged.clear(); stagedReplies.clear();\n  closeNote();\n  toast(`Sent ${n} ${n === 1 ? 'action' : 'actions'} as one turn.`);\n  work(() => refresh());\n  refresh();\n}\nfunction doExplore(q) {\n  if (agent === 'working') return;\n  let undone = false;\n  work(() => { if (!undone) (q.thread ||= []).push({ who: 'user', text: 'Explore this deeper before I answer.', at: new Date().toISOString() }); if (noteOpen) openNote(); }, 2400);\n  toast(`Asked the agent to explore Q${num(q.id)} deeper.`, { label: 'Undo', run: () => { undone = true; clearTimeout(sendTimer); setAgent('waiting'); renderCaption(); } });\n}\nfunction doVisualize() {\n  if (agent === 'working') return;\n  work(() => { visual = { ...visual, version: visual.version + 1, stale: false, at: new Date().toISOString() }; layout(); renderCaption(); }, 2000);\n}\nfunction openFinish() {\n  const open = frontier().filter(q => ['open', 'reopened'].includes(effStatus(q)));\n  const n = staged.size;\n  $('#finish-body').innerHTML = `\u003cp class=\"dlg-p\">The agent writes \u003cb>${escapeHtml(S.doc)}\u003c/b> from the record: Terms, Why, Locked decisions, Routine choices, Deferred.\u003c/p>` +\n    (open.length ? `\u003cp class=\"dlg-p\">\u003cb>${open.length}\u003c/b> ${open.length === 1 ? 'question is' : 'questions are'} still open; they go under Open threads.\u003c/p>\u003cul class=\"dlg-list\">${open.map(q => `\u003cli>Q${num(q.id)} ${escapeHtml(q.title)}\u003c/li>`).join('')}\u003c/ul>` : '') +\n    (n ? `\u003cp class=\"dlg-p\">Your \u003cb>${n}\u003c/b> staged ${n === 1 ? 'mark is' : 'marks are'} sent first.\u003c/p>` : '');\n  $('#dlg-finish').showModal();\n}\n$('#finish-go').addEventListener('click', () => { $('#dlg-finish').close(); if (staged.size) doSend(); toast(`Asked the agent to write ${S.doc}.`); work(); });\n$('#btn-finish').addEventListener('click', openFinish);\n\n// ── dialogs: keys, terms ─────────────────────────────────\nconst KEYS = [\n  ['grp', 'Move'], ['j / k', 'next / previous question'], ['Esc', 'close the note'], ['/', 'find a decision'],\n  ['grp', 'Answer (staged until you send)'], ['1 – 4', 'pick option A–D'], ['a', 'accept the recommendation'], ['f', 'answer or push back in my words'], ['d', 'defer'], ['o', 'reopen a decided question'], ['u', 'unstage'],\n  ['grp', 'Talk'], ['r', 'reply in the thread'], ['e', 'explore deeper · sends at once, with undo'],\n  ['grp', 'Ship'], ['⌘↵ / Ctrl↵', 'send every staged mark as one turn'], ['v', 'redraw the prototype when it is out of date'], ['t', 'terms'], ['?', 'this sheet'],\n];\n$('#keys').innerHTML = KEYS.map(([k, d]) => k === 'grp' ? `\u003cdiv class=\"grp\">${d}\u003c/div>` : `\u003cdiv>\u003cspan class=\"k2\">${k.split(' / ').map(x => `\u003ckbd>${x}\u003c/kbd>`).join('')}\u003c/span>${d}\u003c/div>`).join('');\n$('#terms').innerHTML = S.terms.map(t => `\u003cdiv class=\"term\">\u003ch3>${escapeHtml(t.term)}\u003c/h3>\u003cp>${escapeHtml(t.def)}\u003c/p>\u003cp class=\"avoid\">Avoid ${t.avoid.map(a => `\u003cs>${escapeHtml(a)}\u003c/s>`).join('')}\u003c/p>\u003c/div>`).join('');\ndocument.querySelectorAll('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));\ndocument.querySelectorAll('dialog').forEach(d => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));\n$('#btn-keys').addEventListener('click', () => $('#dlg-keys').showModal());\n$('#btn-terms').addEventListener('click', () => $('#dlg-terms').showModal());\n\n// ── toasts ───────────────────────────────────────────────\nfunction toast(text, action) {\n  const box = $('#toasts');\n  const t = el('div', 'toast'); t.setAttribute('role', 'status');\n  t.append(el('span', null, text));\n  if (action) { const b = el('button', null, action.label); b.addEventListener('click', () => { action.run(); dismiss(); }); t.append(b); }\n  const x = el('button', 'close', '×'); x.setAttribute('aria-label', 'Dismiss'); x.addEventListener('click', dismiss); t.append(x);\n  box.prepend(t);\n  requestAnimationFrame(() => t.classList.add('in'));\n  let timer = setTimeout(dismiss, action ? 6000 : 4200);\n  t.addEventListener('mouseenter', () => clearTimeout(timer));\n  t.addEventListener('mouseleave', () => { timer = setTimeout(dismiss, 2500); });\n  function dismiss() { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 260); }\n}\n\n// ── keys ─────────────────────────────────────────────────\nfunction escape() {\n  const open = document.querySelector('dialog[open]');\n  if (open) { open.close(); return; }\n  if (noteOpen) { closeNote(); return; }\n  if (document.activeElement === $('#find')) { $('#find').value = ''; renderLedger(''); $('#find').blur(); }\n}\ndocument.addEventListener('keydown', (e) => {
