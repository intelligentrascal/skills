r-4:    oklch(29% 0.010 60);\n  --ink:        oklch(93% 0.010 80);\n  --ink-2:      oklch(76% 0.012 75);\n  --muted:      oklch(64% 0.012 70);\n  --rule:       oklch(100% 0 0 / 0.09);\n  --rule-2:     oklch(100% 0 0 / 0.20);\n  --rule-3:     oklch(100% 0 0 / 0.34);\n  /* the one signal colour: everything that needs my hand */\n  --signal:     oklch(74% 0.165 48);\n  --signal-2:   oklch(62% 0.150 48);\n  --signal-dim: oklch(74% 0.165 48 / 0.16);\n  --signal-ink: oklch(17% 0.02 50);\n  --focus:      oklch(93% 0.010 80);\n  --shadow:     0 16px 40px oklch(0% 0 0 / 0.45), 0 0 0 1px oklch(100% 0 0 / 0.08);\n\n  --font-sans: \"Plex Sans\", \"IBM Plex Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono: \"Plex Mono\", \"IBM Plex Mono\", ui-monospace, Menlo, monospace;\n\n  --t-xs: 11px; --t-s: 12px; --t-m: 13px; --t-b: 14px; --t-l: 17px; --t-xl: 22px;\n\n  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;\n  --r: 2px; --r-2: 3px;\n\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);\n  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;\n\n  --deck-h: 52px; --rail-h: 56px; --bench-h: 322px;\n  color-scheme: dark;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { height: 100%; overflow-x: clip; }\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }\nbody {\n  margin: 0; background: var(--paper); color: var(--ink);\n  font: 400 var(--t-b)/1.45 var(--font-sans);\n  font-feature-settings: \"tnum\" 1, \"ss02\" 0;\n  overflow: hidden;\n}\nbutton, input, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; background: none; border: 0; padding: 0; }\nbutton:disabled { cursor: not-allowed; }\nkbd {\n  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;\n  font: 500 var(--t-xs)/1 var(--font-mono); color: var(--ink-2);\n  border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: var(--r-2); background: var(--paper-2);\n  vertical-align: middle;\n}\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: inherit; }\nh1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }\np { margin: 0; text-wrap: pretty; }\n.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n/* ---------- frame ---------- */\n.app {\n  height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr);\n  grid-template-rows: var(--deck-h) minmax(0, 1fr) var(--bench-h) var(--rail-h);\n  transition: grid-template-rows var(--dur-long) var(--ease-out);\n}\n.app.is-visual { --bench-h: 58vh; }\n\n/* ---------- deck (header) ---------- */\n.deck {\n  display: flex; align-items: center; gap: var(--s-4); padding: 0 var(--s-4); min-width: 0;\n  border-bottom: 1px solid var(--rule); background: var(--paper);\n}\n.deck__topic { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }\n.deck__topic h1 { font-size: var(--t-b); font-weight: 500; white-space: nowrap; }\n.deck__doc { font-family: var(--font-mono); font-size: var(--t-s); color: var(--muted); white-space: nowrap; }\n.lamp {\n  display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--t-s); color: var(--ink-2); white-space: nowrap;\n  padding: 0 var(--s-3); height: 28px; border: 1px solid var(--rule-2); border-radius: var(--r);\n}\n.lamp__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 6px var(--signal); }\n.lamp[data-state=\"working\"] .lamp__dot { animation: blink 900ms var(--ease-io) infinite; }\n.lamp[data-state=\"offline\"] .lamp__dot { background: var(--paper-4); box-shadow: none; }\n@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }\n\n.readout { display: flex; gap: var(--s-4); margin-left: auto; font-family: var(--font-mono); font-size: var(--t-s); font-variant-numeric: tabular-nums; }\n.readout span { color: var(--muted); }\n.readout b { font-weight: 500; color: var(--ink); margin-left: 5px; }\n.readout .is-live b { color: var(--signal); }\n\n.pill {\n  display: inline-flex; align-items: center; gap: var(--s-2); height: 30px; padding: 0 var(--s-2) 0 var(--s-3);\n  border: 1px solid var(--rule-2); border-radius: var(--r); color: var(--muted); font-size: var(--t-s); white-space: nowrap;\n  transition: border-color var(--dur-micro), background-color var(--dur-micro);\n}\n.pill:hover { background: var(--paper-2); border-color: var(--rule-3); }\n.pill:active { background: var(--paper-3); }\n.pill kbd { margin-left: var(--s-1); }\n\n.btn {\n  display: inline-flex; align-items: center; gap: var(--s-2); height: 30px; padding: 0 var(--s-3);\n  border: 1px solid var(--rule-2); border-radius: var(--r); font-size: var(--t-s); font-weight: 500; color: var(--ink); white-space: nowrap;\n  transition: background-color var(--dur-micro), border-color var(--dur-micro), scale var(--dur-micro) var(--ease-out);\n}\n.btn:hover { background: var(--paper-2); border-color: var(--rule-3); }\n.btn:active { scale: 0.96; }\n.btn:disabled { opacity: 0.5; }\n.btn--quiet { border-color: transparent; color: var(--ink-2); }\n.btn--quiet:hover { border-color: var(--rule-2); }\n\n/* ---------- map ---------- */\n.map { position: relative; overflow: clip; }\n.map__cols { position: absolute; inset: 0; pointer-events: none; }\n.map__col { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule); }\n.map__col span { position: absolute; top: 50%; left: 16px; transform: translateY(-50%); font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); letter-spacing: 0.02em; }\n.map__col.is-frontier span { color: var(--signal); }\n.map__col.is-frontier::after { content: \"\"; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--signal); opacity: 0.7; }\n.map__edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }\n.edge { fill: none; stroke: var(--rule-3); stroke-width: 1.25; transition: stroke var(--dur-short), opacity var(--dur-short); }\n.edge.is-dim { opacity: 0.4; }\n.edge.is-lineage { stroke: var(--ink); stroke-width: 2; }\n.edge.is-risk { stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 5 5; }\n.edge.is-risk.is-ripple { animation: travel 1.4s linear 1 both; }\n@keyframes travel { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }\n\n.node {\n  position: absolute; left: 0; top: 0; text-align: left; display: grid; grid-template-rows: auto auto; align-content: center;\n  padding: 0 var(--s-2) 0 var(--s-3); border: 1px solid var(--rule-2); border-radius: var(--r-2); background: var(--paper);\n  color: var(--ink); will-change: transform;\n  transition: transform var(--dur-long) var(--ease-out), border-color var(--dur-micro), background-color var(--dur-micro), opacity var(--dur-short), box-shadow var(--dur-micro);\n}\n.node.is-dim { opacity: 0.5; }\n.node__l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; line-height: 1.15; }\n.node__id { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); flex: none; }\n.node__title { font-size: var(--t-m); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }\n.node__l2 { font: 400 var(--t-xs)/1.1 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }\n.node__l2 s { text-decoration-color: var(--signal); }\n.map.is-compact .node__l2 { display: none; }\n.node--tall { align-content: start; padding-top: 6px; }\n.node--tall .node__l1 { align-items: start; }\n.node--tall .node__title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; font-size: var(--t-m); }\n.node--tall .node__l2 { position: absolute; left: var(--s-3); right: var(--s-2); bottom: 6px; margin: 0; }\n.node__marks { position: absolute; right: 5px; top: 4px; display: flex; gap: 3px; }\n.mark { width: 7px; height: 7px; border-radius: 1px; }\n.mark--durable { background: var(--ink-2); }\n.mark--visual { border: 1px solid var(--muted); }\n.mark--updated { background: var(--signal); border-radius: 50%; }\n\n/* states, by shape and fill first, colour second */\n.node[data-state=\"decided\"] { background: var(--paper-3); border-color: var(--paper-4); }\n.node[data-state=\"decided\"] .node__id { color: var(--ink-2); }\n.node[data-state=\"open\"] { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--paper), 0 0 14px -4px var(--signal); }\n.node[data-state=\"open\"] .node__id { color: var(--signal); }\n.node[data-state=\"reopened\"] { border-color: var(--signal); border-style: dashed; background: var(--paper-2); }\n.node[data-state=\"reopened\"] .node__id { color: var(--signal); }\n.node[data-state=\"deferred\"] { border-style: dotted; border-color: var(--rule-3); color: var(--ink-2); }\n.node[data-state=\"staged\"] { border-color: var(--signal); background: repeating-linear-gradient(135deg, var(--signal-dim) 0 3px, transparent 3px 8px), var(--paper-2); }\n.node[data-state=\"staged\"] .node__id { color: var(--signal); }\n.node[data-state=\"staged\"] .node__l2 { color: var(--signal); }\n.node[data-risk] { border-color: var(--signal-2); border-style: dashed; }\n.node.is-ripple { animation: ripple 700ms var(--ease-out) 1 both; animation-delay: calc(var(--depth, 0) * 180ms); }\n.node[data-risk] .node__l2 { color: var(--signal); }\n@keyframes ripple { 0% { box-shadow: 0 0 0 0 var(--signal); } 100% { box-shadow: 0 0 0 10px transparent; } }\n.node.is-selected { outline: 2px solid var(--ink); outline-offset: 2px; z-index: 2; }\n.node:hover { border-color: var(--rule-3); }\n.node[data-state=\"open\"]:hover, .node[data-state=\"staged\"]:hover, .node[data-state=\"reopened\"]:hover { border-color: var(--signal); background-color: var(--paper-2); }\n.node.is-committing { animation: commit var(--dur-long) var(--ease-out) 1 both; }\n@keyframes commit { 0% { box-shadow: 0 0 0 2px var(--ink); } 100% { box-shadow: 0 0 0 10px transparent; } }\n.node.is-linked { border-color: var(--ink-2); }\n\n/* leader lines from visual regions to nodes */\n.leaders { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }\n.leader { fill: none; stroke: var(--ink-2); stroke-width: 1.25; stroke-dasharray: 3 4; opacity: 0.9; }\n.leader--faint { opacity: 0.3; }\n.leader-dot { fill: var(--ink-2); }\n\n/* ---------- bench ---------- */\n.bench {\n  display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.6fr) 392px; border-top: 1px solid var(--rule-2); min-height: 0; background: var(--paper-2);\n}\n.app.is-visual .bench { grid-template-columns: 1fr; }\n.app.is-visual .console, .app.is-visual .thread { display: none; }\n.bench > section { min-width: 0; min-height: 0; }\n.console { padding: var(--s-3) var(--s-4) var(--s-3); overflow: auto; border-right: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-3) var(--s-5); align-content: start; }\n.console__head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; }\n.console__head h2 { font-size: var(--t-l); font-weight: 500; line-height: 1.25; letter-spacing: -0.005em; }\n.tag { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); padding: 4px 6px; border: 1px solid var(--rule-2); border-radius: var(--r); white-space: nowrap; }\n.tag--signal { color: var(--signal); border-color: var(--signal); }\n.tag--ink { color: var(--ink); border-color: var(--rule-3); }\n.console__body { grid-column: 1 / -1; color: var(--ink-2); font-size: var(--t-m); max-width: 78ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n.console__col { display: grid; gap: var(--s-3); align-content: start; min-width: 0; }\n\n.rec { border: 1px solid var(--signal); border-radius: var(--r-2); padding: var(--s-2) var(--s-3); display: grid; gap: 6px; background: var(--paper); }\n.rec__head { display: flex; align-items: center; gap: var(--s-2); font: 500 var(--t-xs)/1 var(--font-mono); color: var(--signal); }\n.rec__text { font-size: 15px; font-weight: 500; line-height: 1.35; }\n.rec__why { font-size: var(--t-s); color: var(--ink-2); }\n.rec__act { display: flex; gap: var(--s-2); align-items: center; margin-top: var(--s-1); }\n.rec--settled { border-color: var(--rule-3); }\n.rec--settled .rec__head { color: var(--ink-2); }\n.stmt { font: 500 var(--t-b)/1.35 var(--font-sans); }\n.stmt .mono { color: var(--muted); font-size: var(--t-s); }\n\n.options { display: grid; gap: var(--s-1); list-style: none; margin: 0; padding: 0; }\n.opt {\n  display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: var(--s-2); align-items: start; width: 100%; text-align: left; padding: 4px var(--s-2);\n  border: 1px solid transparent; border-radius: var(--r); font-size: var(--t-s); color: var(--ink-2);\n  transition: background-color var(--dur-micro), border-color var(--dur-micro);\n}\n.opt:hover { background: var(--paper-3); }\n.opt:active { background: var(--paper-4); }\n.opt kbd { margin-top: 1px; }\n.opt .k { font-family: var(--font-mono); font-weight: 500; color: var(--ink); margin-right: 4px; }\n.opt.is-rec .k { color: var(--signal); }\n.opt.is-chosen { border-color: var(--rule-3); color: var(--ink); background: var(--paper); }\n.opt.is-staged { border-color: var(--signal); color: var(--ink); background: var(--paper); }\n.opt:disabled { opacity: 0.55; }\n\n.own { display: grid; gap: var(--s-1); }\n.own label { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); display: flex; gap: var(--s-2); align-items: center; }\n.field {\n  width: 100%; min-height: 52px; resize: vertical; padding: var(--s-2) var(--s-3); background: var(--paper); color: var(--ink);\n  border: 1px solid var(--rule-2); border-radius: var(--r); outline: 2px solid transparent; outline-offset: 1px; font-size: var(--t-m);\n  transition: background-color var(--dur-micro);\n}\n.field::placeholder { color: var(--muted); }\n.field:hover { background: var(--paper-3); }\n.field:focus-visible { outline-color: var(--focus); }\n.own__hint { font: 400 var(--t-xs)/1.3 var(--font-mono); color: var(--muted); min-height: 1lh; }\n\n.acts { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }\n.act {\n  display: inline-flex; align-items: center; gap: var(--s-2); height: 30px; padding: 0 var(--s-3) 0 var(--s-2); border: 1px solid var(--rule-2); border-radius: var(--r);\n  font-size: var(--t-s); color: var(--ink-2); transition: background-color var(--dur-micro), border-color var(--dur-micro), scale var(--dur-micro) var(--ease-out);\n}\n.act:hover { background: var(--paper-3); border-color: var(--rule-3); color: var(--ink); }\n.act:active { scale: 0.96; }\n.act:disabled { opacity: 0.5; }\n.act--signal { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); font-weight: 500; }\n.act--signal:hover { filter: brightness(1.07); color: var(--signal-ink); }\n.act--signal kbd { color: var(--signal-ink); border-color: var(--signal-ink); background: transparent; }\n.acts__spacer { flex: 1; }\n\n/* thread */\n.thread { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-right: 1px solid var(--rule); }\n.thread__head { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-3) var(--s-4) var(--s-2); font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); }\n.thread__list { overflow: auto; padding: 0 var(--s-4); display: grid; gap: var(--s-2); align-content: start; }\n.msg { padding: var(--s-2) 0; border-top: 1px solid var(--rule); font-size: var(--t-s); color: var(--ink-2); }\n.msg:first-child { border-top: 0; }\n.msg__meta { display: flex; gap: var(--s-2); font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); margin-bottom: 4px; }\n.msg__meta b { font-weight: 500; color: var(--ink-2); }\n.msg--staged { border: 1px dashed var(--signal); border-radius: var(--r); padding: var(--s-2); color: var(--ink); }\n.msg--staged .msg__meta b { color: var(--signal); }\n.msg--sent { border: 1px solid var(--rule-2); border-radius: var(--r); padding: var(--s-2); }\n.thread__empty { font-size: var(--t-s); color: var(--muted); padding: var(--s-2) 0; }\n.thread__reply { padding: var(--s-2) var(--s-4) var(--s-3); display: grid; gap: var(--s-1); }\n.thread__reply .field { min-height: 40px; }\n\n/* visual */\n.visual { display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: var(--paper); }\n.visual__head { display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-2) 0 var(--s-3); height: 36px; white-space: nowrap; overflow: hidden; border-bottom: 1px solid var(--rule); font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); }\n.visual__head .grow { flex: 1; }\n.visual__covers { color: var(--muted); }\n.visual__covers b { font-weight: 500; color: var(--ink-2); }\n.visual__stage { position: relative; overflow: hidden; }\n.visual__stage.is-stale::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background: repeating-linear-gradient(135deg, transparent 0 14px, oklch(0% 0 0 / 0.22) 14px 15px);\n}\n.visual__stage.is-working iframe { opacity: 0.35; }\n.visual__frame { position: absolute; left: 0; top: 0; border: 0; background: var(--ink); transform-origin: 0 0; transition: opacity var(--dur-short); }\n.visual__stale { display: flex; gap: var(--s-2); align-items: center; padding: 0 var(--s-3); height: 30px; background: var(--paper); border-bottom: 1px solid var(--rule); font: 500 var(--t-xs)/1.3 var(--font-mono); color: var(--signal); }\n.visual__stale button { margin-left: auto; }\n.visual__stale[hidden] { display: none; }\n.visual__working { position: absolute; inset: 0; display: grid; place-items: center; font: 500 var(--t-s)/1 var(--font-mono); color: var(--ink); pointer-events: none; }\n\n/* ---------- rail ---------- */\n.rail { display: flex; align-items: center; gap: var(--s-4); padding: 0 0 0 var(--s-4); min-width: 0; border-top: 1px solid var(--rule-2); background: var(--paper); }\n.rail__label { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); white-space: nowrap; }\n.rail__list { display: flex; gap: var(--s-2); overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }\n.rail__list::-webkit-scrollbar { display: none; }\n.chip { display: inline-flex; align-items: center; gap: var(--s-2); height: 28px; padding: 0 var(--s-2) 0 var(--s-2); border: 1px dashed var(--signal); border-radius: var(--r); font: 400 var(--t-s)/1 var(--font-mono); color: var(--ink); white-space: nowrap; }\n.chip b { font-weight: 500; color: var(--signal); }\n.chip button { color: var(--muted); font-family: var(--font-mono); padding: 0 2px; border-radius: var(--r); }\n.chip button:hover { color: var(--ink); }\n.chip i { font-style: normal; color: var(--signal-2); }\n.rail__empty { font-size: var(--t-s); color: var(--muted); white-space: nowrap; }\n.send {\n  height: 100%; padding: 0 var(--s-5); display: inline-flex; align-items: center; gap: var(--s-3); border-left: 1px solid var(--rule-2);\n  background: var(--signal); color: var(--signal-ink); font-weight: 500; font-size: var(--t-b); white-space: nowrap;\n  transition: background-color var(--dur-micro), filter var(--dur-micro);\n}\n.send kbd { color: var(--signal-ink); border-color: var(--signal-ink); background: transparent; }\n.send:hover { filter: brightness(1.06); }\n.send:active { filter: brightness(0.94); }\n.send:disabled { background: var(--paper-2); color: var(--muted); }\n.send:disabled kbd { color: var(--muted); border-color: var(--rule-2); }\n.send:focus-visible { outline-offset: -4px; }\n.send__count { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n\n/* ---------- overlays ---------- */\n.veil { position: fixed; inset: 0; z-index: 20; background: oklch(0% 0 0 / 0.45); opacity: 0; visibility: hidden; transition: opacity var(--dur-short), visibility 0s linear var(--dur-short); }\n.veil.is-open { opacity: 1; visibility: visible; transition: opacity var(--dur-short), visibility 0s; }\n.cmdk { position: absolute; top: 12vh; left: 50%; width: min(640px, calc(100vw - 32px)); transform: translate(-50%, -6px); background: var(--paper-2); border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; transition: transform var(--dur-short) var(--ease-out); }\n.veil.is-open .cmdk { transform: translate(-50%, 0); }\n.cmdk__field { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-4); height: 48px; border-bottom: 1px solid var(--rule); }\n.cmdk__field input { flex: 1; background: none; border: 0; outline: none; font-size: var(--t-b); color: var(--ink); }\n.cmdk__field input::placeholder { color: var(--muted); }\n.cmdk__list { max-height: 52vh; overflow: auto; padding: var(--s-2); }\n.cmdk__group { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); padding: var(--s-2) var(--s-2) var(--s-1); }\n.cmdk__item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; width: 100%; text-align: left; padding: 7px var(--s-2); border-radius: var(--r-2); color: var(--ink-2); }\n.cmdk__item .id { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); }\n.cmdk__item .lbl { font-size: var(--t-m); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.cmdk__item .meta { font: 400 var(--t-xs)/1.35 var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.cmdk__item .meta b { font-weight: 500; color: var(--signal); }\n.cmdk__item .st { font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); }\n.cmdk__item.is-active { background: var(--paper-3); }\n.cmdk__item.is-active .lbl { color: var(--ink); }\n.cmdk__foot { display: flex; gap: var(--s-4); padding: var(--s-2) var(--s-4); border-top: 1px solid var(--rule); font: 400 var(--t-xs)/1 var(--font-mono); color: var(--muted); }\n.cmdk__empty { padding: var(--s-4); font-size: var(--t-s); color: var(--muted); }\n\n.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100vw; z-index: 25; background: var(--paper-2); border-left: 1px solid var(--rule-2); box-shadow: var(--shadow); transform: translateX(16px); opacity: 0; visibility: hidden; transition: transform var(--dur-short) var(--ease-out), opacity var(--dur-short), visibility 0s linear var(--dur-short); overflow: auto; padding: var(--s-5) var(--s-5) var(--s-6); }\n.sheet.is-open { transform: none; opacity: 1; visibility: visible; transition: transform var(--dur-short) var(--ease-out), opacity var(--dur-short), visibility 0s; }\n.sheet__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-4); }\n.sheet__head h2 { font-size: var(--t-l); }\n.term { padding: var(--s-3) 0; border-top: 1px solid var(--rule); }\n.term h3 { font-size: var(--t-b); font-weight: 500; }\n.term p { font-size: var(--t-s); color: var(--ink-2); margin-top: 2px; }\n.term .avoid { margin-top: var(--s-1); font: 400 var(--t-xs)/1.4 var(--font-mono); color: var(--muted); }\n.term .avoid s { color: var(--ink-2); }\n.keys { display: grid; grid-template-columns: auto 1fr; gap: var(--s-2) var(--s-4); align-items: center; font-size: var(--t-s); color: var(--ink-2); }\n.keys .kk { display: flex; gap: 3px; }\n.keys h3 { grid-column: 1 / -1; font: 500 var(--t-xs)/1 var(--font-mono); color: var(--muted); margin-top: var(--s-3); }\n\ndialog.finish { background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 4px; padding: var(--s-5); width: min(460px, calc(100vw - 32px)); box-shadow: var(--shadow); }\ndialog.finish::backdrop { background: oklch(0% 0 0 / 0.5); }\ndialog.finish h2 { font-size: var(--t-l); margin-bottom: var(--s-2); }\ndialog.finish p { font-size: var(--t-m); color: var(--ink-2); }\ndialog.finish .row { display: flex; justify-content: flex-end; gap: var(--s-2); margin-top: var(--s-5); }\n\n.toast { position: fixed; left: 50%; bottom: calc(var(--rail-h) + 16px); transform: translate(-50%, 8px); z-index: 30; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3) var(--s-2) var(--s-4); background: var(--ink); color: var(--paper); border-radius: var(--r-2); font-size: var(--t-m); box-shadow: var(--shadow); opacity: 0; visibility: hidden; transition: opacity var(--dur-short), transform var(--dur-short) var(--ease-out), visibility var(--dur-short); }\n.toast.is-open { opacity: 1; visibility: visible; transform: translate(-50%, 0); }\n.toast button { font-weight: 500; color: var(--paper); text-decoration: underline; text-underline-offset: 2px; padding: 2px 4px; border-radius: var(--r); }\n.toast button:focus-visible { outline-color: var(--paper); }\n\n@media (max-width: 1300px) {\n  .bench { grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.6fr) 340px; }\n  .readout { gap: var(--s-3); }\n  .deck__doc { display: none; }\n}\n@media (max-height: 820px) { :root { --bench-h: 292px; } .console__body { display: none; } .rec__text { font-size: var(--t-b); } .own__hint { display: none; } .field { min-height: 44px; } .console { row-gap: var(--s-2); } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }\n  .lamp[data-state=\"working\"] .lamp__dot { opacity: 0.5; }\n  .edge.is-risk { animation: none; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\" id=\"app\">\n  \u003cheader class=\"deck\" role=\"banner\">\n    \u003cdiv class=\"deck__topic\">\n      \u003ch1 id=\"topic\">\u003c/h1>\n      \u003cspan class=\"deck__doc\" id=\"doc\">\u003c/span>\n    \u003c/div>\n    \u003cspan class=\"lamp\" id=\"lamp\" data-state=\"waiting\" role=\"status\" aria-live=\"polite\">\u003cspan class=\"lamp__dot\" aria-hidden=\"true\">\u003c/span>\u003cspan id=\"lamp-text\">\u003c/span>\u003c/span>\n    \u003cdiv class=\"readout\" id=\"readout\" aria-live=\"polite\" aria-label=\"Question counts\">\u003c/div>\n    \u003cbutton class=\"pill\" id=\"pill\" type=\"button\" aria-label=\"Command palette\">Go to, decide, find… \u003ckbd>⌘K\u003c/kbd>\u003c/button>\n    \u003cbutton class=\"btn btn--quiet\" id=\"terms-btn\" type=\"button\">Terms\u003c/button>\n    \u003cbutton class=\"btn btn--quiet\" id=\"help-btn\" type=\"button\" aria-label=\"Keyboard cheatsheet\">\u003ckbd>?\u003c/kbd>\u003c/button>\n    \u003cbutton class=\"btn\" id=\"finish-btn\" type=\"button\">Finish \u003cspan class=\"mono\" id=\"finish-doc\" style=\"color:var(--muted)\">\u003c/span>\u003c/button>\n  \u003c/header>\n\n  \u003cmain class=\"map\" id=\"map\" aria-label=\"Decision graph: rounds are columns, dependencies are edges\">\n    \u003cdiv class=\"map__cols\" id=\"cols\" aria-hidden=\"true\">\u003c/div>\n    \u003csvg class=\"map__edges\" id=\"edges\" aria-hidden=\"true\">\u003c/svg>\n    \u003cdiv id=\"nodes\">\u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"bench\">\n    \u003csection class=\"console\" id=\"console\" aria-label=\"Selected question\">\u003c/section>\n    \u003csection class=\"thread\" id=\"thread\" aria-label=\"Thread\">\u003c/section>\n    \u003csection class=\"visual\" id=\"visual\" aria-label=\"Visual prototype\">\n      \u003cdiv class=\"visual__head\">\n        \u003cspan id=\"visual-title\">visual\u003c/span>\n        \u003cspan class=\"visual__covers\" id=\"visual-covers\" hidden>\u003c/span>\n        \u003cspan class=\"grow\">\u003c/span>\n        \u003cbutton class=\"btn btn--quiet\" id=\"visualize-btn\" type=\"button\" style=\"height:26px\">Visualize\u003c/button>\n        \u003cbutton class=\"btn btn--quiet\" id=\"expand-btn\" type=\"button\" style=\"height:26px\" aria-pressed=\"false\" aria-label=\"Expand the visual\">\u003ckbd>v\u003c/kbd>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"visual__stale\" id=\"stale\" hidden>\u003c/div>\n      \u003cdiv class=\"visual__stage\" id=\"stage\">\n        \u003ciframe class=\"visual__frame\" id=\"frame\" sandbox=\"allow-scripts\" title=\"Agent-drawn visual prototype\">\u003c/iframe>\n        \u003cdiv class=\"visual__working\" id=\"visual-working\" hidden>redrawing…\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cfooter class=\"rail\">\n    \u003cspan class=\"rail__label\">send will ship\u003c/span>\n    \u003cdiv class=\"rail__list\" id=\"rail-list\">\u003c/div>\n    \u003cbutton class=\"send\" id=\"send-btn\" type=\"button\">\u003cspan>Send \u003cspan class=\"send__count\" id=\"send-count\">0\u003c/span> as one turn\u003c/span>\u003ckbd>⌘↵\u003c/kbd>\u003c/button>\n  \u003c/footer>\n\u003c/div>\n\n\u003csvg class=\"leaders\" id=\"leaders\" aria-hidden=\"true\">\u003c/svg>\n\n\u003cdiv class=\"veil\" id=\"cmdk-veil\">\n  \u003cdiv class=\"cmdk\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Command palette\">\n    \u003cdiv class=\"cmdk__field\">\u003cinput id=\"cmdk-input\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Go to Q2 · what did we decide on transport · defer q24 · accept rec on all open\">\u003ckbd>esc\u003c/kbd>\u003c/div>\n    \u003cdiv class=\"cmdk__list\" id=\"cmdk-list\" role=\"listbox\">\u003c/div>\n    \u003cdiv class=\"cmdk__foot\">\u003cspan>↑↓ move\u003c/span>\u003cspan>↵ run\u003c/span>\u003cspan>type a question id, a title, or a verb\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003caside class=\"sheet\" id=\"terms\" aria-label=\"Terms glossary\">\n  \u003cdiv class=\"sheet__head\">\u003ch2>Terms\u003c/h2>\u003cbutton class=\"btn btn--quiet\" type=\"button\" data-close>Close \u003ckbd>esc\u003c/kbd>\u003c/button>\u003c/div>\n  \u003cp style=\"font-size:var(--t-s);color:var(--muted);margin-bottom:var(--s-2)\">Settled vocabulary. Each term names the words to avoid.\u003c/p>\n  \u003cdiv id=\"terms-list\">\u003c/div>\n\u003c/aside>\n\n\u003caside class=\"sheet\" id=\"cheat\" aria-label=\"Keyboard cheatsheet\">\n  \u003cdiv class=\"sheet__head\">\u003ch2>Keys\u003c/h2>\u003cbutton class=\"btn btn--quiet\" type=\"button\" data-close>Close \u003ckbd>esc\u003c/kbd>\u003c/button>\u003c/div>\n  \u003cdiv class=\"keys\">\n    \u003ch3>move\u003c/h3>\n    \u003cspan class=\"kk\">\u003ckbd>j\u003c/kbd>\u003ckbd>k\u003c/kbd>\u003c/span>\u003cspan>next / previous question on the map\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>⌘K\u003c/kbd>\u003c/span>\u003cspan>palette: go to, find a decision, run any action\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>v\u003c/kbd>\u003c/span>\u003cspan>expand or dock the visual\u003c/span>\n    \u003ch3>answer\u003c/h3>\n    \u003cspan class=\"kk\">\u003ckbd>a\u003c/kbd>\u003c/span>\u003cspan>accept the recommendation\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>1\u003c/kbd>\u003ckbd>2\u003c/kbd>\u003ckbd>3\u003c/kbd>\u003ckbd>4\u003c/kbd>\u003c/span>\u003cspan>pick an option\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>f\u003c/kbd>\u003c/span>\u003cspan>answer or push back in your words\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>r\u003c/kbd>\u003c/span>\u003cspan>reply in the thread\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>d\u003c/kbd>\u003ckbd>o\u003c/kbd>\u003c/span>\u003cspan>defer / reopen\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>e\u003c/kbd>\u003c/span>\u003cspan>explore deeper (sends at once, with undo)\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>u\u003c/kbd>\u003c/span>\u003cspan>unstage\u003c/span>\n    \u003ch3>ship\u003c/h3>\n    \u003cspan class=\"kk\">\u003ckbd>⌘↵\u003c/kbd>\u003c/span>\u003cspan>send everything staged as one turn\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>esc\u003c/kbd>\u003c/span>\u003cspan>close, or leave a field\u003c/span>\n    \u003cspan class=\"kk\">\u003ckbd>?\u003c/kbd>\u003c/span>\u003cspan>this sheet\u003c/span>\n  \u003c/div>\n\u003c/aside>\n\n\u003cdialog class=\"finish\" id=\"finish\">\n  \u003ch2>Write the design doc?\u003c/h2>\n  \u003cp id=\"finish-text\">\u003c/p>\n  \u003cdiv class=\"row\">\u003cbutton class=\"btn\" type=\"button\" data-close>Not yet\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"finish-go\" style=\"border-color:var(--signal);color:var(--signal)\">Finish and write\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003cspan id=\"toast-text\">\u003c/span>\u003cbutton type=\"button\" id=\"toast-undo\" hidden>Undo\u003c/button>\u003c/div>\n\n\u003cscript>// Mockup data for design/mockups (spec §9.1). Inlined into each *.template.html by build.mjs.\n// SESSION is in the real state.json shape (spec §4; Jason's schema, grill-with-ui SKILL.md:392-417):\n// questions is an ARRAY; rounds are derived from question.round.\n// Rounds 1–8 are Jason Ku's real grill-with-ui design session of 2026-09-06 (commit daafa1e,\n// design/mockups/data.js), text unchanged. Round 9 (q18–q25) is synthetic: 7 open + q23 deferred;\n// q15 and q16 were answered, then reopened (see their threads); the visual (v3) is stale.\n// VISUAL_HTML is the v3 prototype: regions carry data-q and it ends with the verbatim\n// grilling-ui linkage listener (plan Task 20). \"\u003c\\/script>\" keeps it safe when inlined in \u003cscript>.\nconst SESSION = {\n  \"topic\": \"grill-with-ui skill\",\n  \"doc\": \"docs/design.md\",\n  \"project\": \"~/Projects/grill-with-ui\",\n  \"created\": \"2026-09-06T21:00:00Z\",\n  \"agent\": {\n    \"status\": \"waiting\",\n    \"since\": \"2026-09-06T22:46:00Z\",\n    \"handled\": 9\n  },\n  \"note\": \"Round 9 is open. Q15 and Q16 were reopened by later answers; Q23 is deferred.\",\n  \"visual\": {\n    \"kind\": \"prototype\",\n    \"version\": 3,\n    \"at\": \"2026-09-06T22:31:00Z\",\n    \"stale\": true,\n    \"note\": \"v3: Inbox layout with the doc path in the send bar per Q9; stale since Q15 was reopened\",\n    \"thread\": [\n      {\n        \"who\": \"user\",\n        \"text\": \"Put the doc path next to Finish so I can see where it will write.\",\n        \"at\": \"2026-09-06T22:26:00Z\"\n      },\n      {\n        \"who\": \"agent\",\n        \"text\": \"Done in v3: the send bar shows → docs/design.md and the section order from Q16.\",\n        \"at\": \"2026-09-06T22:31:00Z\"\n      }\n    ]\n  },\n  \"terms\": [\n    {\n      \"term\": \"Round\",\n      \"def\": \"One agent turn's worth of new questions: the current frontier.\",\n      \"avoid\": [\n        \"batch\",\n        \"wave\"\n      ]\n    },\n    {\n      \"term\": \"Frontier\",\n      \"def\": \"Questions whose prerequisites are all settled and can be asked now.\",\n      \"avoid\": [\n        \"queue\",\n        \"next up\"\n      ]\n    },\n    {\n      \"term\": \"Send\",\n      \"def\": \"One press of Send to Agent: every staged action shipped as a single event.\",\n      \"avoid\": [\n        \"submit\",\n        \"reply\"\n      ]\n    },\n    {\n      \"term\": \"Durable decision\",\n      \"def\": \"Hard to reverse, surprising without context, a real trade-off. Goes under Locked decisions.\",\n      \"avoid\": [\n        \"ADR\",\n        \"big decision\"\n      ]\n    }\n  ],\n  \"questions\": [\n    {\n      \"id\": \"q1\",\n      \"round\": 1,\n      \"deps\": [],\n      \"title\": \"UI surface\",\n      \"body\": \"What is the UI surface, and how does it talk to the running session? This is the root decision; state format, threads and resume all hang off it.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Local browser app. A tiny bundled server serves a page and reads/writes one state file per session. Terminal stays a parallel input.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Read-only side panel. Claude re-renders an HTML summary each turn; you still answer in the terminal by number.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"MCP app panel. Only if Claude Code renders it. Heavier to build and install.\"\n        },\n        {\n          \"k\": \"D\",\n          \"text\": \"Terminal TUI. Doesn't solve scrollback. Listed to rule out.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Works in any terminal today, nothing to install, and the file protocol is agent-neutral so a Codex version is packaging, not a rewrite.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\",\n        \"text\": \"A is exactly what I was thinking\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q2\",\n      \"round\": 2,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Transport\",\n      \"body\": \"How does a browser answer reach the running Claude session? Docs check: Monitor wakes an idle session; a background shell exiting does not; Channels need a launch flag.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Persistent Monitor on the server's WebSocket. Every browser action is one event and one Claude turn.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Claude Code Channels. Officially blessed, but needs a startup flag and a plugin.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Manual nudge: answer in the browser, type 'go' in the terminal.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"No startup flags, works from inside the skill. Live test fired while idle: verified.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"text\",\n        \"text\": \"Simpler: the web app writes to a local JSON and the agent has a file-change watcher on it.\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"agent\",\n          \"text\": \"Yes, and simpler than what I proposed. Refinement: two files, not one. state.json written only by the agent; events.jsonl appended only by the web app, watched with plain tail -F.\",\n          \"at\": \"2026-09-06T21:11:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q3\",\n      \"round\": 3,\n      \"deps\": [\n        \"q2\"\n      ],\n      \"title\": \"Questions per turn\",\n      \"body\": \"When Claude replies to a batch, how many new questions does it post on top of the thread replies?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Exactly one new primary question per turn. Keeps 'resolve dependencies one by one'.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Up to a few new questions when they're independent. Fewer round trips; recommendations can go stale.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"You already batch on your side; keeping Claude to one at a time is what makes recommendations trustworthy.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"option\",\n        \"option\": \"B\",\n        \"text\": \"\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q4\",\n      \"round\": 3,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Thread context\",\n      \"body\": \"What does 'chat more about a question without losing context' mean mechanically?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"One Claude session; threads are labeled messages. Nothing is separate under the hood.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"A subagent per thread, seeded with a summary. Isolation, but loses exactly the context you want.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"The thing you're missing is navigation, not isolation. The page provides that.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q5\",\n      \"round\": 4,\n      \"deps\": [\n        \"q4\"\n      ],\n      \"title\": \"Question card shape\",\n      \"body\": \"What does a question look like on the page, and how do you answer it? This fixes the state schema.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Structured card: title, body, lettered options, a recommendation pointing at one, a rationale. Answer by option, Accept, or free text. Thread box separate.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Free text everywhere. Simpler schema, no one-click accept.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Grilling already produces lettered options and a named recommendation, so structure costs nothing.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q6\",\n      \"round\": 4,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Terminal role\",\n      \"body\": \"What does the terminal do while a grill runs in the page?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"One-line status per turn, plus the URL. Terminal typing still works and is recorded into state.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Terminal goes silent. Launch only.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Terminal mirrors the full text. Defeats the purpose.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Same scrollback cost as silence, and it gives you the 'Claude is waiting' signal where you're already looking.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q7\",\n      \"round\": 4,\n      \"deps\": [\n        \"q2\"\n      ],\n      \"title\": \"Server lifecycle\",\n      \"body\": \"Who starts and stops the local server, and how do we guarantee it dies? Orphaned processes have bitten this machine before.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"The server is the monitor. It lives exactly as long as the monitor: killed at session end or on Finish. Nothing to orphan.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Server in the background, separate tail watcher. Needs its own shutdown story; every option is a way to leak.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Same file-based design, with writer and watcher collapsed into one process the harness already manages.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q8\",\n      \"round\": 5,\n      \"deps\": [\n        \"q5\"\n      ],\n      \"title\": \"Finish + deliverable\",\n      \"body\": \"How does a grill end, and what's the deliverable? Past grills all ended as design docs.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Explicit Finish button; Claude writes a markdown decisions doc from state. Doc path asked once at start.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"No explicit end; the state file is the record.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Writing from a structured state file is more faithful than writing from a long transcript.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"user\",\n          \"text\": \"Can you also look up Matt Pocock's grill-with-docs skill to see what we can borrow for the docs part, and compare it to the docs we already generate?\",\n          \"at\": \"2026-09-06T21:39:00Z\"\n        },\n        {\n          \"who\": \"agent\",\n          \"text\": \"Fetched it. It's one line: run grilling + domain-modeling. The docs part writes a repo-wide CONTEXT.md glossary and sparse ADRs gated on hard-to-reverse, surprising, real trade-off. Your docs are the opposite shape: one exhaustive topic doc builders consume as the spec. Turned into Q9.\",\n          \"at\": \"2026-09-06T21:41:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q9\",\n      \"round\": 5,\n      \"deps\": [\n        \"q8\"\n      ],\n      \"title\": \"What Finish writes\",\n      \"body\": \"Your exhaustive topic doc, Matt's sparse ADRs and glossary, or both?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Your design doc, with two borrows: a per-decision durable flag (Locked vs Routine sections) and a Terms section with Avoid lists.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Your design doc plus ADRs in docs/adr and a root CONTEXT.md. Two places to keep in sync.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Matt's files only. Rejected: builders need the exhaustive doc.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"The durable flag and the terms section fix two real problems; repo-wide files can be an opt-in flag later.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q10\",\n      \"round\": 6,\n      \"deps\": [\n        \"q7\"\n      ],\n      \"title\": \"State location + resume\",\n      \"body\": \"Where does session state live, and how does resume work? Several worktrees per project here.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Per-session folder under home, keyed by git common root (working directory when not in git). Resume lists unfinished sessions for the project.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Inside the repo, gitignored. Lives in one worktree; ws reset wipes it.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Worktree independence decides it here; for adopters it also means zero repo changes.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"user\",\n          \"text\": \"Hm, what would be easier for other people to adopt?\",\n          \"at\": \"2026-09-06T21:52:00Z\"\n        },\n        {\n          \"who\": \"agent\",\n          \"text\": \"Outside the repo, by a wider margin: zero repo changes, one mental model, works outside git, resume is discoverable anyway. Only loss: sessions don't travel with a clone, which is a non-goal.\",\n          \"at\": \"2026-09-06T21:54:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q11\",\n      \"round\": 6,\n      \"deps\": [\n        \"q10\"\n      ],\ ent(\"style\");\n  st.textContent = \".grill-hl{outline:2px solid #8a5a12;outline-offset:2px}\";\n  document.head.appendChild(st);\n  addEventListener(\"message\", (e) => {\n    if (e.source !== P || !e.data || !Array.isArray(e.data.highlight)) return;\n    const ids = e.data.highlight.filter((x) => /^q\\\\d+$/.test(x));\n    document.querySelectorAll(\"[data-q]\").forEach((el) => el.classList.toggle(\"grill-hl\", ids.includes(el.dataset.q)));\n  });\n  addEventListener(\"click\", (e) => { const r = e.target.closest(\"[data-q]\"); if (r) P.postMessage({ clicked: r.dataset.q }, \"*\"); });\n  addEventListener(\"keydown\", (e) => {\n    if ((e.metaKey || e.ctrlKey) && e.key === \"Enter\") { e.preventDefault(); P.postMessage({ key: \"send\" }, \"*\"); }\n    else if (e.key === \"Escape\") P.postMessage({ key: \"escape\" }, \"*\");\n  });\n})();\n\u003c\\/script>\n\u003c/body>\n\u003c/html>\n`;\n\u003c/script>\n\u003cscript>\n(() => {\n\"use strict\";\nconst $ = (s, r = document) => r.querySelector(s);\nconst el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };\nconst esc = (s) => String(s).replace(/[&\u003c>\"]/g, (c) => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n/* ---------- data ---------- */\nconst Q = SESSION.questions;\nconst byId = Object.fromEntries(Q.map((q) => [q.id, q]));\nconst children = {}; Q.forEach((q) => { children[q.id] = []; }); Q.forEach((q) => q.deps.forEach((d) => children[d] && children[d].push(q.id)));\nconst num = (id) => id.replace(/^q/, \"Q\");\nconst coveredIds = [...new Set([...VISUAL_HTML.matchAll(/data-q=\"(q\\d+)\"/g)].map((m) => m[1]))];\n\n/* staged work: id -> { answer?: {kind, option?, text?}, reply?: string } */\nconst staged = new Map();\nlet selected = null;\nlet hovered = null;\nlet agent = { status: SESSION.agent.status, lastRisk = new Set();\nconst stagedLabel = (a) => a.kind === \"accept\" ? `accept ${a.option}` : a.kind === \"option\" ? `pick ${a.option}` : a.kind === \"text\" ? \"your words\" : a.kind === \"defer\" ? \"defer\" : a.kind === \"reopen\" ? \"reopen\" : a.kind;\nconst actionCount = () => { let n = 0; for (const s of staged.values()) { if (s.answer) n++; if (s.reply) n++; } return n; };\nconst time = (iso) => iso.slice(11, 16);\n\n/* ---------- deck ---------- */\n$(\"#topic\").textContent = SESSION.topic;\n$(\"#doc\").textContent = `→ ${SESSION.doc}`;\n$(\"#finish-doc\").textContent = `→ ${SESSION.doc}`;\nfunction renderLamp() {\n  const lamp = $(\"#lamp\");\n  const state = !agent.listening ? \"offline\" : agent.status === \"working\" ? \"working\" : \"waiting\";\n  lamp.dataset.state = state;\n  $(\"#lamp-text\").textContent = state === \"offline\" ? \"no agent listening: requests queue\" : state === \"working\" ? \"agent working…\" : `waiting for you · ${agent.handled} turns handled`;\n}\nfunction renderReadout() {\n  const c = { open: 0, staged: actionCount(), decided: 0, deferred: 0, reopened: 0 };\n  for (const q of Q) { const st = stateOf(q); if (st === \"staged\") continue; if (st === \"open\") c.open++; else if (st === \"decided\") c.decided++; else if (st === \"deferred\") c.deferred++; else if (st === \"reopened\") c.reopened++; }\n  $(\"#readout\").innerHTML = [[\"open\", c.open], [\"reopened\", c.reopened], [\"staged\", c.staged], [\"decided\", c.decided], [\"deferred\", c.deferred]]\n    .map(([k, v]) => `\u003cspan class=\"${k === \"staged\" && v ? \"is-live\" : \"\"}\">${k}\u003cb>${v}\u003c/b>\u003c/span>`).join(\"\");\n}\n\n/* ---------- map layout ---------- */\nconst mapEl = $(\"#map\"), nodesEl = $(\"#nodes\"), edgesEl = $(\"#edges\"), colsEl = $(\"#cols\");\nconst rounds = [...new Set(Q.map((q) => q.round))].sort((a, b) => a - b);\nconst order = []; // reading order after layout\n\nfunction computeLayout() {\n  const W = mapEl.clientWidth, H = mapEl.clientHeight;\n  const gutter = 76, padR = 16, top = 12, bottom = 12, gap = 14;\n  const pos = {};\n  order.length = 0;\n  const frontierRound = Math.max(...Q.filter((q) => q.status === \"open\").map((q) => q.round));\n  const weights = rounds.map((r) => (r === frontierRound ? 1.9 : 1));\n  const unit = (H - top - bottom) / weights.reduce((a, b) => a + b, 0);\n  const rowTops = []; let acc = top; rounds.forEach((r, i) => { rowTops.push(acc); acc += weights[i] * unit; });\n  const rowPitch = unit;\n  const hBase = Math.max(26, Math.min(42, Math.floor(unit - 7)));\n  const left = gutter, right = W - padR, span = right - left;\n  rounds.forEach((r, ri) => {\n    const nodes = Q.filter((q) => q.round === r);\n    const pitch = weights[ri] * unit;\n    const h = r === frontierRound ? Math.max(hBase, Math.min(76, Math.floor(pitch - 14))) : hBase;\n    const y = Math.round(rowTops[ri] + (pitch - h) / 2);\n    const w = Math.floor(Math.max(110, Math.min(300, (span - gap * (nodes.length - 1)) / nodes.length)));\n    const memo = {};\n    const baryOf = (q) => {\n      if (memo[q.id] != null) return memo[q.id];\n      const ps = q.deps.map((d) => pos[d] ? pos[d].cx : (byId[d] && byId[d].round === r ? baryOf(byId[d]) + 0.01 : null)).filter((v) => v != null);\n      return (memo[q.id] = ps.length ? ps.reduce((s, v) => s + v, 0) / ps.length : left + span / 2);\n    };\n    const items = nodes.map((q, i) => ({ q, b: baryOf(q), i })).sort((a, b) => a.b - b.b || a.i - b.i);\n    const xs = items.map((o) => o.b - w / 2);\n    for (let i = 1; i \u003c xs.length; i++) xs[i] = Math.max(xs[i], xs[i - 1] + w + gap);\n    const meanB = items.reduce((s, o) => s + o.b, 0) / items.length;\n    const meanX = xs.reduce((s, x) => s + x + w / 2, 0) / xs.length;\n    const shift = meanB - meanX;\n    for (let i = 0; i \u003c xs.length; i++) xs[i] += shift;\n    const over = xs[xs.length - 1] + w - right;\n    if (over > 0) for (let i = 0; i \u003c xs.length; i++) xs[i] -= over;\n    if (xs[0] \u003c left) { xs[0] = left; for (let i = 1; i \u003c xs.length; i++) xs[i] = Math.max(xs[i], xs[i - 1] + w + gap); }\n    items.forEach((o, i) => { const x = Math.round(xs[i]); pos[o.q.id] = { x, y, w, h, cx: x + w / 2, row: ri, tall: h >= 60 }; order.push(o.q.id); });\n  });\n  return { pos, rowTops, rowHeights: weights.map((w) => w * unit), frontierRound, top, gutter, h: hBase, compact: hBase \u003c 30, W, H };\n}\n\nfunction buildMap() {\n  colsEl.innerHTML = \"\"; nodesEl.innerHTML = \"\"; edgesEl.innerHTML = \"\";\n  rounds.forEach((r) => { const c = el(\"div\", \"map__col\"); c.dataset.round = r; c.innerHTML = `\u003cspan>round ${r}\u003c/span>`; colsEl.appendChild(c); });\n  for (const q of Q) {\n    const b = el(\"button\", \"node\"); b.type = \"button\"; b.dataset.id = q.id; b.setAttribute(\"aria-label\", `${num(q.id)} ${q.title}`);\n    b.addEventListener(\"click\", () => select(q.id, { focus: false }));\n    b.addEventListener(\"mouseenter\", () => setHover(q.id));\n    b.addEventListener(\"mouseleave\", () => setHover(null));\n    b.addEventListener(\"focus\", () => setHover(q.id));\n    b.addEventListener(\"blur\", () => setHover(null));\n    nodesEl.appendChild(b);\n    for (const d of q.deps) { const p = document.createElementNS(\"http://www.w3.org/2000/svg\", \"path\"); p.classList.add(\"edge\"); p.dataset.from = d; p.dataset.to = q.id; edgesEl.appendChild(p); }\n  }\n}\n\nfunction placeMap() {\n  layoutInfo = computeLayout();\n  const { pos, rowTops, rowHeights, compact, frontierRound } = layoutInfo;\n  mapEl.classList.toggle(\"is-compact\", compact);\n  const frontierRounds = new Set(Q.filter(isFrontier).map((q) => q.round));\n  colsEl.querySelectorAll(\".map__col\").forEach((c, i) => { c.style.top = `${rowTops[i]}px`; c.style.height = `${rowHeights[i]}px`; c.classList.toggle(\"is-frontier\", frontierRounds.has(rounds[i])); c.querySelector(\"span\").textContent = `round ${rounds[i]}`; });\n  nodesEl.querySelectorAll(\".node\").forEach((n) => { const p = pos[n.dataset.id]; n.style.width = `${p.w}px`; n.style.height = `${p.h}px`; n.style.transform = `translate(${p.x}px, ${p.y}px)`; n.classList.toggle(\"node--tall\", !!p.tall); });\n  edgesEl.querySelectorAll(\".edge\").forEach((e) => {\n    const a = pos[e.dataset.from], b = pos[e.dataset.to];\n    if (a.row === b.row) { const y = a.y + a.h / 2; const x1 = a.x \u003c b.x ? a.x + a.w : a.x, x2 = a.x \u003c b.x ? b.x : b.x + b.w; e.setAttribute(\"d\", `M${x1},${y} L${x2},${y}`); return; }\n    const x1 = a.cx, y1 = a.y + a.h, x2 = b.cx, y2 = b.y, dy = Math.max(10, (y2 - y1) * 0.6);\n    e.setAttribute(\"d\", `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`);\n  });\n  drawLeaders();\n}\n\nfunction renderNodes() {\n  const risk = riskMap();\n  const lineage = hovered || selected;\n  const rel = lineage ? new Set([lineage, ...ancestors(lineage), ...descendants(lineage).keys()]) : null;\n  nodesEl.querySelectorAll(\".node\").forEach((n) => {\n    const q = byId[n.dataset.id], st = stateOf(q), s = staged.get(q.id);\n    n.dataset.state = st;\n    if (risk.has(q.id) && !(s && s.answer)) { n.dataset.risk = \"1\"; n.style.setProperty(\"--depth\", risk.get(q.id)); if (!lastRisk.has(q.id)) { n.classList.remove(\"is-ripple\"); void n.offsetWidth; n.classList.add(\"is-ripple\"); } } else { delete n.dataset.risk; n.style.removeProperty(\"--depth\"); n.classList.remove(\"is-ripple\"); }\n    n.title = `${num(q.id)} ${q.title}${q.answer ? \" — \" + fullStatement(q) : \"\"}`;\n    n.classList.toggle(\"is-selected\", q.id === selected);\n    n.classList.toggle(\"is-dim\", !!rel && !rel.has(q.id) && !!hovered);\n    n.classList.toggle(\"is-linked\", coveredIds.includes(q.id) && (hovered === q.id));\n    let l2;\n    if (st === \"staged\") l2 = `→ ${stagedLabel(s.answer)}${s.answer.kind === \"reopen\" ? \" · was \" + esc(answerStatement(q)) : \"\"}`;\n    else if (st === \"decided\") l2 = esc(answerStatement(q));\n    else if (st === \"reopened\") l2 = `reopened · \u003cs>${esc(answerStatement(q))}\u003c/s>`;\n    else if (st === \"deferred\") l2 = `deferred · rec ${q.rec.option}`;\n    else l2 = `open · rec ${q.rec.option}${q.updated ? \" · updated\" : \"\"}`;\n    if (risk.has(q.id) && !(s && s.answer)) { const src = [...riskSources()].filter((r) => descendants(r).has(q.id)).map(num).join(\" \"); l2 = `at risk · ${src} reopened · ${l2}`; }\n    const marks = [q.durable ? '\u003ci class=\"mark mark--durable\" title=\"durable decision\">\u003c/i>' : \"\", q.updated ? '\u003ci class=\"mark mark--updated\" title=\"recommendation updated\">\u003c/i>' : \"\", coveredIds.includes(q.id) ? '\u003ci class=\"mark mark--visual\" title=\"drawn in the visual\">\u003c/i>' : \"\", s && s.reply ? '\u003ci class=\"mark mark--updated\" title=\"reply staged\" style=\"border-radius:1px\">\u003c/i>' : \"\"].join(\"\");\n    n.innerHTML = `\u003cspan class=\"node__l1\">\u003cspan class=\"node__id\">${num(q.id)}\u003c/span>\u003cspan class=\"node__title\">${esc(q.title)}\u003c/span>\u003c/span>\u003cspan class=\"node__l2\">${l2}\u003c/span>\u003cspan class=\"node__marks\">${marks}\u003c/span>`;\n  });\n  lastRisk = new Set(risk.keys());\n  const riskEdges = new Set(risk.keys());\n  edgesEl.querySelectorAll(\".edge\").forEach((e) => {\n    const inLineage = rel && rel.has(e.dataset.from) && rel.has(e.dataset.to);\n    e.classList.toggle(\"is-lineage\", !!inLineage);\n    e.classList.toggle(\"is-dim\", !!rel && !inLineage && !riskEdges.has(e.dataset.to));\n    const nowRisk = riskEdges.has(e.dataset.to);\n    if (nowRisk && !e.classList.contains(\"is-risk\")) { e.classList.add(\"is-ripple\"); } else if (!nowRisk) e.classList.remove(\"is-ripple\");\n    e.classList.toggle(\"is-risk\", nowRisk);\n  });\n}\n\nfunction setHover(id) { hovered = id; renderNodes(); postHighlight(); drawLeaders(); }\n\n/* ---------- selection and console ---------- */\nfunction select(id, { focus = true, scroll = true } = {}) {\n  selected = id;\n  renderNodes(); renderCons fault();\n});\n\n/* ---------- boot ---------- */\nbuildMap();\nrenderLamp(); renderVisualHead(); loadVisual();\nconst firstOpen = Q.find((q) => q.status === \"open\") || Q[0];\nplaceMap(); fitFrame();\nselect(firstOpen.id, { focus: false });\nrefresh();\nnew ResizeObserver(() => { placeMap(); fitFrame(); }).observe(mapEl);\nnew ResizeObserver(() => fitFrame()).observe(stageEl);\naddEventListener(\"resize\", drawLeaders);\nwindow.__grill = { select, stage, send, act, staged, order, state: stateOf, openPalette, toggleVisual, visualize };\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"];

<script>
(() => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const main = document.getElementById("main"), tabsEl = document.getElementById("tabs");
  const notesBtn = document.getElementById("notesBtn"), popBtn = document.getElementById("popBtn");
  let current = "brief";
  const pref = { notes: false };
  const SKILL = {
    "hallmark": "Hallmark", "web-design-engineer": "Web Design Engineer", "ui-ux-pro-max": "UI/UX Pro Max",
    "taste-skill": "Taste", "gpt-taste": "GPT Taste", "gpt-tasteskill": "GPT Taste",
    "make-interfaces-feel-better": "Make Interfaces Feel Better",
  };
  const skillChips = (d) => `<div class="chips">${(d.skills || []).map((s, i) => s.split(" (")[0]).map((s, i) => `<span class="chip${i === 0 ? " is-lead" : ""}">${esc(SKILL[s] || s)}${i === 0 ? " · lead" : ""}</span>`).join("")}</div>`;

  const views = [{ id: "brief", label: "Brief" }, ...DIRECTIONS.map((d, i) => ({ id: "d" + (i + 1), label: d.name, n: i + 1 })), { id: "compare", label: "Compare" }];

  tabsEl.innerHTML = views.map((v) => `<button type="button" class="tab" role="tab" id="tab-${v.id}" aria-controls="view-${v.id}" aria-selected="false" tabindex="-1" data-id="${v.id}">${v.n ? `<span class="n">${v.n}</span>` : ""}${esc(v.label)}</button>`).join("");

  // ---- brief ----
  const brief = `<div class="doc">
    <h2>Three bets on what the grill page is</h2>
    <p class="lead">Inbox treats a grill as a queue: a list, a card and a pane. These three start from what the grill actually is, a wall of work to critique, an interview on the record, or a graph of decisions, and let the form follow. Each was designed by its own agent from a different mix of design skills, with no view of the others or of Inbox. They're working mockups on the real session: stage answers, press <kbd>?</kbd> for keys.</p>
    <div class="cards">${DIRECTIONS.map((d, i) => `<button type="button" class="card" data-go="d${i + 1}">
      <span class="n">Direction ${i + 1}</span><h4>${esc(d.name)}</h4><p>${esc(d.tagline)}</p>
      <p><b>Model:</b> ${esc(d.model)}</p>${skillChips(d)}<span class="open">Open →</span></button>`).join("")}</div>
    <h3>What we're after</h3>
    <p>The job is fast shared understanding between you and the agent. At a glance you should see what the agent is asking and recommending and why, what's decided, what's open and what you've staged, the discussion on each question, and the visual and how it links to the questions. Then you should be able to clear a round of 7–8 open questions quickly and find any earlier decision in one look.</p>
    <h3>The only rule: serve the purpose</h3>
    <p>There were no design constraints on these three. Keys, controls, flow, theme and type were all open. Each one also had to meet a second rule: it had to be one self-contained offline file built on the real session data: rounds 1–8 from a real grill, round 9 open, Q15 and Q16 reopened, Q23 deferred and the visual stale.</p>
    <h3>If one of these gets built</h3>
    <ul>
      <li>Any change a direction makes to how the page and the agent's visual talk to each other is listed in its notes under contract changes. The iframe sandbox that keeps agent-written code away from the session stays in all three.</li>
      <li>Costs relative to a plain list UI are listed honestly under each direction's notes, together with the places where a skill's advice was overridden.</li>
    </ul>
  </div>`;

  // ---- compare ----
  const row = (label, f) => `<tr><th scope="row">${label}</th>${DIRECTIONS.map((d) => `<td>${f(d)}</td>`).join("")}</tr>`;
  const list = (a, fn) => `<ul>${(a || []).map((x) => `<li>${fn(x)}</li>`).join("")}</ul>`;
  const compare = `<div class="doc" style="max-width:1200px">
    <h2>Side by side</h2>
    <p class="lead">Same functionality, three different bets on what matters most.</p>
    <div class="table-wrap"><table>
      <thead><tr><th></th>${DIRECTIONS.map((d, i) => `<th scope="col">${i + 1}. ${esc(d.name)}</th>`).join("")}</tr></thead>

        ${row("Costs", (d) => list(d.tradeoffs, esc))}
        ${row("Type", (d) => esc(d.type))}
        ${row("Palette", (d) => `<div class="pal">${(d.palette || []).map((p) => `<i style="background:${esc(p.hex)}" title="${esc(p.name)} ${esc(p.hex)}: ${esc(p.role)}"></i>`).join("")}</div>`)}
      </tbody>
    </table></div>
  </div>`;

  // ---- direction views ----
  const notes = (d, i) => `<p class="chip" style="display:inline-block;margin:0 0 8px">Direction ${i + 1}</p>
    <h2>${esc(d.name)}</h2><p class="tagline">${esc(d.tagline)}</p>${skillChips(d)}
    <h3>Layout model</h3><p>${esc(d.model)}</p>
    <h3>Philosophy</h3><p>${esc(d.philosophy)}</p>
    <h3>Principles → decisions</h3>${list(d.principles, (p) => `<b>${esc(p.principle)}</b><span>${esc(p.decision)}</span>`)}
    <h3>How it serves the purpose</h3>${list(d.fixes, (f) => `<b>${esc(f.finding)}</b><span>${esc(f.how)}</span>`)}
    <h3>Costs</h3>${list(d.tradeoffs, esc)}
    <h3>Best for</h3><p>${esc(d.bestFor)}</p>
    <h3>Palette</h3><div class="swatches">${(d.palette || []).map((p) => `<div class="sw"><i style="background:${esc(p.hex)}"></i><div>${esc(p.name)}<br><code>${esc(p.hex)}</code><br><span style="color:var(--ink-3)">${esc(p.role)}</span></div></div>`).join("")}</div>
    <h3>Type</h3><p>${esc(d.type)}</p>
    ${(d.contractChanges || []).length ? `<h3>Contract changes</h3>${list(d.contractChanges, (c) => esc(typeof c === "string" ? c : JSON.stringify(c)))}` : ""}
    ${(d.skillOverrides || []).length ? `<h3>Where product rules overrode a skill</h3>${list(d.skillOverrides, (o) => esc(typeof o === "string" ? o : [o.skill, o.advice, o.override || o.why].filter(Boolean).join(": ")))}` : ""}`;

  main.innerHTML = `<section class="view" id="view-brief" role="tabpanel" aria-labelledby="tab-brief" hidden>${brief}</section>` +
    DIRECTIONS.map((d, i) => `<section class="view dir" id="view-d${i + 1}" role="tabpanel" aria-labelledby="tab-d${i + 1}" hidden>
      <div class="stage"><div class="device"></div></div><aside class="notes" aria-label="Notes on ${esc(d.name)}">${notes(d, i)}</aside></section>`).join("") +
    `<section class="view" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>${compare}</section>`;

  // Each direction is its own document, mounted lazily on first view so its keyboard layer and state stay isolated.
  const mount = (i) => {
    const dev = document.querySelector(`#view-d${i + 1} .device`);
    if (dev.firstChild) return;
    const f = document.createElement("iframe");
    f.title = DIRECTIONS[i].name + " mockup";
    f.srcdoc = DOCS[i];
    dev.appendChild(f);
  };

  const apply = () => {
    document.querySelectorAll(".dir").forEach((el) => el.classList.toggle("with-notes", pref.notes));
    notesBtn.setAttribute("aria-pressed", String(pref.notes));
  };

  const show = (id, focusTab) => {
    if (!views.some((v) => v.id === id)) id = "brief";
    views.forEach((v) => {
      const on = v.id === id, t = document.getElementById("tab-" + v.id);
      t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1;
      document.getElementById("view-" + v.id).hidden = !on;
    });
    const isDir = /^d\d$/.test(id);
    notesBtn.hidden = popBtn.hidden = !isDir;
    current = id;
    if (isDir) mount(+id.slice(1) - 1);
    const t = document.getElementById("tab-" + id);
    t.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (focusTab) t.focus();
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  };

  tabsEl.addEventListener("click", (e) => { const t = e.target.closest(".tab"); if (t) show(t.dataset.id); });
  tabsEl.addEventListener("keydown", (e) => {
    const ids = views.map((v) => v.id), cur = ids.indexOf(document.activeElement.dataset.id);
    const next = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: ids.length - 1 }[e.key];
    if (next === undefined || cur < 0) return;
    e.preventDefault(); show(ids[(next + ids.length) % ids.length], true);
  });
  main.addEventListener("click", (e) => { const c = e.target.closest("[data-go]"); if (c) show(c.dataset.go, true); });
  notesBtn.addEventListener("click", () => { pref.notes = !pref.notes; apply(); });
  // Each mockup was designed for a whole 1440×900 window; this gives it one, without the bar above.
  popBtn.addEventListener("click", () => {
    const i = +current.slice(1) - 1;
    window.open(URL.createObjectURL(new Blob([DOCS[i]], { type: "text/html" })), "_blank");
  });
  addEventListener("hashchange", () => show(location.hash.slice(1)));

  apply();
  show(location.hash.slice(1) || "brief");
})();
</script>
</body>
</html>
