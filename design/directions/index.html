; --gap:56px;\n  --h1:58px; --qs:28px; --body:19px; --opt:17px;\n}\n@media (max-width:1300px){ :root{ --gutter:40px; --rail:196px; --margin:312px; --gap:40px; --h1:50px; --qs:26px; --body:18px; --opt:16px; } }\n@media (min-width:1800px){ .strip{height:92px} .q{padding-top:34px} .q h1{margin-top:18px} .q .body{margin-top:22px} .choices{margin-top:40px;column-gap:64px} .acts{margin-top:32px} .marg{padding-top:34px}\n :root{ --gutter:120px; --rail:260px; --margin:440px; --gap:80px; --h1:84px; --qs:36px; --body:23px; --opt:20px; } }\n\n*{box-sizing:border-box}\nhtml{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}\nbody{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--text);overflow:hidden;height:100vh}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}\nbutton:active:not([aria-disabled=\"true\"]){transform:scale(.96)}\nbutton{transition:transform var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}\n:focus-visible{outline:2px solid var(--ink);outline-offset:3px}\nh1,h2,h3{text-wrap:balance;margin:0}\np{text-wrap:pretty;margin:0}\n.mono{font-family:var(--mono)}\n.num{font-variant-numeric:tabular-nums}\n.kick{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}\n.kick.red,.red{color:var(--red)}\n[hidden]{display:none !important}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n\n/* ---------- masthead ---------- */\n.mast{height:var(--mast);display:flex;align-items:center;gap:28px;padding:0 var(--gutter);border-bottom:1px solid var(--ink)}\n.mast .topic{font:400 22px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}\n.mast .doc{font:400 13px/1 var(--mono);color:var(--ink-2);white-space:nowrap}\n.mast .issue{font:400 13px/1 var(--mono);color:var(--ink-2);white-space:nowrap}\n.mast .status{margin-left:auto;font:400 13px/1 var(--mono);white-space:nowrap;display:flex;align-items:center;gap:10px}\n.mast .status .lamp{width:8px;height:8px;background:var(--ink);transition:background-color var(--t-mid)}\n.mast .status.working .lamp{background:var(--red);animation:pulse 1.2s infinite}\n.mast .status.queue .lamp{background:transparent;outline:1px solid var(--edge)}\n@keyframes pulse{50%{opacity:.35}}\n.mast nav{display:flex;gap:4px}\n.mast nav button{font:400 13px/1 var(--mono);padding:14px 10px;color:var(--ink-2)}\n.mast nav button:hover{color:var(--ink);background:var(--paper-2)}\n.mast nav button kbd,.rail kbd,.acts kbd,.sheet kbd,.opt kbd,.verdict kbd,.stale kbd{font:500 11px/1 var(--mono);color:var(--ink);border:1px solid var(--edge);padding:3px 5px 2px;min-width:20px;text-align:center;display:inline-block;margin-left:8px;vertical-align:1px;text-transform:none;letter-spacing:0}\n\n/* ---------- stage grid ---------- */\n.stage{position:relative;height:calc(100vh - var(--mast) - var(--send));display:grid;grid-template-columns:minmax(0,1fr) var(--margin);grid-template-rows:auto minmax(0,1fr);column-gap:var(--gap);padding:0 var(--gutter);max-width:1760px;margin:0 auto}\n\n/* filmstrip: the round as a strip of frames */\n.strip{grid-column:1/-1;position:relative;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--ink);height:78px;overflow:hidden}\n.strip .counts{flex:0 0 auto;align-self:center;font:400 13px/1.5 var(--mono);color:var(--ink-2);padding-right:28px;margin-right:6px;border-right:1px solid var(--rule);white-space:nowrap}\n.strip .counts b{font-weight:500;color:var(--ink)}\n.strip .counts .staged{color:var(--red)}\n.strip ol{list-style:none;margin:0;padding:0;display:flex;align-items:stretch;flex:1;min-width:0;position:relative}\n.strip .ind{position:absolute;left:0;top:0;height:3px;width:80px;background:var(--red);transition:transform var(--t-mid) var(--ease),width var(--t-mid) var(--ease);pointer-events:none}\n.strip li{display:flex;min-width:0}\n.strip li.frame{flex:1 1 0}\n.strip li.frame button{display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;min-width:0;text-align:left;padding:8px 12px 8px 12px;border-left:1px solid var(--rule)}\n.strip li.frame button:hover{background:var(--paper-2)}\n.strip .n{font:400 12px/1.2 var(--mono);color:var(--ink-3)}\n.strip .s{font:500 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.strip .t{font:400 14px/1.3 var(--text);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--t-fast)}\n.strip li.cur .t{color:var(--ink);font-weight:500}\n.strip li.cur .n{color:var(--ink)}\n.strip li.staged .s,.strip li.reopened .s,.strip li.updated .s{color:var(--red)}\n.strip li.decided .s{color:var(--ink)}\n.strip li.staged .t{color:var(--ink)}\n.strip li.deferred .t,.strip li.decided .t{color:var(--ink-3)}\n.strip li.sub{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 0;align-items:center;justify-content:center;border-right:1px solid var(--rule);margin-left:8px}\n.strip li.fromrecord{flex:0 0 auto}\n.strip li.fromrecord button{border-left:1px solid var(--rule);border-right:3px double var(--ink);padding-right:18px}\n.strip li.fromrecord .s{color:var(--ink)}\n.strip li.fromrecord.cur .t{max-width:20ch}\n\n/* article */\n.stagemain{position:relative;min-width:0;height:100%;overflow:hidden}\n.q{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 8px 40px 0;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}\n.q:focus-visible{outline:none}\n.q.enter-down{animation:enterDown var(--t-slow) var(--ease) both}\n.q.enter-up{animation:enterUp var(--t-slow) var(--ease) both}\n.q.leave-down{animation:leaveUp var(--t-fast) var(--ease) both;pointer-events:none}\n.q.leave-up{animation:leaveDown var(--t-fast) var(--ease) both;pointer-events:none}\n@keyframes enterDown{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}\n@keyframes enterUp{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}\n@keyframes leaveUp{to{opacity:0;transform:translateY(-14px)}}\n@keyframes leaveDown{to{opacity:0;transform:translateY(14px)}}\n\n.q .kicker{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;min-height:20px}\n.q .kicker button{font:inherit;color:var(--ink-3);box-shadow:inset 0 -1px 0 var(--rule);letter-spacing:inherit;text-transform:inherit;padding:10px 0}\n.q .kicker button:hover{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}\n.q .band{margin:14px 0 0;padding:10px 14px;border-left:3px solid var(--red);background:var(--red-soft);font:400 15px/1.45 var(--text);color:var(--ink)}\n.q .band.ink{border-color:var(--ink);background:var(--paper-2)}\n.q .band .kick{display:block;margin-bottom:2px}\n.q h1{font:400 var(--h1)/1.02 var(--display);letter-spacing:-.018em;margin:12px 0 0;max-width:24ch;display:flex;gap:.45em;align-items:baseline}\n.q h1 .qn{font:400 .34em/1 var(--mono);letter-spacing:.04em;color:var(--ink-3);flex:0 0 auto;position:relative;top:-.9em}\n.q .body{font:400 var(--body)/1.42 var(--text);color:var(--ink-2);margin:14px 0 0;max-width:64ch}\n\n/* choices: the recommendation is the first choice, the rest sit beside it */\n.choices{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);column-gap:44px;margin:26px 0 0;align-items:start}\n.verdict{padding:0 0 0 22px;border-left:1px solid var(--ink);position:relative;cursor:pointer}\n.verdict:hover blockquote{color:var(--red)}\n.verdict .kick{display:flex;gap:14px;align-items:baseline}\n.verdict .kick kbd{margin-left:auto}\n.verdict .kick kbd + kbd{margin-left:4px}\n.verdict blockquote{margin:8px 0 0;font:400 var(--qs)/1.18 var(--quote);letter-spacing:-.005em;color:var(--ink);transition:color var(--t-fast)}\n.verdict blockquote .k{font:400 .5em/1 var(--mono);color:var(--ink-3);vertical-align:.45em;margin-right:.5em;font-style:normal}\n.verdict .why{margin:12px 0 0;font:400 calc(var(--opt) - 1px)/1.42 var(--text);color:var(--ink-2)}\n.verdict .why .lbl{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:8px}\n.verdict .why .cost{display:block;margin-top:3px}\n.verdict .why .cost .lbl{color:var(--red)}\n.verdict .accept{margin:14px 0 0;font:400 15px/1 var(--mono);padding:11px 14px;background:var(--ink);color:var(--paper)}\n.verdict .accept:hover{background:#2a2825}\n.verdict .accept kbd{color:var(--paper);border-color:#6f6c66}\n.verdict .accept.on{background:var(--red)}\n.verdict .accept.on kbd{border-color:#e0968a}\n.verdict .tagline{margin:10px 0 0;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}\n.verdict .tagline.red{color:var(--red)}\n\n/* voice: my reply */\n.voice{margin:22px 0 6px;padding-left:22px;border-left:3px solid var(--red);max-width:70ch}\n.voice .kick{display:flex;justify-content:space-between;gap:12px}\n.voice label{display:block}\n.voice textarea{display:block;width:100%;margin-top:8px;font:400 24px/1.3 var(--text);color:var(--ink);background:transparent;border:0;resize:none;padding:0;min-height:96px;outline:none}\n.voice textarea::placeholder{color:var(--ink-3)}\n.voice .hint{margin-top:8px;font:400 12px/1.5 var(--mono);color:var(--ink-3)}\n.voice .hint b{font-weight:500;color:var(--ink)}\n.voice .staged-note{margin-top:8px;font:italic 400 17px/1.4 var(--text);color:var(--red)}\n\n/* options */\n.opts{list-style:none;margin:0;padding:0}\n.opts .kick{padding-bottom:8px;border-bottom:1px solid var(--ink)}\n.opt{display:grid;grid-template-columns:36px 24px 1fr;column-gap:12px;align-items:baseline;width:100%;text-align:left;padding:12px 8px 12px 0;border-bottom:1px solid var(--rule);position:relative}\n.opt kbd{margin:0;width:28px;font-size:13px;padding:5px 0 4px;text-align:center;justify-self:start}\n.opt .l{font:400 13px/1 var(--mono) r(--ease);will-change:transform}\n#plateWrap iframe{width:1000px;height:420px;border:0;display:block;background:#f7f4ee}\n#plateWrap.mini iframe{pointer-events:none}\n#plateWrap.hiddenp{opacity:0;pointer-events:none}\n#pins{position:fixed;left:0;top:0;z-index:26;pointer-events:none}\n#pins .pin{position:absolute;transform:translate(0,0);font:500 11px/1 var(--mono);letter-spacing:.04em;background:var(--ink);color:var(--paper);padding:4px 6px 3px;white-space:nowrap;opacity:0;transition:opacity var(--t-fast) var(--ease)}\n#pins .pin.red{background:var(--red)}\n#pins .pin.show{opacity:1}\n#pins .pin.dim{opacity:.55}\n\n/* ---------- dialogs ---------- */\ndialog{border:0;padding:0;background:var(--paper);color:var(--ink);max-width:640px;width:min(92vw,640px);box-shadow:0 1px 0 oklch(0 0 0/.06),0 24px 60px -20px oklch(0 0 0/.35);outline:1px solid var(--ink)}\ndialog::backdrop{background:oklch(0.12 0.005 80 / .28)}\ndialog .dhead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 28px 14px;border-bottom:1px solid var(--ink)}\ndialog h2{font:400 32px/1 var(--display);letter-spacing:-.02em}\ndialog .dhead button{font:400 13px/1 var(--mono);color:var(--ink-2);padding:12px 0}\ndialog .dbody{padding:18px 28px 28px;max-height:70vh;overflow:auto}\ndialog .dfoot{display:flex;justify-content:flex-end;gap:10px;padding:0 28px 24px}\ndialog .dfoot button{font:400 14px/1 var(--mono);padding:12px 18px;border:1px solid var(--edge)}\ndialog .dfoot button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}\ndialog .dfoot button.primary:hover{background:#2a2825}\n.terms dt{font:600 19px/1.3 var(--text);margin-top:16px}\n.terms dt:first-child{margin-top:0}\n.terms dd{margin:2px 0 0;font:400 16px/1.45 var(--text);color:var(--ink-2)}\n.terms dd .avoid{display:block;margin-top:4px;font:400 12px/1.5 var(--mono);color:var(--red)}\n.keys{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}\n.keys dl{margin:0}\n.keys div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--rule)}\n.keys dt{font:400 15px/1.3 var(--text);color:var(--ink-2)}\n.keys dd{margin:0;font:400 12px/1 var(--mono)}\n.keys dd kbd{font:500 12px/1 var(--mono);border:1px solid var(--edge);padding:4px 6px 3px;margin-left:4px;display:inline-block}\n.keys h3{grid-column:1/-1;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 4px}\n.keys h3:first-child{margin-top:0}\ndialog p.lead{font:400 19px/1.4 var(--text);color:var(--ink)}\ndialog p.sub{margin-top:10px;font:400 15px/1.45 var(--text);color:var(--ink-2)}\n\n/* toast */\n#toasts{position:fixed;left:50%;bottom:calc(var(--send) + 18px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}\n.toast{pointer-events:auto;background:var(--ink);color:var(--paper);font:400 15px/1.3 var(--text);padding:12px 18px;display:flex;align-items:center;gap:18px;box-shadow:0 12px 30px -12px oklch(0 0 0/.5);animation:toastIn var(--t-mid) var(--ease) both}\n.toast.out{animation:toastOut 160ms var(--ease) both}\n.toast button{font:400 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);border:1px solid #6f6c66;padding:10px 12px}\n.toast button:hover{background:#2a2825}\n@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}\n@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}\n\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}\n  .mast .status.working .lamp{animation:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"mast\">\n  \u003cdiv class=\"topic\" id=\"topic\">\u003c/div>\n  \u003cdiv class=\"doc mono\" id=\"docpath\">\u003c/div>\n  \u003cdiv class=\"issue mono\" id=\"issue\">\u003c/div>\n  \u003cdiv class=\"status mono\" id=\"status\">\u003cspan class=\"lamp\" aria-hidden=\"true\">\u003c/span>\u003cspan id=\"statusText\">Waiting for you\u003c/span>\u003c/div>\n  \u003cnav aria-label=\"Views\">\n    \u003cbutton data-act=\"terms\">Terms\u003ckbd>t\u003c/kbd>\u003c/button>\n    \u003cbutton data-act=\"record\">The record\u003ckbd>l\u003c/kbd>\u003c/button>\n    \u003cbutton data-act=\"plate\">Plate\u003ckbd>v\u003c/kbd>\u003c/button>\n    \u003cbutton data-act=\"keys\" aria-label=\"Keyboard shortcuts\">Keys\u003ckbd>?\u003c/kbd>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cmain class=\"stage\" id=\"stage\">\n  \u003cnav class=\"strip\" id=\"strip\" aria-label=\"This round\">\u003c/nav>\n  \u003cdiv class=\"stagemain\" id=\"stagemain\">\u003c/div>\n  \u003caside class=\"marg\" id=\"marg\" aria-label=\"Margin\">\u003c/aside>\n\u003c/main>\n\n\u003cfooter class=\"sendbar\">\n  \u003cdiv class=\"sum\" id=\"sendsum\">\u003c/div>\n  \u003cbutton class=\"finish\" data-act=\"finish\">Finish, write \u003cspan class=\"mono\" id=\"finishdoc\">\u003c/span>\u003c/button>\n  \u003cbutton class=\"send\" id=\"sendbtn\" data-act=\"send\" aria-disabled=\"true\">\u003cspan id=\"sendlabel\">Nothing staged\u003c/span>\u003ckbd>⌘↵\u003c/kbd>\u003c/button>\n\u003c/footer>\n\n\u003csection class=\"sheet record\" id=\"record\" aria-label=\"The record\" hidden>\n  \u003cdiv class=\"inner\" id=\"recordInner\">\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sheet plate\" id=\"plate\" aria-label=\"Plate\" hidden>\n  \u003cdiv class=\"inner\">\n    \u003cdiv class=\"plateframe\">\n      \u003cdiv class=\"stale\" id=\"staleBar\">\u003c/div>\n      \u003cdiv class=\"anchor\" id=\"plateAnchor\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"caption\" id=\"plateCaption\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cdiv id=\"plateWrap\" class=\"mini\">\u003ciframe id=\"frame\" sandbox=\"allow-scripts\" title=\"Visual prototype\">\u003c/iframe>\u003c/div>\n\u003cdiv id=\"pins\">\u003c/div>\n\n\u003cdialog id=\"dlgTerms\" class=\"terms\">\u003c/dialog>\n\u003cdialog id=\"dlgKeys\">\u003c/dialog>\n\u003cdialog id=\"dlgFinish\">\u003c/dialog>\n\u003cdiv id=\"toasts\" aria-live=\"polite\">\u003c/div>\n\n\u003cscript>// Mockup data for design/mockups (spec §9.1). Inlined into each *.template.html by build.mjs.\n// SESSION is in the real state.json shape (spec §4; Jason's schema, grill-with-ui SKILL.md:392-417):\n// questions is an ARRAY; rounds are derived from question.round.\n// Rounds 1–8 are Jason Ku's real grill-with-ui design session of 2026-09-06 (commit daafa1e,\n// design/mockups/data.js), text unchanged. Round 9 (q18–q25) is synthetic: 7 open + q23 deferred;\n// q15 and q16 were answered, then reopened (see their threads); the visual (v3) is stale.\n// VISUAL_HTML is the v3 prototype: regions carry data-q and it ends with the verbatim\n// grilling-ui linkage listener (plan Task 20). \"\u003c\\/script>\" keeps it safe when inlined in \u003cscript>.\nconst SESSION = {\n  \"topic\": \"grill-with-ui skill\",\n  \"doc\": \"docs/design.md\",\n  \"project\": \"~/Projects/grill-with-ui\",\n  \"created\": \"2026-09-06T21:00:00Z\",\n  \"agent\": {\n    \"status\": \"waiting\",\n    \"since\": \"2026-09-06T22:46:00Z\",\n    \"handled\": 9\n  },\n  \"note\": \"Round 9 is open. Q15 and Q16 were reopened by later answers; Q23 is deferred.\",\n  \"visual\": {\n    \"kind\": \"prototype\",\n    \"version\": 3,\n    \"at\": \"2026-09-06T22:31:00Z\",\n    \"stale\": true,\n    \"note\": \"v3: Inbox layout with the doc path in the send bar per Q9; stale since Q15 was reopened\",\n    \"thread\": [\n      {\n        \"who\": \"user\",\n        \"text\": \"Put the doc path next to Finish so I can see where it will write.\",\n        \"at\": \"2026-09-06T22:26:00Z\"\n      },\n      {\n        \"who\": \"agent\",\n        \"text\": \"Done in v3: the send bar shows → docs/design.md and the section order from Q16.\",\n        \"at\": \"2026-09-06T22:31:00Z\"\n      }\n    ]\n  },\n  \"terms\": [\n    {\n      \"term\": \"Round\",\n      \"def\": \"One agent turn's worth of new questions: the current frontier.\",\n      \"avoid\": [\n        \"batch\",\n        \"wave\"\n      ]\n    },\n    {\n      \"term\": \"Frontier\",\n      \"def\": \"Questions whose prerequisites are all settled and can be asked now.\",\n      \"avoid\": [\n        \"queue\",\n        \"next up\"\n      ]\n    },\n    {\n      \"term\": \"Send\",\n      \"def\": \"One press of Send to Agent: every staged action shipped as a single event.\",\n      \"avoid\": [\n        \"submit\",\n        \"reply\"\n      ]\n    },\n    {\n      \"term\": \"Durable decision\",\n      \"def\": \"Hard to reverse, surprising without context, a real trade-off. Goes under Locked decisions.\",\n      \"avoid\": [\n        \"ADR\",\n        \"big decision\"\n      ]\n    }\n  ],\n  \"questions\": [\n    {\n      \"id\": \"q1\",\n      \"round\": 1,\n      \"deps\": [],\n      \"title\": \"UI surface\",\n      \"body\": \"What is the UI surface, and how does it talk to the running session? This is the root decision; state format, threads and resume all hang off it.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Local browser app. A tiny bundled server serves a page and reads/writes one state file per session. Terminal stays a parallel input.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Read-only side panel. Claude re-renders an HTML summary each turn; you still answer in the terminal by number.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"MCP app panel. Only if Claude Code renders it. Heavier to build and install.\"\n        },\n        {\n          \"k\": \"D\",\n          \"text\": \"Terminal TUI. Doesn't solve scrollback. Listed to rule out.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Works in any terminal today, nothing to install, and the file protocol is agent-neutral so a Codex version is packaging, not a rewrite.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\",\n        \"text\": \"A is exactly what I was thinking\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q2\",\n      \"round\": 2,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Transport\",\n      \"body\": \"How does a browser answer reach the running Claude session? Docs check: Monitor wakes an idle session; a background shell exiting does not; Channels need a launch flag.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Persistent Monitor on the server's WebSocket. Every browser action is one event and one Claude turn.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Claude Code Channels. Officially blessed, but needs a startup flag and a plugin.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Manual nudge: answer in the browser, type 'go' in the terminal.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"No startup flags, works from inside the skill. Live test fired while idle: verified.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"text\",\n        \"text\": \"Simpler: the web app writes to a local JSON and the agent has a file-change watcher on it.\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"agent\",\n          \"text\": \"Yes, and simpler than what I proposed. Refinement: two files, not one. state.json written only by the agent; events.jsonl appended only by the web app, watched with plain tail -F.\",\n          \"at\": \"2026-09-06T21:11:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q3\",\n      \"round\": 3,\n      \"deps\": [\n        \"q2\"\n      ],\n      \"title\": \"Questions per turn\",\n      \"body\": \"When Claude replies to a batch, how many new questions does it post on top of the thread replies?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Exactly one new primary question per turn. Keeps 'resolve dependencies one by one'.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Up to a few new questions when they're independent. Fewer round trips; recommendations can go stale.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"You already batch on your side; keeping Claude to one at a time is what makes recommendations trustworthy.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"option\",\n        \"option\": \"B\",\n        \"text\": \"\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q4\",\n      \"round\": 3,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Thread context\",\n      \"body\": \"What does 'chat more about a question without losing context' mean mechanically?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"One Claude session; threads are labeled messages. Nothing is separate under the hood.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"A subagent per thread, seeded with a summary. Isolation, but loses exactly the context you want.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"The thing you're missing is navigation, not isolation. The page provides that.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q5\",\n      \"round\": 4,\n      \"deps\": [\n        \"q4\"\n      ],\n      \"title\": \"Question card shape\",\n      \"body\": \"What does a question look like on the page, and how do you answer it? This fixes the state schema.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Structured card: title, body, lettered options, a recommendation pointing at one, a rationale. Answer by option, Accept, or free text. Thread box separate.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Free text everywhere. Simpler schema, no one-click accept.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Grilling already produces lettered options and a named recommendation, so structure costs nothing.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q6\",\n      \"round\": 4,\n      \"deps\": [\n        \"q1\"\n      ],\n      \"title\": \"Terminal role\",\n      \"body\": \"What does the terminal do while a grill runs in the page?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"One-line status per turn, plus the URL. Terminal typing still works and is recorded into state.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Terminal goes silent. Launch only.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Terminal mirrors the full text. Defeats the purpose.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Same scrollback cost as silence, and it gives you the 'Claude is waiting' signal where you're already looking.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q7\",\n      \"round\": 4,\n      \"deps\": [\n        \"q2\"\n      ],\n      \"title\": \"Server lifecycle\",\n      \"body\": \"Who starts and stops the local server, and how do we guarantee it dies? Orphaned processes have bitten this machine before.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"The server is the monitor. It lives exactly as long as the monitor: killed at session end or on Finish. Nothing to orphan.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Server in the background, separate tail watcher. Needs its own shutdown story; every option is a way to leak.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Same file-based design, with writer and watcher collapsed into one process the harness already manages.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q8\",\n      \"round\": 5,\n      \"deps\": [\n        \"q5\"\n      ],\n      \"title\": \"Finish + deliverable\",\n      \"body\": \"How does a grill end, and what's the deliverable? Past grills all ended as design docs.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Explicit Finish button; Claude writes a markdown decisions doc from state. Doc path asked once at start.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"No explicit end; the state file is the record.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Writing from a structured state file is more faithful than writing from a long transcript.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"user\",\n          \"text\": \"Can you also look up Matt Pocock's grill-with-docs skill to see what we can borrow for the docs part, and compare it to the docs we already generate?\",\n          \"at\": \"2026-09-06T21:39:00Z\"\n        },\n        {\n          \"who\": \"agent\",\n          \"text\": \"Fetched it. It's one line: run grilling + domain-modeling. The docs part writes a repo-wide CONTEXT.md glossary and sparse ADRs gated on hard-to-reverse, surprising, real trade-off. Your docs are the opposite shape: one exhaustive topic doc builders consume as the spec. Turned into Q9.\",\n          \"at\": \"2026-09-06T21:41:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q9\",\n      \"round\": 5,\n      \"deps\": [\n        \"q8\"\n      ],\n      \"title\": \"What Finish writes\",\n      \"body\": \"Your exhaustive topic doc, Matt's sparse ADRs and glossary, or both?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Your design doc, with two borrows: a per-decision durable flag (Locked vs Routine sections) and a Terms section with Avoid lists.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Your design doc plus ADRs in docs/adr and a root CONTEXT.md. Two places to keep in sync.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Matt's files only. Rejected: builders need the exhaustive doc.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"The durable flag and the terms section fix two real problems; repo-wide files can be an opt-in flag later.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q10\",\n      \"round\": 6,\n      \"deps\": [\n        \"q7\"\n      ],\n      \"title\": \"State location + resume\",\n      \"body\": \"Where does session state live, and how does resume work? Several worktrees per project here.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Per-session folder under home, keyed by git common root (working directory when not in git). Resume lists unfinished sessions for the project.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Inside the repo, gitignored. Lives in one worktree; ws reset wipes it.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Worktree independence decides it here; for adopters it also means zero repo changes.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": true,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": [\n        {\n          \"who\": \"user\",\n          \"text\": \"Hm, what would be easier for other people to adopt?\",\n          \"at\": \"2026-09-06T21:52:00Z\"\n        },\n        {\n          \"who\": \"agent\",\n          \"text\": \"Outside the repo, by a wider margin: zero repo changes, one mental model, works outside git, resume is discoverable anyway. Only loss: sessions don't travel with a clone, which is a non-goal.\",\n          \"at\": \"2026-09-06T21:54:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q11\",\n      \"round\": 6,\n      \"deps\": [\n        \"q10\"\n      ],\n      \"title\": \"Stack\",\n      \"body\": \"What is the server and page built with? Must run the moment the skill is installed.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Plain Node, no dependencies, no build step. One server script, one self-contained HTML page.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Bun. Nicer API, not on most machines.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"React with a build step.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Claude Code requires Node, so every adopter has it. Polish comes from CSS, not the framework.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q12\",\n      \"round\": 7,\n      \"deps\": [\n        \"q9\"\n      ],\n      \"title\": \"Relation to grilling skills\",\n      \"body\": \"How does grill-with-ui relate to the grilling and grill-me skills you already have?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Self-contained new skill with its own interview prompt (frontier-per-round) plus the page protocol. Developed in its own repo, symlinked in.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Composition, Matt-style: invoke grilling plus a protocol skill. Two skills fighting over output format.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"A flag on grill-me.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"One folder, one prompt, nothing to depend on. Publishable later without extraction.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q13\",\n      \"round\": 7,\n      \"deps\": [\n        \"q11\"\n      ],\n      \"title\": \"Agent neutrality\",\n      \"body\": \"Claude Code only, or agent-neutral from the start? Codex has no Monitor; Bedrock/Vertex Claude Code lacks it too.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Add a blocking wait mode to the server now: blocks in the foreground until the next Send, prints it, exits. About twenty lines.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Claude Code only for v1.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Cheap, also the fallback for Claude Code without Monitor, keeps the no-lock-in promise.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q14\",\n      \"round\": 7,\n      \"deps\": [\n        \"q13\"\n      ],\n      \"title\": \"Build order\",\n      \"body\": \"What gets built first? One assumption is unverified: the harness labels monitor events 'not user input'; the skill prompt says Send events are your answers.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Spike the wake-up path first: minimal server, one-textarea page, stub prompt with only the event rule. One real round.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Build everything, then test end to end.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"The only piece that can't be reasoned out from what we already know.\"\n      },\n      \"status\": \"answered\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": {\n        \"kind\": \"accept\",\n        \"option\": \"A\"\n      },\n      \"thread\": []\n    },\n    {\n      \"id\": \"q15\",\n      \"round\": 8,\n      \"deps\": [\n        \"q11\"\n      ],\n      \"title\": \"Page visual direction\",\n      \"body\": \"Three mockups are on the table. Which layout carries forward into the spike page?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Inbox: question list on the left, one detail card on the right, sticky send bar.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Scro    \"text\": \"Reopened: Q24 lets Finish run with open questions, so the doc needs somewhere to list them. The accepted order has Deferred but no Open threads section. Proposed: add Open threads after Deferred, and a Verified facts section before Risks.\",\n          \"at\": \"2026-09-06T22:45:00Z\"\n        }\n      ]\n    },\n    {\n      \"id\": \"q17\",\n      \"round\": 8,\n      \"deps\": [\n        \"q15\"\n      ],\n      \"title\": \"Keyboard shortcuts\",\n      \"body\": \"j/k to move between questions, a/b/c to pick an option, enter to stage, cmd+enter to send?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Yes, all of them, shown in a footer hint.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Defer to after the spike.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"B\",\n        \"why\": \"Zero cost to add later; not on the critical path.\"\n      },\n      \"status\": \"deferred\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": null,\n      \"thread\": []\n    },\n    {\n      \"id\": \"q18\",\n      \"round\": 9,\n      \"deps\": [\n        \"q9\"\n      ],\n      \"title\": \"Where does Finish save the visual?\",\n      \"body\": \"The visual lives in the session folder while the grill runs. When Finish writes the design doc, where does the final visual go?\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Copy it next to the doc as docs/\u003cslug>-visual.html and link it from the doc header.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Leave it in the session folder and link the absolute path.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Inline a screenshot into the doc; drop the HTML.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"It travels with the doc in the repo and still opens offline. Costs one more file per ilently disappears. Costs a doc that may ship with loose ends.\"\n      },\n      \"status\": \"open\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": null,\n      \"thread\": []\n    },\n    {\n      \"id\": \"q25\",\n      \"round\": 9,\n      \"deps\": [\n        \"q5\"\n      ],\n      \"title\": \"Who may reopen an answered question?\",\n      \"body\": \"Reopening sends a settled decision back to the frontier and can invalidate downstream answers.\",\n      \"options\": [\n        {\n          \"k\": \"A\",\n          \"text\": \"Both: the user from the page, the agent when a later answer conflicts, always with a thread note.\"\n        },\n        {\n          \"k\": \"B\",\n          \"text\": \"Only the user.\"\n        },\n        {\n          \"k\": \"C\",\n          \"text\": \"Only the agent.\"\n        },\n        {\n          \"k\": \"D\",\n          \"text\": \"Nobody; ask a new question instead.\"\n        }\n      ],\n      \"rec\": {\n        \"option\": \"A\",\n        \"why\": \"Conflicts found by the agent surface where the decision lives, not in the terminal. Costs some churn when the agent reopens too eagerly.\"\n      },\n      \"status\": \"open\",\n      \"durable\": false,\n      \"updated\": false,\n      \"answer\": null,\n      \"thread\": []\n    }\n  ]\n};\n\nconst VISUAL_HTML = `\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>grill-with-ui v3\u003c/title>\n\u003cstyle>\n  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif; color: #1f1c18; background: #f7f4ee; }\n  .chrome { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #e6e0d4; font-size: 12px; color: #625b51; }\n  .url { flex: 1; background: #fff; border-radius: 4px; padding: 2px 8px; font-family: ui-monospace, Menlo, monospace; }\n  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; bor ser app\u003c/span>\u003c/div>\n  \u003cheader data-q=\"q12\">\u003ch1>grill-with-ui\u003c/h1>\u003cspan class=\"chip\">self-contained skill\u003c/span>\u003cspan class=\"chip\">round 9 · 7 open\u003c/span>\u003c/header>\n  \u003cdiv class=\"app assumed\" data-q=\"q15\" data-tag=\"assumed · Q15 open\">\n    \u003cnav>\n      \u003cdiv>R1 · UI surface ✓\u003c/div>\u003cdiv>R2 · Transport ✓\u003c/div>\u003cdiv>R8 · Page visual direction ↺\u003c/div>\u003cdiv class=\"cur\">R9 · Where does Finish save…\u003c/div>\u003cdiv>R9 · Should the visual run…\u003c/div>\n    \u003c/nav>\n    \u003cmain>\n      \u003cdiv class=\"card\" data-q=\"q5\">\n        \u003ch2>Where does Finish save the visual?\u003c/h2>\n        \u003cdiv class=\"opt rec\">A · Copy it next to the doc as docs/&lt;slug&gt;-visual.html\u003c/div>\n        \u003cdiv class=\"opt\">B · Leave it in the session folder\u003c/div>\n        \u003cdiv class=\"opt\">C · Inline a screenshot\u003c/div>\n      \u003c/div>\n    \u003c/main>\n  \u003c/div>\n  \u003cfooter data-q=\"q9\">\u003cspan class=\"doc\">→ docs/design.md · Terms · Locked · Routine\u003c/span>\u003cbutton>Finish grill\u003c/button>\u003cbutton class=\"primary\">Send to Agent\u003c/button>\u003c/footer>\n  \u003cdiv class=\"term\" data-q=\"q6\">● grill-with-ui: round 9 posted · 7 open · waiting on the page\u003c/div>\n\u003cscript>\n/* grilling-ui linkage: copy verbatim */\n(() => {\n  const P = window.parent;\n  const st = document.createElement(\"style\");\n  st.textContent = \".grill-hl{outline:2px solid #8a5a12;outline-offset:2px}\";\n  document.head.appendChild(st);\n  addEventListener(\"message\", (e) => {\n    if (e.source !== P || !e.data || !Array.isArray(e.data.highlight)) return;\n    const ids = e.data.highlight.filter((x) => /^q\\\\d+$/.test(x));\n    document.querySelectorAll(\"[data-q]\").forEach((el) => el.classList.toggle(\"grill-hl\", ids.includes(el.dataset.q)));\n  });\n  addEventListener(\"click\", (e) => { const r = e.target.closest(\"[data-q]\"); if (r) P.postMessage({ clicked: r.dataset.q }, \"*\"); });\n  addEventListener(\"keydown\", (e) => {\n    if ((e.metaKey || e.ctrlKey) && e.key === \"Enter\") { e.preventDefault(); P.postMessage({ key: \"send\" }, \"*\"); }\n    else if (e.key === \"Escape\") P.postMessage({ key: \"escape\" }, \"*\");\n  });\n})();\n\u003c\\/script>\n\u003c/body>\n\u003c/html>\n`;\n\u003c/script>\n\u003cscript>\n(() => {\n'use strict';\nconst S = SESSION;\nconst $ = (s, r=document) => r.querySelector(s);\nconst esc = s => String(s ?? '').replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst byId = Object.fromEntries(S.questions.map(q => [q.id, q]));\nconst qnum = id => id.replace(/^q/, 'Q');\nconst optText = (q, k) => (q.options.find(o => o.k === k) || {}).text || '';\nconst firstSentence = t => { const m = t.match(/^(.+?[.!?])(\\s|$)/); return m ? [m[1], t.slice(m[1].length).trim()] : [t, '']; };\nconst reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst fmtTime = iso => { const d = new Date(iso); return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0'); };\nconst fmtDate = iso => { const d = new Date(iso); return d.getUTCDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]; };\nconst currentRound = Math.max(...S.questions.map(q => q.round));\nconst KEYS = { '1':'A','2':'B','3':'C','4':'D' };\n\n// ------- state -------\nconst st = {\n  cur: null,\n  staged: new Map(),      // qid -> {kind, option?, text?}\n  view: 'stage',          // stage | record | plate\n  status: S.agent.status === 'waiting' ? 'waiting' : S.agent.status,\n  visual: { version: S.visual.version, stale: S.visual.stale, note: S.visual.note, at: S.visual.at, thread: [...S.visual.thread] },\n  regions: [],\n  replyOpen: false,\n  hoverQ: null,\n  recFocus: 0,\n  sentExplore: null,\n  guardUntil: 0,\n};\nconst reverseDeps = {}; S.questions.forEach(q => q.deps.forEach(d => (reverseDeps[d] ||= []).push(q.id)));\n\n// ------- derived -------\nfunction frontier() {\n  const open = S.questions.filter(q => q.status === 'open').sort((a,b) => a.round - b.round || +a.id.slice(1) - +b.id.slice(1));\n  const re = S.questions.filter(q => q.status === 'reopened');\n  const def = S.questions.filter(q => q.status === 'deferred' && q.round === currentRound);\n  return { open, re, def, all: [...open, ...re, ...def] };\n}\nfunction counts() {\n  const f = frontier();\n  const need = [...f.open, ...f.re];\n  const stagedInFrontier = need.filter(q => st.staged.has(q.id)).length;\n  return { open: need.length - stagedInFrontier, staged: st.staged.size, total: need.length, reopened: f.re.length, deferred: f.def.length };\n}\nfunction stateOf(q) {\n  if (st.staged.has(q.id)) return 'staged';\n  if (q.status === 'answered') return 'decided';\n  return q.status; // open | deferred | reopened\n}\nfunction stagedStatement(q, a) {\n  if (!a) return '';\n  switch (a.kind) {\n    case 'accept': return `Accept ${a.option}: ${firstSentence(optText(q, a.option))[0]}`;\n    case 'option': return `${a.option}: ${firstSentence(optText(q, a.option))[0]}`;\n    case 'text': return `“${a.text}”`;\n    case 'defer': return 'Defer';\n    case 'reopen': return a.text ? `Reopen: “${a.text}”` : 'Reopen';\n  }\n  return '';\n}\nfunction decidedStatement(q) {\n  const a = q.answer; if (!a) return '';\n  if (a.kind === 'text') return `“${a.text}”`;\n  return optText(q, a.option);\n}\nfunction decidedNote(q) {\n  const a = q.answer; if (!a) return '';\n  if (a.kind === 'accept') return 'Accepted the recommendation' + (a.text ? `: “${a.text}”` : '');\n  if (a.kind === 'option') return a.option === q.rec.option ? `Chose ${a.option}, the recommendation` : `Chose ${a.option} over the recommended ${q.rec.option}`;\n  if (a.kind === 'text') return `In your own words, instead of the recommended ${q.rec.option}`;\n  return '';\n}\nfunction whyParts(why) {\n  const parts = why.split(/(?\u003c=[.!?])\\s+/);\n  const cost = parts.filter(p => /\\bcost/i.test(p));\n  const rest = parts.filter(p => !/\\bcost/i.test(p));\n  return { why: rest.join(' ') || why, cost: cost.join(' ') };\n}\nconst regionQs = () => { const ids = []; VISUAL_HTML.replace(/data-q=\"(q\\d+)\"/g, (_, id) => { if (!ids.includes(id)) ids.push(id); }); return ids; };\n\n// ------- masthead -------\n$('#topic').textContent = S.topic;\n$('#docpath').textContent = '→ ' + S.doc;\n$('#finishdoc').textContent = S.doc;\nfunction renderMast() {\n  const c = counts();\n  $('#issue').textContent = `Round ${currentRound}, ${c.total} to answer`;\n  const el = $('#status'); el.className = 'status mono ' + st.status;\n  $('#statusText').textContent = st.status === 'working' ? 'Agent working…' : st.status === 'queue' ? 'No agent listening: requests queue' : 'Agent waiting for you';\n}\n\n// ------- filmstrip -------\nfunction renderStrip() {\n  const f = frontier(); const c = counts();\n  const inFrontier = f.all.some(q => q.id === st.cur);\n  const item = (q, extraCls = '') => {\n    const s = stateOf(q);\n    const label = { staged: 'staged', decided: 'decided', open: 'open', deferred: 'deferred', reopened: 'reopened' }[s];\n    const extra = q.updated && s !== 'staged' ? ', new rec' : '';\n    return `\u003cli class=\"frame ${s}${q.updated ? ' updated' : ''}${q.id === st.cur ? ' cur' : ''} ${extraCls}\" data-q=\"${q.id}\">\u003cbutton data-go=\"${q.id}\" aria-current=\"${q.id === st.cur ? 'true' : 'false'}\" title=\"${esc(q.title)}\">\u003cspan class=\"n num\">${qnum(q.id)}\u003c/span>\u003cspan class=\"t\">${esc(q.title)}\u003c/span>\u003cspan class=\"s\">${label}${extra}\u003c/span>\u003c/button>\u003c/li>`;\n  };\n  let html = `\u003cdiv class=\"counts num\">\u003cb>${c.open}\u003c/b> open\u003cbr>\u003cspan class=\"staged\">\u003cb>${c.staged}\u003c/b> staged\u003c/span> \u003cb>${c.reopened}\u003c/b> reopened\u003c/div>\u003col>`;\n  html += `\u003cspan class=\"ind\" id=\"stripInd\" aria-hidden=\"true\">\u003c/span>`;\n  if (!inFrontier && st.cur) html += item(byId[st.cur], 'fromrecord');\n  html += f.open.map(q => item(q)).join('');\n  if (f.re.length) html += `\u003cli class=\"sub\" aria-hidden=\"true\">Reopened\u003c/li>` + f.re.map(q => item(q)).join('');\n  if (f.def.length) html += `\u003cli class=\"sub\" aria-hidden=\"true\">Deferred\u003c/li>` + f.def.map(q => item(q)).join('');\n  html += '\u003c/ol>';\n  $('#strip').innerHTML = html;\n  requestAnimationFrame(placeInd);\n}\nfunction placeInd() {\n  const ind = $('#stripInd'); const li = $('#strip li.cur');\n  if (!ind) return;\n  if (!li) { ind.style.opacity = '0'; return; }\n  ind.style.opacity = '1';\n  const ol = li.parentElement.getBoundingClientRect(); const r = li.getBoundingClientRect();\n  ind.style.transform = `translateX(${r.left - ol.left}px)`; ind.style.width = r.width + 'px';\n}\n\n// ------- article -------\nfunction renderArticle(q, dir) {\n  const a = st.staged.get(q.id);\n  const s = stateOf(q);\n  const deps = q.deps.map(d => byId[d]).filter(Boolean);\n  const feeds = (reverseDeps[q.id] || []).map(d => byId[d]);\n  let kicker = `\u003cspan class=\"kick\">Round ${q.round}\u003c/span>`;\n  if (deps.length) kicker += `\u003cspan class=\"kick\">Hangs off ${deps.map(d => `\u003cbutton data-record=\"${d.id}\">${qnum(d.id)} ${esc(d.title)}\u003c/button>`).join(', ')}\u003c/span>`;\n  if (feeds.length) kicker += `\u003cspan class=\"kick\">Feeds ${feeds.map(d => `\u003cbutton data-go=\"${d.id}\">${qnum(d.id)}\u003c/button>`).join(', ')}\u003c/span>`;\n  if (q.durable) kicker += `\u003cspan class=\"kick\">Locked once decided\u003c/span>`;\n\n  let band = '';\n  const reopenNote = q.thread.filter(t => /^Reopened/i.test(t.text)).slice(-1)[0];\n  if (q.status === 'reopened') band = `\u003cdiv class=\"band\">\u003cspan class=\"kick red\">Reopened${reopenNote ? ` by the ${reopenNote.who} at ${fmtTime(reopenNote.at)}` : ''}. Not settled.\u003c/span>Was ${q.answer ? (q.answer.kind === 'text' ? `“${esc(q.answer.text)}”` : `${q.answer.option}: ${esc(firstSentence(optText(q, q.answer.option))[0])}`) : ''} ${reopenNote ? '\u003cbr>' + esc(reopenNote.text.replace(/^Reopened:\\s*/i, '')) : ''}\u003c/div>`;\n  else if (q.status === 'answered') band = `\u003cdiv class=\"band ink\">\u003cspan class=\"kick\">Decided in round ${q.round}${q.durable ? ', locked' : ''}\u003c/span>${esc(decidedStatement(q))}\u003cbr>\u003cspan class=\"small\" style=\"color:var(--ink-2)\">${esc(decidedNote(q))}. Press \u003cb>o\u003c/b> to reopen it.\u003c/span>\u003c/div>`;\n  else if (q.status === 'deferred') band = `\u003cdiv class=\"band ink\">\u003cspan class=\"kick\">Deferred\u003c/span>The agent recommended ${q.rec.option}. Answer it now with 1-4, a, or r; it comes off the deferred list when you send.\u003c/div>`;\n\n  const wp = whyParts(q.rec.why);\n  const recOpt = q.options.find(o => o.k === q.rec.option);\n  const recIdx = q.options.indexOf(recOpt) + 1;\n  const recPicked = a && (a.kind === 'accept' || (a.kind === 'option' && a.option === recOpt.k));\n  const recDecided = q.status === 'answered' && q.answer && q.answer.option === recOpt.k;\n  const recWas = q.status === 'reopened' && q.answer && q.answer.option === recOpt.k;\n  const verdict = `\u003csection class=\"verdict\" aria-label=\"Recommendation\" data-pick=\"${recOpt.k}\" role=\"button\" tabindex=\"0\" aria-pressed=\"${!!recPicked}\">\n    \u003cdiv class=\"kick\">The agent recommends${q.updated ? '\u003cspan class=\"red\">updated\u003c/span>' : ''}\u003ckbd>${recIdx}\u003c/kbd>\u003ckbd>a\u003c/kbd>\u003c/div>\n    \u003cblockquote>\u003cspan class=\"k\">${recOpt.k}\u003c/span>${esc(recOpt.text)}\u003c/blockquote>\n    \u003cp class=\"why\">\u003cspan class=\"lbl\">Why\u003c/span>${esc(wp.why)}${wp.cost ? `\u003cspan class=\"cost\">\u003cspan class=\"lbl\">Cost\u003c/span>${esc(wp.cost)}\u003c/span>` : ''}\u003c/p>\n    ${q.status !== 'answered' ? `\u003cbutton class=\"accept${recPicked ? ' on' : ''}\" data-act=\"accept\">${recPicked ? 'Accepted, staged' : 'Accept ' + recOpt.k}\u003ckbd>a\u003c/kbd>\u003c/button>` : ''}\n    ${recDecided ? `\u003cp class=\"tagline\">Decided: this one\u003c/p>` : recWas ? `\u003cp class=\"tagline red\">Was the answer, reopened\u003c/p>` : ''}\n  \u003c/section>`;\n\n  const voice = `\u003csection class=\"voice\" id=\"voice\" ${st.replyOpen || (a && a.kind === 'text') ? '' : 'hidden'}>\n    \u003cdiv class=\"kick\">\u003clabel for=\"reply\" class=\"red\">You, in your own words\u003c/label>\u003cspan>Answer, object or ask. The agent reads it either way.\u003c/span>\u003c/div>\n    ${a && a.kind === 'text' && !st.replyOpen ? `\u003cp class=\"staged-note\">“${esc(a.text)}” \u003cspan class=\"kick red\">staged, not sent\u003c/span>\u003c/p>` : `\u003ctextarea id=\"reply\" rows=\"3\" placeholder=\"${q.status === 'answered' ? 'Say what should change and why.' : 'Say what you would do instead, or what the agent is missing.'}\">\u003c/textarea>\u003cp class=\"hint\">\u003cb>Enter\u003c/b> stages it as your answer to ${qnum(q.id)}. \u003cb>Shift+Enter\u003c/b> for a new line. \u003cb>Esc\u003c/b> closes.\u003c/p>`}\n  \u003c/section>`;\n\n  const others = q.options.filter(o => o.k !== q.rec.option);\n  const opts = `\u003cdiv>\u003cdiv class=\"kick opts-kick\" style=\"padding-bottom:8px;border-bottom:1px solid var(--ink)\">Or instead\u003c/div>\u003col class=\"opts\" aria-label=\"Other options\">${others.map(o => {\n    const i = q.options.indexOf(o);\n    const picked = a && a.kind === 'option' && a.option === o.k;\n    const decided = q.status === 'answered' && q.answer && q.answer.option === o.k;\n    const wasIt = q.status === 'reopened' && q.answer && q.answer.option === o.k;\n    let tag = '';\n    if (picked) tag = 'staged';\n    else if (decided) tag = 'decided';\n    else if (wasIt) tag = 'was the answer, reopened';\n    return `\u003cli>\u003cbutton class=\"opt${picked ? ' picked' : ''}${decided ? ' decided' : ''}${a && !picked ? ' faded' : ''}\" data-pick=\"${o.k}\" aria-pressed=\"${!!picked}\">\u003ckbd>${i + 1}\u003c/kbd>\u003cspan class=\"l\">${o.k}\u003c/span>\u003cspan class=\"txt\">${esc(o.text)}\u003c/span>${tag ? `\u003cspan class=\"tag${wasIt ? ' red' : ''}\">${tag}\u003c/span>` : ''}\u003c/button>\u003c/li>`;\n  }).join('')}\u003c/ol>\u003c/div>`;\n\n  const acts = `\u003cdiv class=\"acts\" role=\"toolbar\" aria-label=\"Actions\">\n    \u003cbutton data-act=\"reply\" class=\"object ${st.replyOpen ? 'on' : ''}\">Object, or answer in your own words\u003ckbd>r\u003c/kbd>\u003c/button>\n    ${q.status === 'answered' ? `\u003cbutton data-act=\"reopen\" class=\"${a && a.kind === 'reopen' ? 'on' : ''}\">${a && a.kind === 'reopen' ? 'Reopen staged' : 'Reopen'}\u003ckbd>o\u003c/kbd>\u003c/button>` : `\u003cbutton data-act=\"defer\" class=\"${a && a.kind === 'defer' ? 'on' : ''}\">${a && a.kind === 'defer' ? 'Deferred, staged' : 'Defer'}\u003ckbd>d\u003c/kbd>\u003c/button>`}\n    \u003cbutton data-act=\"explore\">Explore deeper, sends now\u003ckbd>e\u003c/kbd>\u003c/button>\n    ${a ? `\u003cbutton data-act=\"unstage\">Unstage\u003ckbd>u\u003c/kbd>\u003c/button>` : ''}\n  \u003c/div>`;\n\n  const html = `${kicker ? `\u003cdiv class=\"kicker\">${kicker}\u003c/div>` : ''}${band}\n    \u003ch1>\u003cspan class=\"qn\">${qnum(q.id)}\u003c/span>${esc(q.title)}\u003c/h1>\n    \u003cp class=\"body\">${esc(q.body)}\u003c/p>\n    ${voice}\u003cdiv class=\"choices\">${verdict}${opts}\u003c/div>${acts}`;\n\n  const main = $('#stagemain');\n  const old = main.querySelector('.q:not(.leave-down):not(.leave-up)');\n  const art = document.createElement('article');\n  art.className = 'q' + (dir && !reduced ? (dir > 0 ? ' enter-down' : ' enter-up') : '');\n  art.setAttribute('aria-label', qnum(q.id) + ' ' + q.title);\n  art.innerHTML = html;\n  if (old && dir && !reduced) {\n    old.className = 'q ' + (dir > 0 ? 'leave-down' : 'leave-up');\n    old.addEventListener('animationend', () => old.remove(), { once: true });\n    setTimeout(() => old.remove(), 300);\n  } else if (old) old.remove();\n  main.querySelectorAll('.q:not(.leave-down):not(.leave-up)').forEach(n => n.remove());\n  main.appendChild(art);\n  art.addEventListener('animationend', () => art.classList.remove('enter-down', 'enter-up'), { once: true });\n}\n\n// ------- margin -------\nfunction renderMargin(q) {\n  const a = st.staged.get(q.id);\n  const s = stateOf(q);\n  // state block\n  let stateBlock = `\u003csection aria-label=\"State\">\u003cdiv class=\"kick${s === 'staged' || s === 'reopened' ? ' red' : ''}\">${{ staged: 'Staged, not sent', decided: 'Decided', open: 'Open', deferred: 'Deferred', reopened: 'Reopened, not settled' }[s]}${q.updated ? ' \u003cspan class=\"red\">· rec updated\u003c/span>' : ''}\u003c/div>`;\n  if (a) stateBlock += `\u003cp class=\"stmt red\">${esc(stagedStatement(q, a))}\u003c/p>`;\n  else if (q.status === 'answered') stateBlock += `\u003cp class=\"stmt\">${esc(decidedStatement(q))}\u003c/p>\u003cp class=\"small\">${esc(decidedNote(q))}${q.durable ? '. Locked' : ''}.\u003c/p>`;\n  else if (q.status === 'reopened') stateBlock += `\u003cp class=\"small\">The earlier answer no longer counts. Answer it again or defer it.\u003c/p>`;\n  else if (q.status === 'deferred') stateBlock += `\u003cp class=\"small\">Parked. Nothing is staged.\u003c/p>`;\n  else stateBlock += `\u003cp class=\"small\">Pick 1-4, accept with a, or answer in your own words with r.\u003c/p>`;\n  stateBlock += '\u003c/section>';\n\n  // deps\n  const deps = q.deps.map(d => byId[d]).filter(Boolean);\n  const feeds = (reverseDeps[q.id] || []).map(d => byId[d]).filter(Boolean);\n  let depBlock = '';\n  if (deps.length || feeds.length) {\n    depBlock = `\u003csection aria-label=\"Dependencies\">\u003cdiv class=\"kick\">Depends on\u003c/div>\u003cdiv class=\"deps\">`;\n    depBlock += deps.map(d => {\n      const ds = stateOf(d); const ans = d.answer ? (d.answer.kind === 'text' ? `“${d.answer.text}”` : `${d.answer.option}: ${firstSentence(optText(d, d.answer.option))[0]}`) : '';\n      return `\u003cbutton data-record=\"${d.id}\">\u003cspan class=\"qn\">${qnum(d.id)}\u003c/span>\u003cspan>\u003cspan class=\"t\">${esc(d.title)}\u003c/span>\u003cspan class=\"a${ds === 'reopened' ? ' red' : ''}\">${ds === 'reopened' ? 'Reopened, was ' : ''}${esc(ans)}${d.durable ? ' (locked)' : ''}\u003c/span>\u003c/span>\u003c/button>`;\n    }).join('');\n    if (feeds.length) depBlock += `\u003cdiv class=\"kick\" style=\"margin-top:12px\">Feeds\u003c/div>` + feeds.map(d => `\u003cbutton data-go=\"${d.id}\">\u003cspan class=\"qn\">${qnum(d.id)}\u003c/span>\u003cspan>\u003cspan class=\"t\">${esc(d.title)}\u003c/span>\u003cspan class=\"a\">${stateOf(d)}\u003c/span>\u003c/span>\u003c/button>`).join('');\n    depBlock += '\u003c/div>\u003c/section>';\n  }\n\n  // plate\n  const covered = regionQs();\n  const inPlate = covered.includes(q.id);\n  const plateBlock = `\u003csection class=\"platesec\" aria-label=\"Visual\">\u003cdiv class=\"kick\">Plate v${st.visual.version}${st.visual.stale ? ' \u003cspan class=\"red\">stale\u003c/span>' : ''}\u003c/div>\n    \u003cdiv class=\"plateslot\" id=\"plateSlot\" role=\"button\" tabindex=\"0\" aria-label=\"Open the plate\">\u003cdiv class=\"cover\">\u003c/div>\u003cdiv class=\"cap\">\u003cspan>${inPlate ? `${qnum(q.id)} is drawn here` : `${qnum(q.id)} is not drawn`}\u003c/span>\u003cspan>Open\u003ckbd style=\"margin-left:6px\">v\u003c/kbd>\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"small\">Figures in this plate\u003c/p>\u003cdiv class=\"figs\">${covered.map(id => `\u003cbutton data-fig=\"${id}\" class=\"${id === q.id ? 'on' : ''}\">${qnum(id)} ${esc(byId[id].title)}\u003c/button>`).join('')}\u003c/div>\u003c/section>`;\n\n  // thread\n  const items = q.thread.map(t => `\u003cli>\u003cdiv class=\"who${t.who === 'user' ? ' me' : ''}\">\u003cspan>${t.who === 'user' ? 'You' : 'Agent'}\u003c/span>\u003cspan>${fmtTime(t.at)}\u003c/span>\u003c/div>\u003cp>${esc(t.text)}\u003c/p>\u003c/li>`);\n  if (a && (a.kind === 'text' || a.kind === 'reopen') && a.text) items.push(`\u003cli class=\"staged\">\u003cdiv class=\"who me\">\u003cspan>You\u003c/span>\u003cspan class=\"red\">staged\u003c/span>\u003c/div>\u003cp>${esc(a.text)}\u003c/p>\u003c/li>`);\n  if (st.sentExplore === q.id) items.push(`\u003cli>\u003cdiv class=\"who me\">\u003cspan>You\u003c/span>\u003cspan>sent\u003c/span>\u003c/div>\u003cp>Explore this deeper before I answer.\u003c/p>\u003c/li>`);\n  const threadBlock = `\u003csection aria-label=\"Thread\">\u003cdiv class=\"kick\">Thread\u003c/div>${items.length ? `\u003col class=\"thread\">${items.join('')}\u003c/ol>` : `\u003cp class=\"thread\">\u003cspan class=\"empty\">No exchange yet. r opens your reply.\u003c/span>\u003c/p>`}\u003c/section>`;\n\n  $('#marg').innerHTML = stateBlock + depBlock + plateBlock + threadBlock;\n  requestAnimationFrame(layoutPlate);\n}\n\n// ------- send bar -------\nfunction renderSend() {\n  const n = st.staged.size;\n  const sum = $('#sendsum');\n  const was = q => q.status === 'answered' && q.answer ? (q.answer.kind === 'text' ? 'own words' : q.answer.option) : q.status;\n  const mark = (q, a) => {\n    const ins = a.kind === 'defer' ? 'defer' : a.kind === 'reopen' ? `reopen: “${a.text}”` : a.kind === 'text' ? `“${a.text}”` : (a.kind === 'accept' ? 'accept ' : '') + a.option;\n    return `\u003cli title=\"${esc(stagedStatement(q, a))}\">\u003cspan class=\"qn\">${qnum(q.id)}\u003c/span>\u003cs>${esc(was(q))}\u003c/s>\u003cspan class=\"caret\" aria-hidden=\"true\">^\u003c/span>\u003cspan class=\"ins\">${esc(ins)}\u003c/span>\u003c/li>`;\n  };\n  if (!n) sum.innerHTML = `\u003cspan class=\"kick\">Send will ship\u003c/span>\u003cspan class=\"none\">nothing yet. Staged edits line up here.\u003c/span>`;\n  else sum.innerHTML = `\u003cspan class=\"kick\">Send will ship\u003c/span>\u003col>${[...st.staged].map(([id, a]) => mark(byId[id], a)).join('')}\u003
