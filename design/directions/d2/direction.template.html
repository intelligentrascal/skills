<style>
:root{
  --paper:#EEEDE7; --paper-2:#E6E4DD; --sheet:#F5F4EF;
  --ink:#161513; --ink-2:#514E48; --ink-3:#66625A;
  --rule:#CFCDC5; --edge:#86837A;
  --red:#BA2A12; --red-soft:#F3DDD7;
  --display:'NR Display', Charter, Georgia, serif;
  --quote:'NR Quote', Charter, Georgia, serif;
  --text:'NR Text', Charter, Georgia, serif;
  --mono:'Plex Mono', ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.2,0,0,1);
  --t-fast:120ms; --t-mid:220ms; --t-slow:280ms;
  --mast:52px; --send:68px;
  --gutter:56px; --rail:224px; --margin:352px; --gap:56px;
  --h1:58px; --qs:28px; --body:19px; --opt:17px;
}
@media (max-width:1300px){ :root{ --gutter:40px; --rail:196px; --margin:312px; --gap:40px; --h1:50px; --qs:26px; --body:18px; --opt:16px; } }
@media (min-width:1800px){ .strip{height:92px} .q{padding-top:34px} .q h1{margin-top:18px} .q .body{margin-top:22px} .choices{margin-top:40px;column-gap:64px} .acts{margin-top:32px} .marg{padding-top:34px}
 :root{ --gutter:120px; --rail:260px; --margin:440px; --gap:80px; --h1:84px; --qs:36px; --body:23px; --opt:20px; } }

*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--text);overflow:hidden;height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}
button:active:not([aria-disabled="true"]){transform:scale(.96)}
button{transition:transform var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty;margin:0}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.kick{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kick.red,.red{color:var(--red)}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- masthead ---------- */
.mast{height:var(--mast);display:flex;align-items:center;gap:28px;padding:0 var(--gutter);border-bottom:1px solid var(--ink)}
.mast .topic{font:400 22px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.mast .doc{font:400 13px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
.mast .issue{font:400 13px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
.mast .status{margin-left:auto;font:400 13px/1 var(--mono);white-space:nowrap;display:flex;align-items:center;gap:10px}
.mast .status .lamp{width:8px;height:8px;background:var(--ink);transition:background-color var(--t-mid)}
.mast .status.working .lamp{background:var(--red);animation:pulse 1.2s infinite}
.mast .status.queue .lamp{background:transparent;outline:1px solid var(--edge)}
@keyframes pulse{50%{opacity:.35}}
.mast nav{display:flex;gap:4px}
.mast nav button{font:400 13px/1 var(--mono);padding:14px 10px;color:var(--ink-2)}
.mast nav button:hover{color:var(--ink);background:var(--paper-2)}
.mast nav button kbd,.rail kbd,.acts kbd,.sheet kbd,.opt kbd,.verdict kbd,.stale kbd{font:500 11px/1 var(--mono);color:var(--ink);border:1px solid var(--edge);padding:3px 5px 2px;min-width:20px;text-align:center;display:inline-block;margin-left:8px;vertical-align:1px;text-transform:none;letter-spacing:0}

/* ---------- stage grid ---------- */
.stage{position:relative;height:calc(100vh - var(--mast) - var(--send));display:grid;grid-template-columns:minmax(0,1fr) var(--margin);grid-template-rows:auto minmax(0,1fr);column-gap:var(--gap);padding:0 var(--gutter);max-width:1760px;margin:0 auto}

/* filmstrip: the round as a strip of frames */
.strip{grid-column:1/-1;position:relative;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--ink);height:78px;overflow:hidden}
.strip .counts{flex:0 0 auto;align-self:center;font:400 13px/1.5 var(--mono);color:var(--ink-2);padding-right:28px;margin-right:6px;border-right:1px solid var(--rule);white-space:nowrap}
.strip .counts b{font-weight:500;color:var(--ink)}
.strip .counts .staged{color:var(--red)}
.strip ol{list-style:none;margin:0;padding:0;display:flex;align-items:stretch;flex:1;min-width:0;position:relative}
.strip .ind{position:absolute;left:0;top:0;height:3px;width:80px;background:var(--red);transition:transform var(--t-mid) var(--ease),width var(--t-mid) var(--ease);pointer-events:none}
.strip li{display:flex;min-width:0}
.strip li.frame{flex:1 1 0}
.strip li.frame button{display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;min-width:0;text-align:left;padding:8px 12px 8px 12px;border-left:1px solid var(--rule)}
.strip li.frame button:hover{background:var(--paper-2)}
.strip .n{font:400 12px/1.2 var(--mono);color:var(--ink-3)}
.strip .s{font:500 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .t{font:400 14px/1.3 var(--text);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--t-fast)}
.strip li.cur .t{color:var(--ink);font-weight:500}
.strip li.cur .n{color:var(--ink)}
.strip li.staged .s,.strip li.reopened .s,.strip li.updated .s{color:var(--red)}
.strip li.decided .s{color:var(--ink)}
.strip li.staged .t{color:var(--ink)}
.strip li.deferred .t,.strip li.decided .t{color:var(--ink-3)}
.strip li.sub{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 0;align-items:center;justify-content:center;border-right:1px solid var(--rule);margin-left:8px}
.strip li.fromrecord{flex:0 0 auto}
.strip li.fromrecord button{border-left:1px solid var(--rule);border-right:3px double var(--ink);padding-right:18px}
.strip li.fromrecord .s{color:var(--ink)}
.strip li.fromrecord.cur .t{max-width:20ch}

/* article */
.stagemain{position:relative;min-width:0;height:100%;overflow:hidden}
.q{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 8px 40px 0;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.q:focus-visible{outline:none}
.q.enter-down{animation:enterDown var(--t-slow) var(--ease) both}
.q.enter-up{animation:enterUp var(--t-slow) var(--ease) both}
.q.leave-down{animation:leaveUp var(--t-fast) var(--ease) both;pointer-events:none}
.q.leave-up{animation:leaveDown var(--t-fast) var(--ease) both;pointer-events:none}
@keyframes enterDown{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes enterUp{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes leaveUp{to{opacity:0;transform:translateY(-14px)}}
@keyframes leaveDown{to{opacity:0;transform:translateY(14px)}}

.q .kicker{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;min-height:20px}
.q .kicker button{font:inherit;color:var(--ink-3);box-shadow:inset 0 -1px 0 var(--rule);letter-spacing:inherit;text-transform:inherit;padding:10px 0}
.q .kicker button:hover{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.q .band{margin:14px 0 0;padding:10px 14px;border-left:3px solid var(--red);background:var(--red-soft);font:400 15px/1.45 var(--text);color:var(--ink)}
.q .band.ink{border-color:var(--ink);background:var(--paper-2)}
.q .band .kick{display:block;margin-bottom:2px}
.q h1{font:400 var(--h1)/1.02 var(--display);letter-spacing:-.018em;margin:12px 0 0;max-width:24ch;display:flex;gap:.45em;align-items:baseline}
.q h1 .qn{font:400 .34em/1 var(--mono);letter-spacing:.04em;color:var(--ink-3);flex:0 0 auto;position:relative;top:-.9em}
.q .body{font:400 var(--body)/1.42 var(--text);color:var(--ink-2);margin:14px 0 0;max-width:64ch}

/* choices: the recommendation is the first choice, the rest sit beside it */
.choices{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);column-gap:44px;margin:26px 0 0;align-items:start}
.verdict{padding:0 0 0 22px;border-left:1px solid var(--ink);position:relative;cursor:pointer}
.verdict:hover blockquote{color:var(--red)}
.verdict .kick{display:flex;gap:14px;align-items:baseline}
.verdict .kick kbd{margin-left:auto}
.verdict .kick kbd + kbd{margin-left:4px}
.verdict blockquote{margin:8px 0 0;font:400 var(--qs)/1.18 var(--quote);letter-spacing:-.005em;color:var(--ink);transition:color var(--t-fast)}
.verdict blockquote .k{font:400 .5em/1 var(--mono);color:var(--ink-3);vertical-align:.45em;margin-right:.5em;font-style:normal}
.verdict .why{margin:12px 0 0;font:400 calc(var(--opt) - 1px)/1.42 var(--text);color:var(--ink-2)}
.verdict .why .lbl{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:8px}
.verdict .why .cost{display:block;margin-top:3px}
.verdict .why .cost .lbl{color:var(--red)}
.verdict .accept{margin:14px 0 0;font:400 15px/1 var(--mono);padding:11px 14px;background:var(--ink);color:var(--paper)}
.verdict .accept:hover{background:#2a2825}
.verdict .accept kbd{color:var(--paper);border-color:#6f6c66}
.verdict .accept.on{background:var(--red)}
.verdict .accept.on kbd{border-color:#e0968a}
.verdict .tagline{margin:10px 0 0;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.verdict .tagline.red{color:var(--red)}

/* voice: my reply */
.voice{margin:22px 0 6px;padding-left:22px;border-left:3px solid var(--red);max-width:70ch}
.voice .kick{display:flex;justify-content:space-between;gap:12px}
.voice label{display:block}
.voice textarea{display:block;width:100%;margin-top:8px;font:400 24px/1.3 var(--text);color:var(--ink);background:transparent;border:0;resize:none;padding:0;min-height:96px;outline:none}
.voice textarea::placeholder{color:var(--ink-3)}
.voice .hint{margin-top:8px;font:400 12px/1.5 var(--mono);color:var(--ink-3)}
.voice .hint b{font-weight:500;color:var(--ink)}
.voice .staged-note{margin-top:8px;font:italic 400 17px/1.4 var(--text);color:var(--red)}

/* options */
.opts{list-style:none;margin:0;padding:0}
.opts .kick{padding-bottom:8px;border-bottom:1px solid var(--ink)}
.opt{display:grid;grid-template-columns:36px 24px 1fr;column-gap:12px;align-items:baseline;width:100%;text-align:left;padding:12px 8px 12px 0;border-bottom:1px solid var(--rule);position:relative}
.opt kbd{margin:0;width:28px;font-size:13px;padding:5px 0 4px;text-align:center;justify-self:start}
.opt .l{font:400 13px/1 var(--mono);color:var(--ink-3)}
.opt .txt{font:400 var(--opt)/1.32 var(--text);color:var(--ink)}
.opt .tag{grid-column:3;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.opt:hover{background:var(--paper-2)}
.opt.picked{background:var(--red-soft)}
.opt.picked::before{content:"";position:absolute;left:-12px;top:-1px;bottom:-1px;width:3px;background:var(--red)}
.opt.picked .tag{color:var(--red)}
.opt.decided::before{content:"";position:absolute;left:-12px;top:-1px;bottom:-1px;width:3px;background:var(--ink)}
.opt.decided .tag{color:var(--ink)}
.opt.faded .txt{color:var(--ink-3)}
.opt .tag.red{color:var(--red)}

/* actions row */
.acts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:22px 0 0;font:400 13px/1 var(--mono);color:var(--ink-2)}
.acts .object{color:var(--ink);border-bottom:1px solid var(--ink)}
.acts .object.on{color:var(--red);border-color:var(--red)}
.acts button{padding:12px 0;color:var(--ink-2);font:inherit}
.acts button:hover{color:var(--ink)}
.acts button kbd{margin-left:6px}
.acts button.on{color:var(--red)}
.acts button.on kbd{color:var(--red);border-color:var(--red)}

/* margin */
.marg{min-width:0;padding-top:22px;height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;padding-right:2px}
.marg section{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.marg section:last-child{border:0}
.marg .kick{margin-bottom:10px}
.marg .stmt{font:400 17px/1.35 var(--text)}
.marg .stmt.red{font-style:italic}
.marg .small{font:400 13px/1.45 var(--text);color:var(--ink-2)}
.marg .stagedlist{list-style:none;margin:0;padding:0}
.marg .stagedlist li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--rule)}
.marg .stagedlist li:last-child{border:0}
.marg .stagedlist .qn{font:400 12px/1.5 var(--mono);color:var(--ink-3);flex:0 0 32px}
.marg .stagedlist .st{font:italic 400 15px/1.35 var(--text);color:var(--red);flex:1}
.marg .stagedlist button{font:400 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:11px 0}
.marg .stagedlist button:hover{color:var(--ink)}
.marg .deps{display:flex;flex-direction:column;gap:6px}
.marg .deps button{text-align:left;font:400 15px/1.35 var(--text);color:var(--ink);display:grid;grid-template-columns:36px 1fr;column-gap:8px;align-items:baseline;padding:6px 0}
.marg .deps button:hover .t{border-color:var(--ink)}
.marg .deps .qn{font:400 12px/1.5 var(--mono);color:var(--ink-3)}
.marg .deps .t{border-bottom:1px solid var(--rule)}
.marg .deps .a{display:block;font:400 13px/1.4 var(--text);color:var(--ink-2)}
.marg .deps .a.red{color:var(--red)}
.thread{list-style:none;margin:0;padding:0}
.thread li{padding:8px 0 10px;border-bottom:1px solid var(--rule)}
.thread li:last-child{border:0}
.thread .who{display:flex;justify-content:space-between;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.thread .who.me{color:var(--ink)}
.thread .who .red{color:var(--red)}
.thread p{margin-top:3px;font:400 15px/1.4 var(--text)}
.thread li.staged p{font-style:italic;color:var(--red)}
.thread .empty{font:italic 400 15px/1.4 var(--text);color:var(--ink-3)}

/* plate slot in margin */
.plateslot{position:relative;width:100%;aspect-ratio:1000/420;background:var(--sheet);outline:1px solid var(--rule);cursor:pointer}
.plateslot .cap{position:absolute;left:0;right:0;bottom:-24px;font:400 12px/1.5 var(--mono);color:var(--ink-3);display:flex;justify-content:space-between}
.plateslot .cap .red{color:var(--red)}
.plateslot .cover{position:absolute;inset:0}
.plateslot:hover .cover{outline:2px solid var(--ink);outline-offset:-2px}
.marg .platesec{padding-bottom:40px}
.marg .platesec .small{margin-top:30px}
.marg .platesec .figs{margin-top:2px;display:flex;flex-wrap:wrap;gap:0 10px}
.marg .platesec .figs button{font:400 12px/1.5 var(--mono);color:var(--ink-2);padding:7px 0;box-shadow:inset 0 -1px 0 var(--rule)}
.marg .platesec .figs button:hover,.marg .platesec .figs button.on{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}

/* ---------- send bar ---------- */
.sendbar{position:fixed;left:0;right:0;bottom:0;height:var(--send);border-top:1px solid var(--ink);background:var(--paper);display:flex;align-items:stretch;z-index:30}
.sendbar .sum{flex:1;min-width:0;display:flex;align-items:center;gap:22px;padding:0 var(--gutter);overflow:hidden}
.sendbar .sum .kick{flex:0 0 auto}
.sendbar .sum ol{list-style:none;margin:0;padding:0;display:flex;gap:26px;overflow:hidden;white-space:nowrap}
.sendbar .sum li{font:italic 400 15px/1.3 var(--text);color:var(--red);display:flex;align-items:baseline;gap:6px;max-width:34ch;overflow:hidden}
.sendbar .sum li .qn{font:400 12px/1 var(--mono);font-style:normal;color:var(--ink-3);margin-right:2px}
.sendbar .sum li s{font-style:normal;color:var(--ink-3);text-decoration-color:var(--red);text-decoration-thickness:1px}
.sendbar .sum li .caret{font:500 15px/1 var(--mono);font-style:normal;color:var(--red);position:relative;top:3px}
.sendbar .sum li .ins{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sendbar .sum .none{font:italic 400 15px/1.3 var(--text);color:var(--ink-3)}
.sendbar .finish{font:400 14px/1 var(--mono);padding:0 26px;border-left:1px solid var(--rule);color:var(--ink-2)}
.sendbar .finish:hover{color:var(--ink);background:var(--paper-2)}
.sendbar .send{font:400 15px/1 var(--mono);padding:0 var(--gutter) 0 34px;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:18px;min-width:280px;justify-content:space-between}
.sendbar .send:hover:not([aria-disabled="true"]){background:#2a2825}
.sendbar .send[aria-disabled="true"]{background:var(--paper-2);color:var(--ink-3);cursor:default}
.sendbar .send kbd{font:500 12px/1 var(--mono);border:1px solid #6f6c66;padding:4px 6px 3px;color:var(--paper)}
.sendbar .send[aria-disabled="true"] kbd{border-color:var(--rule);color:var(--ink-3)}
.sendbar .send .n{font-variant-numeric:tabular-nums}

/* ---------- overlays: record, plate ---------- */
.sheet{position:fixed;left:0;right:0;top:var(--mast);bottom:var(--send);background:var(--paper);z-index:20;transform:translateY(24px);opacity:0;visibility:hidden;transition:transform var(--t-slow) var(--ease),opacity var(--t-mid) var(--ease),visibility 0s linear var(--t-slow)}
.sheet.open{transform:none;opacity:1;visibility:visible;transition:transform var(--t-slow) var(--ease),opacity var(--t-mid) var(--ease)}
.sheet .inner{height:100%;overflow-y:auto;padding:28px var(--gutter) 60px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;max-width:1760px;margin:0 auto}

/* record */
.rec-head{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);column-gap:var(--gap);align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}
.rec-head h2{font:400 44px/1 var(--display);letter-spacing:-.02em}
.rec-head .stats{display:flex;gap:28px;flex-wrap:wrap;font:400 13px/1.5 var(--mono);color:var(--ink-2)}
.rec-head .stats b{display:block;font:400 30px/1 var(--display);color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rec-head .stats .red b{color:var(--red)}
.rec-search{grid-column:1/-1;margin-top:18px;display:flex;align-items:baseline;gap:14px}
.rec-search input{flex:1;font:400 22px/1.3 var(--text);background:transparent;border:0;border-bottom:1px solid var(--edge);padding:6px 0;color:var(--ink);outline:none}
.rec-search input:focus{border-color:var(--ink)}
.rec-search input::placeholder{color:var(--ink-3)}
.rec-search .kick{white-space:nowrap}
.rec-body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);column-gap:var(--gap)}
.rec-toc{position:sticky;top:0;align-self:start;padding-top:24px}
.rec-toc a{display:block;font:400 13px/1.9 var(--mono);color:var(--ink-3);text-decoration:none}
.rec-toc a:hover{color:var(--ink)}
.rec-toc a b{font-weight:400;color:var(--ink)}
.rec-list{padding-top:8px}
.rec-round{padding-top:26px}
.rec-round h3{font:400 13px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:8px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.entry{display:grid;grid-template-columns:56px minmax(0,1fr) 150px;column-gap:18px;padding:16px 0;border-bottom:1px solid var(--rule);cursor:pointer;position:relative}
.entry:hover{background:var(--paper-2)}
.entry.focus::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:3px;background:var(--red)}
.entry .qn{font:400 13px/1.6 var(--mono);color:var(--ink-3)}
.entry .title{font:600 17px/1.35 var(--text);color:var(--ink)}
.entry .stmt{font:400 19px/1.35 var(--text);color:var(--ink);margin-top:2px;max-width:70ch}
.entry .stmt b{font-weight:500}
.entry .note{font:400 14px/1.45 var(--text);color:var(--ink-2);margin-top:6px;max-width:70ch}
.entry .note .who{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.entry .tags{text-align:right;font:500 11px/1.9 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.entry .tags .lock{color:var(--ink)}
.entry .tags .red{color:var(--red)}
.entry.reopened .stmt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1px}
.entry.reopened .note.re{color:var(--red);font-style:italic}
.entry.open .stmt{color:var(--ink-3);font-style:italic}
.entry.staged .stmt{color:var(--red);font-style:italic}
.entry.deferred .stmt{color:var(--ink-3);font-style:italic}
.entry.hide{display:none}
.rec-empty{padding:40px 0;font:italic 400 19px/1.4 var(--text);color:var(--ink-3)}

/* plate (full-bleed visual) */
.plate .inner{display:grid;grid-template-columns:minmax(0,1fr) var(--margin);column-gap:var(--gap);padding-top:28px;height:100%;overflow:hidden}
.plate .plateframe{position:relative;height:100%;display:flex;flex-direction:column}
.plate .stale{display:flex;align-items:center;gap:18px;padding:12px 16px;border-left:3px solid var(--red);background:var(--red-soft);font:400 15px/1.4 var(--text);margin-bottom:18px}
.plate .stale.fresh{border-color:var(--ink);background:var(--paper-2)}
.plate .stale .kick{flex:0 0 auto}
.plate .stale .redraw{margin-left:auto;font:400 14px/1 var(--mono);padding:10px 14px;background:var(--ink);color:var(--paper);white-space:nowrap}
.plate .stale .redraw kbd{color:var(--paper);border-color:#6f6c66}
.plate .stale .redraw[aria-disabled="true"]{background:var(--paper-2);color:var(--ink-3);cursor:default}
.plate .anchor{flex:1;position:relative;min-height:0}
.plate .caption{padding-top:2px;overflow-y:auto}
.plate .caption h2{font:400 44px/1 var(--display);letter-spacing:-.02em}
.plate .caption .meta{margin-top:10px;font:400 13px/1.5 var(--mono);color:var(--ink-2)}
.plate .caption .meta .red{color:var(--red)}
.figs-list{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--ink)}
.figs-list button{display:grid;grid-template-columns:44px 1fr;column-gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.figs-list button:hover,.figs-list button.on{background:var(--paper-2)}
.figs-list .fig{font:400 13px/1.5 var(--mono);color:var(--ink-3)}
.figs-list .t{font:400 17px/1.3 var(--text)}
.figs-list .a{display:block;font:400 13px/1.4 var(--text);color:var(--ink-2);margin-top:2px}
.figs-list .a.red{color:var(--red)}
.figs-list button.on .fig{color:var(--ink)}
.plate .vthread{margin-top:24px}
.plate .vthread .kick{margin-bottom:8px}

/* the one iframe, moved by transform between the margin slot and the plate */
#plateWrap{position:fixed;left:0;top:0;width:1000px;height:420px;transform-origin:0 0;z-index:25;background:#f7f4ee;outline:1px solid oklch(0 0 0 / .12);transition:transform var(--t-slow) var(--ease),opacity var(--t-mid) var(--ease);will-change:transform}
#plateWrap iframe{width:1000px;height:420px;border:0;display:block;background:#f7f4ee}
#plateWrap.mini iframe{pointer-events:none}
#plateWrap.hiddenp{opacity:0;pointer-events:none}
#pins{position:fixed;left:0;top:0;z-index:26;pointer-events:none}
#pins .pin{position:absolute;transform:translate(0,0);font:500 11px/1 var(--mono);letter-spacing:.04em;background:var(--ink);color:var(--paper);padding:4px 6px 3px;white-space:nowrap;opacity:0;transition:opacity var(--t-fast) var(--ease)}
#pins .pin.red{background:var(--red)}
#pins .pin.show{opacity:1}
#pins .pin.dim{opacity:.55}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);max-width:640px;width:min(92vw,640px);box-shadow:0 1px 0 oklch(0 0 0/.06),0 24px 60px -20px oklch(0 0 0/.35);outline:1px solid var(--ink)}
dialog::backdrop{background:oklch(0.12 0.005 80 / .28)}
dialog .dhead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 28px 14px;border-bottom:1px solid var(--ink)}
dialog h2{font:400 32px/1 var(--display);letter-spacing:-.02em}
dialog .dhead button{font:400 13px/1 var(--mono);color:var(--ink-2);padding:12px 0}
dialog .dbody{padding:18px 28px 28px;max-height:70vh;overflow:auto}
dialog .dfoot{display:flex;justify-content:flex-end;gap:10px;padding:0 28px 24px}
dialog .dfoot button{font:400 14px/1 var(--mono);padding:12px 18px;border:1px solid var(--edge)}
dialog .dfoot button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
dialog .dfoot button.primary:hover{background:#2a2825}
.terms dt{font:600 19px/1.3 var(--text);margin-top:16px}
.terms dt:first-child{margin-top:0}
.terms dd{margin:2px 0 0;font:400 16px/1.45 var(--text);color:var(--ink-2)}
.terms dd .avoid{display:block;margin-top:4px;font:400 12px/1.5 var(--mono);color:var(--red)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.keys dl{margin:0}
.keys div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--rule)}
.keys dt{font:400 15px/1.3 var(--text);color:var(--ink-2)}
.keys dd{margin:0;font:400 12px/1 var(--mono)}
.keys dd kbd{font:500 12px/1 var(--mono);border:1px solid var(--edge);padding:4px 6px 3px;margin-left:4px;display:inline-block}
.keys h3{grid-column:1/-1;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 4px}
.keys h3:first-child{margin-top:0}
dialog p.lead{font:400 19px/1.4 var(--text);color:var(--ink)}
dialog p.sub{margin-top:10px;font:400 15px/1.45 var(--text);color:var(--ink-2)}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(var(--send) + 18px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);font:400 15px/1.3 var(--text);padding:12px 18px;display:flex;align-items:center;gap:18px;box-shadow:0 12px 30px -12px oklch(0 0 0/.5);animation:toastIn var(--t-mid) var(--ease) both}
.toast.out{animation:toastOut 160ms var(--ease) both}
.toast button{font:400 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);border:1px solid #6f6c66;padding:10px 12px}
.toast button:hover{background:#2a2825}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .mast .status.working .lamp{animation:none}
}
</style>
</head>
<body>
<header class="mast">
  <div class="topic" id="topic"></div>
  <div class="doc mono" id="docpath"></div>
  <div class="issue mono" id="issue"></div>
  <div class="status mono" id="status"><span class="lamp" aria-hidden="true"></span><span id="statusText">Waiting for you</span></div>
  <nav aria-label="Views">
    <button data-act="terms">Terms<kbd>t</kbd></button>
    <button data-act="record">The record<kbd>l</kbd></button>
    <button data-act="plate">Plate<kbd>v</kbd></button>
    <button data-act="keys" aria-label="Keyboard shortcuts">Keys<kbd>?</kbd></button>
  </nav>
</header>

<main class="stage" id="stage">
  <nav class="strip" id="strip" aria-label="This round"></nav>
  <div class="stagemain" id="stagemain"></div>
  <aside class="marg" id="marg" aria-label="Margin"></aside>
</main>

<footer class="sendbar">
  <div class="sum" id="sendsum"></div>
  <button class="finish" data-act="finish">Finish, write <span class="mono" id="finishdoc"></span></button>
  <button class="send" id="sendbtn" data-act="send" aria-disabled="true"><span id="sendlabel">Nothing staged</span><kbd>⌘↵</kbd></button>
</footer>

<section class="sheet record" id="record" aria-label="The record" hidden>
  <div class="inner" id="recordInner"></div>
</section>

<section class="sheet plate" id="plate" aria-label="Plate" hidden>
  <div class="inner">
    <div class="plateframe">
      <div class="stale" id="staleBar"></div>
      <div class="anchor" id="plateAnchor"></div>
    </div>
    <div class="caption" id="plateCaption"></div>
  </div>
</section>

<div id="plateWrap" class="mini"><iframe id="frame" sandbox="allow-scripts" title="Visual prototype"></iframe></div>
<div id="pins"></div>

<dialog id="dlgTerms" class="terms"></dialog>
<dialog id="dlgKeys"></dialog>
<dialog id="dlgFinish"></dialog>
<div id="toasts" aria-live="polite"></div>

<script>/*__DATA__*/</script>
<script>
(() => {
'use strict';
const S = SESSION;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = Object.fromEntries(S.questions.map(q => [q.id, q]));
const qnum = id => id.replace(/^q/, 'Q');
const optText = (q, k) => (q.options.find(o => o.k === k) || {}).text || '';
const firstSentence = t => { const m = t.match(/^(.+?[.!?])(\s|$)/); return m ? [m[1], t.slice(m[1].length).trim()] : [t, '']; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtTime = iso => { const d = new Date(iso); return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0'); };
const fmtDate = iso => { const d = new Date(iso); return d.getUTCDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]; };
const currentRound = Math.max(...S.questions.map(q => q.round));
const KEYS = { '1':'A','2':'B','3':'C','4':'D' };

// ------- state -------
const st = {
  cur: null,
  staged: new Map(),      // qid -> {kind, option?, text?}
  view: 'stage',          // stage | record | plate
  status: S.agent.status === 'waiting' ? 'waiting' : S.agent.status,
  visual: { version: S.visual.version, stale: S.visual.stale, note: S.visual.note, at: S.visual.at, thread: [...S.visual.thread] },
  regions: [],
  replyOpen: false,
  hoverQ: null,
  recFocus: 0,
  sentExplore: null,
  guardUntil: 0,
};
const reverseDeps = {}; S.questions.forEach(q => q.deps.forEach(d => (reverseDeps[d] ||= []).push(q.id)));

// ------- derived -------
function frontier() {
  const open = S.questions.filter(q => q.status === 'open').sort((a,b) => a.round - b.round || +a.id.slice(1) - +b.id.slice(1));
  const re = S.questions.filter(q => q.status === 'reopened');
  const def = S.questions.filter(q => q.status === 'deferred' && q.round === currentRound);
  return { open, re, def, all: [...open, ...re, ...def] };
}
function counts() {
  const f = frontier();
  const need = [...f.open, ...f.re];
  const stagedInFrontier = need.filter(q => st.staged.has(q.id)).length;
  return { open: need.length - stagedInFrontier, staged: st.staged.size, total: need.length, reopened: f.re.length, deferred: f.def.length };
}
function stateOf(q) {
  if (st.staged.has(q.id)) return 'staged';
  if (q.status === 'answered') return 'decided';
  return q.status; // open | deferred | reopened
}
function stagedStatement(q, a) {
  if (!a) return '';
  switch (a.kind) {
    case 'accept': return `Accept ${a.option}: ${firstSentence(optText(q, a.option))[0]}`;
    case 'option': return `${a.option}: ${firstSentence(optText(q, a.option))[0]}`;
    case 'text': return `“${a.text}”`;
    case 'defer': return 'Defer';
    case 'reopen': return a.text ? `Reopen: “${a.text}”` : 'Reopen';
  }
  return '';
}
function decidedStatement(q) {
  const a = q.answer; if (!a) return '';
  if (a.kind === 'text') return `“${a.text}”`;
  return optText(q, a.option);
}
function decidedNote(q) {
  const a = q.answer; if (!a) return '';
  if (a.kind === 'accept') return 'Accepted the recommendation' + (a.text ? `: “${a.text}”` : '');
  if (a.kind === 'option') return a.option === q.rec.option ? `Chose ${a.option}, the recommendation` : `Chose ${a.option} over the recommended ${q.rec.option}`;
  if (a.kind === 'text') return `In your own words, instead of the recommended ${q.rec.option}`;
  return '';
}
function whyParts(why) {
  const parts = why.split(/(?<=[.!?])\s+/);
  const cost = parts.filter(p => /\bcost/i.test(p));
  const rest = parts.filter(p => !/\bcost/i.test(p));
  return { why: rest.join(' ') || why, cost: cost.join(' ') };
}
const regionQs = () => { const ids = []; VISUAL_HTML.replace(/data-q="(q\d+)"/g, (_, id) => { if (!ids.includes(id)) ids.push(id); }); return ids; };

// ------- masthead -------
$('#topic').textContent = S.topic;
$('#docpath').textContent = '→ ' + S.doc;
$('#finishdoc').textContent = S.doc;
function renderMast() {
  const c = counts();
  $('#issue').textContent = `Round ${currentRound}, ${c.total} to answer`;
  const el = $('#status'); el.className = 'status mono ' + st.status;
  $('#statusText').textContent = st.status === 'working' ? 'Agent working…' : st.status === 'queue' ? 'No agent listening: requests queue' : 'Agent waiting for you';
}

// ------- filmstrip -------
function renderStrip() {
  const f = frontier(); const c = counts();
  const inFrontier = f.all.some(q => q.id === st.cur);
  const item = (q, extraCls = '') => {
    const s = stateOf(q);
    const label = { staged: 'staged', decided: 'decided', open: 'open', deferred: 'deferred', reopened: 'reopened' }[s];
    const extra = q.updated && s !== 'staged' ? ', new rec' : '';
    return `<li class="frame ${s}${q.updated ? ' updated' : ''}${q.id === st.cur ? ' cur' : ''} ${extraCls}" data-q="${q.id}"><button data-go="${q.id}" aria-current="${q.id === st.cur ? 'true' : 'false'}" title="${esc(q.title)}"><span class="n num">${qnum(q.id)}</span><span class="t">${esc(q.title)}</span><span class="s">${label}${extra}</span></button></li>`;
  };
  let html = `<div class="counts num"><b>${c.open}</b> open<br><span class="staged"><b>${c.staged}</b> staged</span> <b>${c.reopened}</b> reopened</div><ol>`;
  html += `<span class="ind" id="stripInd" aria-hidden="true"></span>`;
  if (!inFrontier && st.cur) html += item(byId[st.cur], 'fromrecord');
  html += f.open.map(q => item(q)).join('');
  if (f.re.length) html += `<li class="sub" aria-hidden="true">Reopened</li>` + f.re.map(q => item(q)).join('');
  if (f.def.length) html += `<li class="sub" aria-hidden="true">Deferred</li>` + f.def.map(q => item(q)).join('');
  html += '</ol>';
  $('#strip').innerHTML = html;
  requestAnimationFrame(placeInd);
}
function placeInd() {
  const ind = $('#stripInd'); const li = $('#strip li.cur');
  if (!ind) return;
  if (!li) { ind.style.opacity = '0'; return; }
  ind.style.opacity = '1';
  const ol = li.parentElement.getBoundingClientRect(); const r = li.getBoundingClientRect();
  ind.style.transform = `translateX(${r.left - ol.left}px)`; ind.style.width = r.width + 'px';
}

// ------- article -------
function renderArticle(q, dir) {
  const a = st.staged.get(q.id);
  const s = stateOf(q);
  const deps = q.deps.map(d => byId[d]).filter(Boolean);
  const feeds = (reverseDeps[q.id] || []).map(d => byId[d]);
  let kicker = `<span class="kick">Round ${q.round}</span>`;
  if (deps.length) kicker += `<span class="kick">Hangs off ${deps.map(d => `<button data-record="${d.id}">${qnum(d.id)} ${esc(d.title)}</button>`).join(', ')}</span>`;
  if (feeds.length) kicker += `<span class="kick">Feeds ${feeds.map(d => `<button data-go="${d.id}">${qnum(d.id)}</button>`).join(', ')}</span>`;
  if (q.durable) kicker += `<span class="kick">Locked once decided</span>`;

  let band = '';
  const reopenNote = q.thread.filter(t => /^Reopened/i.test(t.text)).slice(-1)[0];
  if (q.status === 'reopened') band = `<div class="band"><span class="kick red">Reopened${reopenNote ? ` by the ${reopenNote.who} at ${fmtTime(reopenNote.at)}` : ''}. Not settled.</span>Was ${q.answer ? (q.answer.kind === 'text' ? `“${esc(q.answer.text)}”` : `${q.answer.option}: ${esc(firstSentence(optText(q, q.answer.option))[0])}`) : ''} ${reopenNote ? '<br>' + esc(reopenNote.text.replace(/^Reopened:\s*/i, '')) : ''}</div>`;
  else if (q.status === 'answered') band = `<div class="band ink"><span class="kick">Decided in round ${q.round}${q.durable ? ', locked' : ''}</span>${esc(decidedStatement(q))}<br><span class="small" style="color:var(--ink-2)">${esc(decidedNote(q))}. Press <b>o</b> to reopen it.</span></div>`;
  else if (q.status === 'deferred') band = `<div class="band ink"><span class="kick">Deferred</span>The agent recommended ${q.rec.option}. Answer it now with 1-4, a, or r; it comes off the deferred list when you send.</div>`;

  const wp = whyParts(q.rec.why);
  const recOpt = q.options.find(o => o.k === q.rec.option);
  const recIdx = q.options.indexOf(recOpt) + 1;
  const recPicked = a && (a.kind === 'accept' || (a.kind === 'option' && a.option === recOpt.k));
  const recDecided = q.status === 'answered' && q.answer && q.answer.option === recOpt.k;
  const recWas = q.status === 'reopened' && q.answer && q.answer.option === recOpt.k;
  const verdict = `<section class="verdict" aria-label="Recommendation" data-pick="${recOpt.k}" role="button" tabindex="0" aria-pressed="${!!recPicked}">
    <div class="kick">The agent recommends${q.updated ? '<span class="red">updated</span>' : ''}<kbd>${recIdx}</kbd><kbd>a</kbd></div>
    <blockquote><span class="k">${recOpt.k}</span>${esc(recOpt.text)}</blockquote>
    <p class="why"><span class="lbl">Why</span>${esc(wp.why)}${wp.cost ? `<span class="cost"><span class="lbl">Cost</span>${esc(wp.cost)}</span>` : ''}</p>
    ${q.status !== 'answered' ? `<button class="accept${recPicked ? ' on' : ''}" data-act="accept">${recPicked ? 'Accepted, staged' : 'Accept ' + recOpt.k}<kbd>a</kbd></button>` : ''}
    ${recDecided ? `<p class="tagline">Decided: this one</p>` : recWas ? `<p class="tagline red">Was the answer, reopened</p>` : ''}
  </section>`;

  const voice = `<section class="voice" id="voice" ${st.replyOpen || (a && a.kind === 'text') ? '' : 'hidden'}>
    <div class="kick"><label for="reply" class="red">You, in your own words</label><span>Answer, object or ask. The agent reads it either way.</span></div>
    ${a && a.kind === 'text' && !st.replyOpen ? `<p class="staged-note">“${esc(a.text)}” <span class="kick red">staged, not sent</span></p>` : `<textarea id="reply" rows="3" placeholder="${q.status === 'answered' ? 'Say what should change and why.' : 'Say what you would do instead, or what the agent is missing.'}"></textarea><p class="hint"><b>Enter</b> stages it as your answer to ${qnum(q.id)}. <b>Shift+Enter</b> for a new line. <b>Esc</b> closes.</p>`}
  </section>`;

  const others = q.options.filter(o => o.k !== q.rec.option);
  const opts = `<div><div class="kick opts-kick" style="padding-bottom:8px;border-bottom:1px solid var(--ink)">Or instead</div><ol class="opts" aria-label="Other options">${others.map(o => {
    const i = q.options.indexOf(o);
    const picked = a && a.kind === 'option' && a.option === o.k;
    const decided = q.status === 'answered' && q.answer && q.answer.option === o.k;
    const wasIt = q.status === 'reopened' && q.answer && q.answer.option === o.k;
    let tag = '';
    if (picked) tag = 'staged';
    else if (decided) tag = 'decided';
    else if (wasIt) tag = 'was the answer, reopened';
    return `<li><button class="opt${picked ? ' picked' : ''}${decided ? ' decided' : ''}${a && !picked ? ' faded' : ''}" data-pick="${o.k}" aria-pressed="${!!picked}"><kbd>${i + 1}</kbd><span class="l">${o.k}</span><span class="txt">${esc(o.text)}</span>${tag ? `<span class="tag${wasIt ? ' red' : ''}">${tag}</span>` : ''}</button></li>`;
  }).join('')}</ol></div>`;

  const acts = `<div class="acts" role="toolbar" aria-label="Actions">
    <button data-act="reply" class="object ${st.replyOpen ? 'on' : ''}">Object, or answer in your own words<kbd>r</kbd></button>
    ${q.status === 'answered' ? `<button data-act="reopen" class="${a && a.kind === 'reopen' ? 'on' : ''}">${a && a.kind === 'reopen' ? 'Reopen staged' : 'Reopen'}<kbd>o</kbd></button>` : `<button data-act="defer" class="${a && a.kind === 'defer' ? 'on' : ''}">${a && a.kind === 'defer' ? 'Deferred, staged' : 'Defer'}<kbd>d</kbd></button>`}
    <button data-act="explore">Explore deeper, sends now<kbd>e</kbd></button>
    ${a ? `<button data-act="unstage">Unstage<kbd>u</kbd></button>` : ''}
  </div>`;

  const html = `${kicker ? `<div class="kicker">${kicker}</div>` : ''}${band}
    <h1><span class="qn">${qnum(q.id)}</span>${esc(q.title)}</h1>
    <p class="body">${esc(q.body)}</p>
    ${voice}<div class="choices">${verdict}${opts}</div>${acts}`;

  const main = $('#stagemain');
  const old = main.querySelector('.q:not(.leave-down):not(.leave-up)');
  const art = document.createElement('article');
  art.className = 'q' + (dir && !reduced ? (dir > 0 ? ' enter-down' : ' enter-up') : '');
  art.setAttribute('aria-label', qnum(q.id) + ' ' + q.title);
  art.innerHTML = html;
  if (old && dir && !reduced) {
    old.className = 'q ' + (dir > 0 ? 'leave-down' : 'leave-up');
    old.addEventListener('animationend', () => old.remove(), { once: true });
    setTimeout(() => old.remove(), 300);
  } else if (old) old.remove();
  main.querySelectorAll('.q:not(.leave-down):not(.leave-up)').forEach(n => n.remove());
  main.appendChild(art);
  art.addEventListener('animationend', () => art.classList.remove('enter-down', 'enter-up'), { once: true });
}

// ------- margin -------
function renderMargin(q) {
  const a = st.staged.get(q.id);
  const s = stateOf(q);
  // state block
  let stateBlock = `<section aria-label="State"><div class="kick${s === 'staged' || s === 'reopened' ? ' red' : ''}">${{ staged: 'Staged, not sent', decided: 'Decided', open: 'Open', deferred: 'Deferred', reopened: 'Reopened, not settled' }[s]}${q.updated ? ' <span class="red">· rec updated</span>' : ''}</div>`;
  if (a) stateBlock += `<p class="stmt red">${esc(stagedStatement(q, a))}</p>`;
  else if (q.status === 'answered') stateBlock += `<p class="stmt">${esc(decidedStatement(q))}</p><p class="small">${esc(decidedNote(q))}${q.durable ? '. Locked' : ''}.</p>`;
  else if (q.status === 'reopened') stateBlock += `<p class="small">The earlier answer no longer counts. Answer it again or defer it.</p>`;
  else if (q.status === 'deferred') stateBlock += `<p class="small">Parked. Nothing is staged.</p>`;
  else stateBlock += `<p class="small">Pick 1-4, accept with a, or answer in your own words with r.</p>`;
  stateBlock += '</section>';

  // deps
  const deps = q.deps.map(d => byId[d]).filter(Boolean);
  const feeds = (reverseDeps[q.id] || []).map(d => byId[d]).filter(Boolean);
  let depBlock = '';
  if (deps.length || feeds.length) {
    depBlock = `<section aria-label="Dependencies"><div class="kick">Depends on</div><div class="deps">`;
    depBlock += deps.map(d => {
      const ds = stateOf(d); const ans = d.answer ? (d.answer.kind === 'text' ? `“${d.answer.text}”` : `${d.answer.option}: ${firstSentence(optText(d, d.answer.option))[0]}`) : '';
      return `<button data-record="${d.id}"><span class="qn">${qnum(d.id)}</span><span><span class="t">${esc(d.title)}</span><span class="a${ds === 'reopened' ? ' red' : ''}">${ds === 'reopened' ? 'Reopened, was ' : ''}${esc(ans)}${d.durable ? ' (locked)' : ''}</span></span></button>`;
    }).join('');
    if (feeds.length) depBlock += `<div class="kick" style="margin-top:12px">Feeds</div>` + feeds.map(d => `<button data-go="${d.id}"><span class="qn">${qnum(d.id)}</span><span><span class="t">${esc(d.title)}</span><span class="a">${stateOf(d)}</span></span></button>`).join('');
    depBlock += '</div></section>';
  }

  // plate
  const covered = regionQs();
  const inPlate = covered.includes(q.id);
  const plateBlock = `<section class="platesec" aria-label="Visual"><div class="kick">Plate v${st.visual.version}${st.visual.stale ? ' <span class="red">stale</span>' : ''}</div>
    <div class="plateslot" id="plateSlot" role="button" tabindex="0" aria-label="Open the plate"><div class="cover"></div><div class="cap"><span>${inPlate ? `${qnum(q.id)} is drawn here` : `${qnum(q.id)} is not drawn`}</span><span>Open<kbd style="margin-left:6px">v</kbd></span></div></div>
    <p class="small">Figures in this plate</p><div class="figs">${covered.map(id => `<button data-fig="${id}" class="${id === q.id ? 'on' : ''}">${qnum(id)} ${esc(byId[id].title)}</button>`).join('')}</div></section>`;

  // thread
  const items = q.thread.map(t => `<li><div class="who${t.who === 'user' ? ' me' : ''}"><span>${t.who === 'user' ? 'You' : 'Agent'}</span><span>${fmtTime(t.at)}</span></div><p>${esc(t.text)}</p></li>`);

}

// ------- send bar -------
function renderSend() {

    return `<li title="${esc(stagedStatement(q, a))}"><span class="qn">${qnum(q.id)}</span><s>${esc(was(q))}</s><span class="caret" aria-hidden="true">^</span><span class="ins">${esc(ins)}</span></li>`;
  };

  else sum.innerHTML = `<span class="kick">Send will ship</span><ol>${[...st.staged].map(([id, a]) => mark(byId[id], a)).join('')}</ol>`;

}

function renderAll(dir) {
  const q = byId[st.cur];
  renderMast(); renderStrip(); renderArticle(q, dir); renderMargin(q); renderSend();

  if ($('#plate').classList.contains('open')) renderPlateCaption();

}

// ------- navigation -------
function go(id, dir) {
  if (!byId[id] || id === st.cur) return;
  const f = frontier().all.map(q => q.id);
  if (dir === undefined) { const a = f.indexOf(st.cur), b = f.indexOf(id); dir = (a === -1 || b === -1) ? 1 : (b > a ? 1 : -1); }
  st.cur = id; st.replyOpen = false;
  renderAll(dir);
}
function step(delta) {
  const f = frontier().all.map(q => q.id);
  const i = f.indexOf(st.cur);
  if (i === -1) return go(f[0], 1);
  const j = Math.min(f.length - 1, Math.max(0, i + delta));
  if (j !== i) go(f[j], delta);
}
function advance() {
  const f = frontier();
  const need = [...f.open, ...f.re];
  const order = f.all.map(q => q.id);
  const i = order.indexOf(st.cur);
  const after = [...order.slice(i + 1), ...order.slice(0, i)];
  const next = after.find(id => need.some(q => q.id === id) && !st.staged.has(id));
  if (next) go(next, 1);
}

// ------- staging -------
function stage(id, action, opts = {}) {

}
function unstage(id) { if (st.staged.delete(id)) renderAll(0); }
function pick(k) { const q = byId[st.cur]; if (!q.options.some(o => o.k === k) || q.status === 'answered') return; if (k === q.rec.option) return accept(); stage(q.id, { kind: 'option', option: k }); }

function defer() { const q = byId[st.cur]; if (q.status === 'answered') return; stage(q.id, { kind: 'defer' }); }
function reopen() { const q = byId[st.cur]; if (q.status !== 'answered') return; st.replyOpen = true; renderAll(0); focusReply(); }
function openReply() { st.replyOpen = true; renderAll(0); focusReply(); }
function focusReply() { const t = $('#reply'); if (t) { st.guardUntil = performance.now() + 120; t.focus({ preventScroll: false }); t.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' }); } }

}

}
function send() {
  if (!st.staged.size || st.status === 'working') return;

  for (const [id, a] of st.staged) {
    const q = byId[id];
    if (a.kind === 'defer') { q.status = 'deferred'; q.answer = null; }
    else if (a.kind === 'reopen') { q.status = 'reopened'; q.thread.push({ who: 'user', text: 'Reopened: ' + a.text, at: new Date().toISOString() }); }
    else { q.status = 'answered'; q.answer = a.kind === 'text' ? { kind: 'text', text: a.text } : { kind: a.kind, option: a.option }; q.updated = false; if (a.kind === 'text') q.thread.push({ who: 'user', text: a.text, at: new Date().toISOString() }); }
  }

}

    <p class="sub">${loose ? `${loose} question${loose === 1 ? ' is' : 's are'} still open or reopened${st.staged.size ? `, and ${st.staged.size} staged action${st.staged.size === 1 ? '' : 's'} would not be sent` : ''}. They go under Open threads in the doc.` : 'Every question is answered or deferred.'}</p></div>
    <div class="dfoot"><button value="cancel">Keep going</button><button value="ok" class="primary">Finish, write the doc</button></div>`;
  dlg.querySelectorAll('button').forEach(b => b.onclick = () => { dlg.close(b.value); });

// ------- toast -------
function toast(text, o = {}) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(text)}</span>${o.label ? `<button>${esc(o.label)}</button>` : ''}`;

// ------- record -------

// ------- plate / visual -------
const frame = $('#frame');

addEventListener('message', e => {

  const d = $('#dlgKeys');
  const row = (k, t) => `<div><dt>${t}</dt><dd>${k.split(' ').map(x => `<kbd>${x}</kbd>`).join('')}</dd></div>`;
  d.innerHTML = `<div class="dhead"><h2>Keys</h2><button value="close">Close<kbd style="margin-left:8px;font:500 11px/1 var(--mono);border:1px solid var(--edge);padding:3px 5px 2px">esc</kbd></button></div><div class="dbody keys">
    <h3>Move</h3><dl>${row('j', 'Next question')}${row('k', 'Previous question')}${row('l', 'Flip to the record')}${row('v', 'Open the plate')}${row('t', 'Terms')}</dl>
    <dl>${row('/', 'Find in the record')}${row('esc', 'Close, cancel, come back')}${row('?', 'These keys')}${row('shift+v', 'Visualize again when stale')}</dl>
    <h3>Answer</h3><dl>${row('1 2 3 4', 'Pick an option, stages it')}${row('a', 'Accept the recommendation')}${row('r', 'In your own words: answer, object or ask')}</dl>
    <dl>${row('d', 'Defer')}${row('o', 'Reopen a decided question')}${row('e', 'Explore deeper, sends at once')}${row('u', 'Unstage')}</dl>
    <h3>Ship</h3><dl>${row('⌘↵', 'Send everything staged as one turn')}</dl><dl>${row('enter', 'In your reply: stage it')}</dl></div>`;
  d.querySelector('button').onclick = () => d.close();
  d.showModal();
}

// ------- events -------
document.addEventListener('click', e => {
  const b = e.target.closest('button, [role="button"]'); if (!b) return;
  if (b.classList.contains('verdict') && e.target.closest('button')) return; // inner Accept button handles it
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.record) return openRecord(b.dataset.record);
  if (b.dataset.pick) return pick(b.dataset.pick);
  if (b.dataset.fig) { st.hoverQ = null; if (st.view === 'plate') { closeSheets(); } return go(b.dataset.fig); }
  if (b.id === 'plateSlot') return openPlate();
  switch (b.dataset.act) {
    case 'accept': return accept();
    case 'reply': return st.replyOpen ? closeReply() : openReply();
    case 'defer': return defer();
    case 'reopen': return reopen();
    case 'explore': return explore();
    case 'unstage': return unstage(st.cur);
    case 'send': return send();
    case 'finish': return finish();
    case 'terms': return openTerms();
    case 'keys': return openKeys();
    case 'record': return st.view === 'record' ? closeSheets() : openRecord();
    case 'plate': return st.view === 'plate' ? closeSheets() : openPlate();
    case 'redraw': return redraw();
  }
});
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-go],[data-fig],.entry,[data-record]');
  const id = el ? (el.dataset.go || el.dataset.fig || el.dataset.q || el.dataset.record) : null;
  if (id !== st.hoverQ) { st.hoverQ = id; postHighlight(); }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  const cmdEnter = (e.metaKey || e.ctrlKey) && e.key === 'Enter';
  if (cmdEnter) { e.preventDefault(); return send(); }
  if (e.key === 'Escape') {
    if (document.querySelector('dialog[open]')) return; // dialog handles itself
    e.preventDefault();
    if (inField && e.target.id === 'reply') return closeReply();
    if (st.view !== 'stage') return closeSheets();
    if (st.replyOpen) return closeReply();
    return;
  }
  if (e.target.classList && e.target.classList.contains('verdict') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return accept(); }
  if (inField) {
    if (e.target.id === 'reply' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); commitReply(); }
    return;
  }
  if (e.isComposing || e.ctrlKey || e.altKey || e.metaKey) return;
  if (performance.now() < st.guardUntil) return;
  if (document.querySelector('dialog[open]')) return;
  const k = e.key;
  const inRecord = st.view === 'record';
  if (inRecord) {
    if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); return recMove(1); }
    if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); return recMove(-1); }
    if (k === 'Enter') { const v = visibleEntries(); if (v[st.recFocus]) { e.preventDefault(); openFromRecord(v[st.recFocus].dataset.q); } return; }
    if (k === '/') { e.preventDefault(); st.guardUntil = performance.now() + 120; return $('#recq').focus(); }
    if (k === 'l') { e.preventDefault(); return closeSheets(); }
    if (k === 'v') { e.preventDefault(); return openPlate(); }
    if (k === 't') { e.preventDefault(); return openTerms(); }
    if (k === '?') { e.preventDefault(); return openKeys(); }
    return;
  }
  switch (k) {
    case 'j': case 'ArrowDown': e.preventDefault(); return step(1);
    case 'k': case 'ArrowUp': e.preventDefault(); return step(-1);
    case '1': case '2': case '3': case '4': e.preventDefault(); return pick(KEYS[k]);
    case 'a': e.preventDefault(); return accept();
    case 'r': case 'f': e.preventDefault(); return byId[st.cur].status === 'answered' ? reopen() : openReply();
    case 'd': e.preventDefault(); return defer();
    case 'o': e.preventDefault(); return reopen();
    case 'e': e.preventDefault(); return explore();
    case 'u': e.preventDefault(); return unstage(st.cur);
    case 'v': e.preventDefault(); return st.view === 'plate' ? closeSheets() : openPlate();
    case 'V': e.preventDefault(); return redraw();
    case 'l': e.preventDefault(); return openRecord();
    case '/': e.preventDefault(); return openRecord();
    case 't': e.preventDefault(); return openTerms();
    case '?': e.preventDefault(); return openKeys();
  }
});
addEventListener('resize', () => { layoutPlate(); placeInd(); });
$('#marg').addEventListener('scroll', layoutPlate, { passive: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutPlate(); placeInd(); });
new ResizeObserver(() => { layoutPlate(); placeInd(); }).observe($('#stage'));

// ------- boot -------
st.cur = (frontier().all[0] || S.questions[0]).id;
renderAll(0);
requestAnimationFrame(() => { layoutPlate(); placeInd(); });
window.__grill = { st, go, stage, send, pick, accept, openRecord, openPlate, closeSheets, frontier, counts };
})();
</script>
</body>
