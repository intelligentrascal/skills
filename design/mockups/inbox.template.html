<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox · grill mockup</title>
<!-- Inbox layout mockup (plan Task 3, spec §7 / §9.1). The look is Jason Ku's grill-with-ui page.html,
     verbatim: its :root tokens and every rule from page.html lines 8-205 are copied unchanged below
     (system serif/sans, no web fonts, no tokens.css). Markup and render code follow page.html's renders;
     data comes from SESSION (build.mjs inlines data.js at the DATA slot). The only additions sit in the
     "mockup additions" block after the copied CSS. -->
<style>
  :root {
    --bg: #f7f4ee; --panel: #ffffff; --ink: #1f1c18; --ink-2: #625b51; --ink-3: #9a9285;
    --rule: #e6e0d4; --accent: #9a3a26; --ok: #3d6b4a; --ok-soft: #e3eee5; --stage: #b8791f; --stage-soft: #f8ecd2; --warn-soft: #fbe9e4;
    --serif: "Iowan Old Style", Charter, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
    display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: 260px minmax(0, 1fr) 33vw; height: 100vh;
  }
  a { color: var(--accent); }
  /* Rows are pinned: the banner is display:none most of the time, and auto-placement would
     otherwise slide the content into the "auto" row and stretch the footer into the "1fr" row. */
  #banner { grid-row: 1; grid-column: 1 / -1; display: none; padding: 9px 24px; font-size: 14px; background: var(--warn-soft); color: var(--accent); border-bottom: 1px solid var(--rule); }
  #banner.show { display: block; } #banner.done { background: var(--ok-soft); color: var(--ok); }

  header { grid-row: 2; grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--panel); position: relative; }
  header h1 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
  header .path { color: var(--ink-3); font-size: 13px; }
  header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); } header .status .spin { color: var(--stage); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.working { background: var(--stage); animation: pulse 1.2s ease-in-out infinite; }
  .dot.gone { background: var(--ink-3); }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; flex-shrink: 0; }
  #progress { display: none; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: var(--stage-soft); }
  header.working #progress { display: block; }
  #progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--stage); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  #terms-toggle, #visualize { font-size: 12px; padding: 4px 10px; }
  #visualize .spin { width: 9px; height: 9px; margin-right: 4px; }
  #visualize:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  #terms { display: none; position: absolute; right: 24px; top: 100%; width: 420px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); z-index: 5; }
  #terms.show { display: block; }
  .term { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; } .term:last-child { border-bottom: 0; }
  .term b { font-family: var(--serif); font-weight: 500; font-size: 15px; } .term .avoid { color: var(--ink-3); font-size: 12px; }

  nav { grid-row: 3; grid-column: 1; border-right: 1px solid var(--rule); overflow-y: auto; padding: 10px 0 24px; }
  nav .note { margin: 6px 14px 4px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
  nav .round { padding: 16px 20px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  nav .round.current { color: var(--accent); }
  .item { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: baseline; padding: 8px 20px; cursor: pointer; }
  .item:hover { background: #efebe3; }
  .item.selected { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .item .id { font-size: 12px; color: var(--ink-3); }
  .item .t { font-size: 14px; }
  .item .mark { font-size: 11px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
  .item .mark svg { width: 12px; height: 12px; }
  .mark.answered { color: var(--ok); } .mark.open, .mark.reopened { color: var(--accent); } .mark.staged { color: var(--stage); font-weight: 600; } .mark.pending { color: var(--stage); }
  .item.updated .t::after { content: "updated"; font-size: 10px; color: var(--stage); margin-left: 6px; letter-spacing: .06em; text-transform: uppercase; }
  nav .empty { padding: 20px; font-size: 13px; color: var(--ink-3); }

  /* Visualize view: the list and card columns give way to the visual; the right panel becomes its feedback. */
  #visual { grid-row: 3; grid-column: 1 / 3; display: none; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
  body.visualize #visual { display: grid; } body.visualize nav, body.visualize main { display: none; }
  #visual-strip { display: flex; align-items: center; gap: 14px; padding: 8px 24px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); background: var(--bg); }
  #visual-strip .kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  #visual-strip .ver { color: var(--ink-3); } #visual-strip .ver b { color: var(--ink-2); font-weight: 600; }
  #visual-stale { color: var(--stage); font-size: 12px; }
  #visual-strip .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--stage); }
  #visual-strip a { color: var(--ink-3); text-decoration: none; font-size: 13px; } #visual-strip a:hover { color: var(--accent); }
  #visual-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  #visual-wait { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--ink-3); font-size: 14px; background: #fff; }
  #visual-wait[hidden], #visual-frame[hidden] { display: none; }

  main { grid-row: 3; grid-column: 2; overflow-y: auto; padding: 36px 44px 60px; background: var(--panel); }
  .card { max-width: 680px; }
  .crumb { font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
  .crumb a { text-decoration: none; } .crumb .upd { color: var(--stage); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0 12px; }
  .card h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0; }
  #explore { font-size: 13px; padding: 6px 12px; flex-shrink: 0; }
  #explore:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  .card .body { font-size: 15px; color: var(--ink-2); max-width: 62ch; margin: 0; white-space: pre-line; }
  .opts { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .opt .check { width: 20px; height: 20px; color: var(--ok); visibility: hidden; align-self: center; }
  .opt .check svg, .mark svg { display: block; width: 100%; height: 100%; }
  .opt:hover { border-color: var(--ink-3); }
  .opt .k { font-family: var(--serif); font-size: 18px; line-height: 1.2; color: var(--ink-3); }
  .opt.rec { border-color: var(--accent); } .opt.rec .k { color: var(--accent); }
  .opt .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .opt.chosen { background: var(--ok-soft); border-color: var(--ok); } .opt.chosen .k, .opt.chosen .tag { color: var(--ok); } .opt.chosen .check { visibility: visible; }
  /* Once an answer is picked (staged or recorded), everything but the picked box reads as disabled; hover or focus wakes a part back up. */
  .card.picked .body, .card.picked .why, .card.picked .answer-row, .card.picked .links, .card.picked .opt:not(.chosen):not(.staged):not(.pending) { opacity: .45; transition: opacity .15s; }
  .card.picked .opt:not(.chosen):not(.staged):not(.pending):hover, .card.picked .answer-row:focus-within, .card.picked .links:hover { opacity: 1; }
  .opt.text-answer { cursor: default; } .opt.text-answer .tag { color: var(--ok); } .opt.text-answer:hover { border-color: var(--ok); }
  .opt.staged { border-color: var(--stage); box-shadow: 0 0 0 1px var(--stage); background: var(--stage-soft); }
  .opt.pending { border-color: var(--stage); border-style: dashed; } .opt.pending .k { color: var(--stage); } .opt .check.pending { visibility: visible; color: var(--stage); display: flex; align-items: center; justify-content: center; }
  .locked .opt { cursor: default; } .locked .opt:hover { border-color: var(--rule); }
  .why { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); white-space: pre-line; } .why b { color: var(--accent); font-weight: 600; }
  .staged-line { margin-top: 10px; font-size: 14px; color: var(--stage); } .staged-line a { color: var(--ink-3); font-size: 12px; margin-left: 8px; }
  .pending-line { margin-top: 10px; font-size: 14px; color: var(--stage); display: flex; align-items: center; gap: 8px; }
  .answer-row { display: flex; gap: 8px; margin-top: 20px; align-items: flex-start; }
  .links { margin-top: 12px; font-size: 13px; display: flex; gap: 14px; } .links a { color: var(--ink-3); text-decoration: none; } .links a:hover { color: var(--accent); }
  textarea { width: 100%; min-height: 60px; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); resize: vertical; color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--ink-3); }
  button { font-family: var(--sans); font-weight: 500; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } button.primary:hover { border-color: var(--accent); }
  button:disabled, button.primary:disabled { background: var(--ink-3); border-color: var(--ink-3); color: #fff; cursor: default; }
  main .empty { color: var(--ink-3); font-size: 14px; }

  aside { grid-row: 3; grid-column: 3; border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  aside .head { padding: 20px 22px 12px; }
  aside .head h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  aside .head .sub { font-family: var(--serif); font-size: 16px; margin-top: 4px; }
  aside .head .count { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-family: var(--sans); }
  aside .msgs { overflow-y: auto; padding: 0 22px 12px; }
  .msg { padding: 12px 0; border-top: 1px solid var(--rule); position: relative; }
  .msg .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .msg.user .who { color: var(--stage); } .msg.agent .who { color: var(--accent); }
  .msg.staged { background: var(--stage-soft); margin: 8px -10px 0; padding: 10px 28px 10px 10px; border-radius: 6px; border-top: 0; }
  .msg.pending { opacity: .7; } .msg.pending .who { display: flex; align-items: center; gap: 6px; }
  .msg .text { font-size: 14px; white-space: pre-line; }
  .msg .rm { position: absolute; right: 8px; top: 8px; color: var(--ink-3); text-decoration: none; font-size: 14px; }
  .empty-thread { padding: 12px 0; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--rule); }
  .explore-head { padding: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; border-top: 1px solid var(--rule); }
  .explore-wait { padding: 12px 0; font-size: 13px; color: var(--stage); border-top: 1px solid var(--rule); }
  .procon { width: 100%; border-collapse: collapse; font-size: 13px; margin: 2px 0 10px; }
  .procon th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule); }
  .procon td { vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); }
  .procon td.k { font-family: var(--serif); font-size: 16px; color: var(--ink-2); width: 28px; } .procon td.k.rec { color: var(--accent); }
  .procon ul { margin: 0; padding-left: 16px; } .procon li { margin: 0 0 3px; }
  .procon .pro li::marker { color: var(--ok); } .procon .con li::marker { color: var(--accent); }
  aside .compose { padding: 12px 22px 18px; border-top: 1px solid var(--rule); display: grid; gap: 8px; } aside .compose button { justify-self: end; }

  footer { grid-row: 4; grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-top: 1px solid var(--rule); background: var(--panel); }
  footer .staged-list { font-size: 13px; color: var(--ink-2); flex: 1; } footer .staged-list b { color: var(--stage); } footer .staged-list .sent { color: var(--stage); display: inline-flex; align-items: center; gap: 6px; }
  #finish.ready { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; animation: ready 1.2s ease-in-out infinite; }
  #finish.ready:hover { background: #2f5a3b; border-color: #2f5a3b; }
  @keyframes ready { 0%, 100% { background-color: var(--ok); border-color: var(--ok); } 50% { background-color: #7fb08d; border-color: #7fb08d; } }
  footer .hint { font-size: 12px; color: var(--ink-3); } footer .warn { font-size: 12px; color: var(--accent); }
  footer .confirm { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  #finish:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); animation: none; } #finish .spin { margin-right: 4px; }

  /* Narrow screens. The desktop layout is three fixed columns (260px / flexible
     / 33vw) in a 100vh grid. At 390px the middle column is crushed and the option
     cards fall off the right edge. Below 760px the three panes stack into one
     scrolling page and the action bar sticks to the bottom, so there is no need to
     switch the browser into desktop mode. Tablets (768px) keep the three columns:
     that width already fits. */
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: none; height: auto; min-height: 100vh; }
    #banner, header, nav, main, #visual, aside, footer { grid-column: 1 / -1; grid-row: auto; }

    /* buttons carry white-space:nowrap; without wrapping they shove the
       status text past the right edge */
    header { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
    header h1 { font-size: 17px; flex-basis: 100%; }
    header .status { margin-left: 0; }

    /* the question list stays within reach without eating the screen */
    nav { max-height: 24vh; border-right: 0; border-bottom: 1px solid var(--rule); }

    /* panes join the page scroll instead of each scrolling on its own */
    main { overflow-y: visible; padding: 20px 16px 28px; }
    .card h2 { font-size: 22px; }
    .opts { margin-top: 16px; }
    .opt { padding: 12px; gap: 10px; }

    aside { border-left: 0; border-top: 1px solid var(--rule); grid-template-rows: auto auto auto; }
    aside .msgs { overflow-y: visible; }

    /* "Send to Agent" must always be reachable */
    footer { position: sticky; bottom: 0; z-index: 4; flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }

    /* the fixed 420px width overflows a 390px screen */
    #terms { left: 12px; right: 12px; width: auto; max-height: 50vh; }

    /* #visual-frame is height:100%, so the pane needs a resolved height */
    #visual { height: 78vh; }
  }

  /* Five looping animations had no escape hatch. The blanket reset below stops
     everything that travels or rotates, but three of them are progress indicators
     rather than decoration: freezing them removes the only sign that the agent is
     working, because .spin has border-right-color:transparent and reads as a broken
     ring, and #progress::after starts at left:-30% so a stopped one is invisible.
     Those fade instead, legible with nothing moving. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    /* spinner: stop rotating, close the ring so it does not look broken */
    .spin { animation: pulse 1.6s ease-in-out infinite !important; border-right-color: currentColor !important; }
    /* progress bar: stop travelling, become a full-width bar that pulses */
    #progress::after { animation: pulse 1.6s ease-in-out infinite !important; left: 0 !important; width: 100% !important; }
    /* status dot & Finish button: opacity/colour only, nothing moves — just slow them */
    .dot.working { animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
    #finish.ready { animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
  }

  /* ---- mockup additions (not in page.html) ----------------------------------------------------
     1. The question list stays beside the visual (page.html hides it and lets the visual span
        both columns) so hovering a question can outline its region (plan Task 3 / Task 20).
     2. The toast is a-inbox-clean.template.html's, verbatim; it stands in for the server round trip. */
  body.visualize nav { display: block; }
  @media (min-width: 761px) { #visual { grid-column: 2; } }
  /* 3. Below 760px the strip wraps: page.html's single row overflows 390px once "regenerating…" shows. */
  /* 4. The answer row carries a-inbox-clean's "Accept A" beside page.html's "Stage text"; with two
        buttons the textarea gets too narrow at 390px, so it takes its own line there. */
  @media (max-width: 760px) {
    #visual-strip { flex-wrap: wrap; gap: 4px 14px; padding: 8px 16px; }
    .answer-row { flex-wrap: wrap; } .answer-row textarea { flex-basis: 100%; }
  }
  .toast { position: fixed; right: 24px; bottom: 72px; padding: 10px 14px; background: var(--ink); color: #fff; font-size: 13px; border-radius: 6px; opacity: 0; transform: translateY(6px); transition: .25s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1 id="topic">grill</h1>
  <span class="path" id="doc-path"></span>
  <button id="terms-toggle" type="button">Terms</button>
  <div id="terms"></div>
  <button id="visualize" type="button" aria-keyshortcuts="v">Visualize</button>
  <span class="status"><span class="dot" id="agent-dot"></span><span id="agent-status"></span></span>
  <div id="progress"></div>
</header>
<nav id="nav" aria-label="Questions"></nav>
<main id="main"></main>
<section id="visual" aria-label="Visual"><div id="visual-strip"></div><iframe id="visual-frame" title="Visual" sandbox="allow-scripts"></iframe></section>
<aside id="aside"></aside>
<footer>
  <span class="staged-list" id="staged-list" role="status"></span>
  <span class="warn" id="send-why"></span>
  <span class="hint">⌘↩ send</span>
  <span id="finish-area"></span>
  <button class="primary" id="send" type="button" disabled>Send to Agent</button>
</footer>
<div class="toast" id="toast" role="status"></div>
<script>
/*__DATA__*/
</script>
<script>
"use strict";
const S = SESSION;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CHECK = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M6 10.4l2.6 2.6L14 7.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const hhmm = (iso) => (iso ? String(iso).slice(11, 16) : ""); // fixed clock, so screenshots are stable
const fmtMs = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`; };

// ---- data helpers (page.html) ----
const qs = () => S.questions;
const byId = (id) => qs().find((q) => q.id === id);
const ORDER = qs().map((q) => q.id);
const isOpen = (q) => q.status === "open" || q.status === "reopened";
const curRound = () => qs().reduce((m, q) => Math.max(m, Number(q.round) || 0), 0);
const rounds = () => { const m = new Map(); for (const q of qs()) { const r = Number(q.round) || 0; if (!m.has(r)) m.set(r, []); m.get(r).push(q); } return [...m.entries()].sort((a, b) => a[0] - b[0]); };
const firstOpen = () => qs().filter((q) => isOpen(q) && Number(q.round) === curRound())[0] || qs().find(isOpen) || qs()[qs().length - 1] || null;

// ---- local state: staged actions and unstaged drafts (drafts go with the send, never dropped) ----
const local = { staged: {}, drafts: {}, vfeedback: [], view: "questions" };
let selected = (firstOpen() || {}).id || null;
let confirmFinish = false;
let workingSince = 0;

// ---- visual linkage: parent side of plan Task 20's protocol ----
const frame = $("visual-frame");
frame.srcdoc = VISUAL_HTML;
const activeView = () => local.view;
function highlight(ids) { if (frame.contentWindow) frame.contentWindow.postMessage({ highlight: ids }, "*"); }
// With the visual open, the selected question stays outlined when the pointer leaves the list.
const restHighlight = () => highlight(activeView() === "visualize" && selected ? [selected] : []);
frame.addEventListener("load", restHighlight);
addEventListener("message", (e) => {
  if (e.source !== frame.contentWindow || !e.data || typeof e.data !== "object") return;
  const d = e.data;
  if (typeof d.clicked === "string" && /^q\d+$/.test(d.clicked) && byId(d.clicked)) select(d.clicked);
  else if (d.key === "send") send();
  else if (d.key === "escape") { frame.blur(); document.body.focus(); }
});

// ---- staging (page.html) ----
const st = (id) => (local.staged[id] = local.staged[id] || {});
const prune = (id) => { const s = local.staged[id]; if (s && !s.answer && !s.defer && !s.reopen && !(s.thread && s.thread.length)) delete local.staged[id]; };
function stageAnswer(id, answer) { const s = st(id); s.answer = answer; delete s.defer; delete s.reopen; commit(); }
function stageThread(id, text) { const s = st(id); (s.thread = s.thread || []).push(text); if (local.drafts[id]) delete local.drafts[id].thread; commit(); }
function stageDefer(id) { const s = st(id); s.defer = true; delete s.answer; delete s.reopen; commit(); }
function stageReopen(id) { const s = st(id); s.reopen = true; delete s.answer; delete s.defer; commit(); }
function clearStaged(id) { const s = local.staged[id]; if (s) { delete s.answer; delete s.defer; delete s.reopen; prune(id); } commit(); }
function removeThread(id, i) { const s = local.staged[id]; if (s && s.thread) { s.thread.splice(i, 1); prune(id); } commit(); }
function stageFeedback(text) { local.vfeedback.push(text); if (local.drafts.__visual) delete local.drafts.__visual.thread; commit(); }
function removeFeedback(i) { local.vfeedback.splice(i, 1); commit(); }
function commit() { render(); }
function stagedCount() {
  let n = local.vfeedback.length;
  for (const s of Object.values(local.staged)) n += (s.answer ? 1 : 0) + (s.defer ? 1 : 0) + (s.reopen ? 1 : 0) + (s.thread ? s.thread.length : 0);
  return n;
}
// Typed but not staged: [label, key] pairs. Send stages them first.
const draftList = () => Object.entries(local.drafts).flatMap(([id, d]) => [
  ...(d.free && d.free.trim() ? [[id.toUpperCase() + " text", id]] : []),
  ...(d.thread && d.thread.trim() ? [[id === "__visual" ? "visual msg" : id.toUpperCase() + " msg", id]] : []),
]);
const working = () => S.agent.status === "working";
function sendState(needStaged = true) {
  if (working()) return { disabled: true, why: "" };
  if (needStaged && !(stagedCount() + draftList().length)) return { disabled: true, why: "" };
  return { disabled: false, why: "" };
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800); }
function send(extra) {
  if (sendState(!extra).disabled) return;
  for (const [id, d] of Object.entries(local.drafts)) {
    if (id === "__visual") { if (d.thread && d.thread.trim()) local.vfeedback.push(d.thread.trim()); continue; }
    if (d.free && d.free.trim()) { const s = st(id); s.answer = { kind: "text", text: d.free.trim() }; delete s.defer; delete s.reopen; }
    if (d.thread && d.thread.trim()) (st(id).thread = st(id).thread || []).push(d.thread.trim());
  }
  const n = stagedCount();
  local.staged = {}; local.drafts = {}; local.vfeedback = []; confirmFinish = false;
  S.agent.status = "working"; workingSince = Date.now(); render();
  toast(extra ? `Sent ${n} action${n === 1 ? "" : "s"} and finish as one event` : `Sent ${n} action${n > 1 ? "s" : ""} as one event`);
  setTimeout(() => { S.agent.status = "waiting"; S.agent.since = null; render(); }, 2600);
}

// ---- rendering (page.html renders, minus polling, explore and pending) ----
function render() {
  document.body.classList.toggle("visualize", activeView() === "visualize");
  renderHeader(); renderNav(); renderMain(); renderVisual(); renderAside(); renderFooter();
}
function renderHeader() {
  document.title = "grill · " + (S.topic || "");
  $("topic").textContent = S.topic || "grill";
  $("doc-path").textContent = S.doc || "";
  const terms = Array.isArray(S.terms) ? S.terms : [];
  $("terms-toggle").textContent = `Terms${terms.length ? " · " + terms.length : ""}`;
  $("terms").innerHTML = terms.length
    ? terms.map((t) => `<div class="term"><b>${esc(t.term)}</b> — ${esc(t.def)}${t.avoid && t.avoid.length ? `<div class="avoid">Avoid: ${t.avoid.map(esc).join(", ")}</div>` : ""}</div>`).join("")
    : `<div class="term" style="color:var(--ink-3)">No terms yet. The agent adds vocabulary here as it settles.</div>`;
  const v = S.visual;
  $("visualize").textContent = activeView() === "visualize" ? "Questions" : `Visual · v${v.version}`;
  renderStatus();
}
function renderStatus() {
  const dot = $("agent-dot"), txt = $("agent-status"); const a = S.agent;
  document.querySelector("header").classList.toggle("working", working());
  if (working()) { dot.className = "dot working"; txt.innerHTML = `<span class="spin"></span> Agent working · ${fmtMs(Date.now() - workingSince)}`; }
  else { dot.className = "dot"; txt.textContent = `Agent waiting for you${a.since ? " · since " + hhmm(a.since) : " · just now"}${a.handled ? " · handled #" + a.handled : ""}`; }
}
// Hover follows real pointer movement (mousemove), not mouseenter: when the list scrolls or
// re-renders under a pointer that has gone into the visual, Chrome fires mouseenter on whatever
// item now sits at the pointer's last position here, which would steal the region's outline.
let hovering = null;
function hoverable(el, id) {
  el.addEventListener("mousemove", () => { if (hovering !== id) { hovering = id; highlight([id]); } });
  el.addEventListener("mouseleave", () => { if (hovering === id) hovering = null; restHighlight(); });
}
// The list is rebuilt only when its content changes; a selection change just moves the class.
// Rebuilding under a resting pointer makes Chrome fire mouseenter on the new item, which would
// steal the visual's outline from a region the user just clicked.
function renderNav() {
  const nav = $("nav"); const cur = curRound();
  let html = S.note ? `<div class="note">${esc(S.note)}</div>` : "";
  for (const [r, list] of rounds()) {
    html += `<div class="round${r === cur ? " current" : ""}"><span>Round ${r}${r === cur ? " · current" : ""}</span><span>${list.length}</span></div>`;
    for (const q of list) {
      const mark = local.staged[q.id] ? `<span class="mark staged">staged</span>`
        : `<span class="mark ${esc(q.status)}">${q.status === "answered" ? CHECK + esc((q.answer && q.answer.option) || "text") : esc(q.status)}</span>`;
      html += `<div class="item${q.updated ? " updated" : ""}" data-id="${esc(q.id)}"><span class="id">${esc(q.id).toUpperCase()}</span><span class="t">${esc(q.title)}</span>${mark}</div>`;
    }
  }
  if (nav.dataset.html !== html) {
    nav.innerHTML = html; nav.dataset.html = html;
    nav.querySelectorAll(".item").forEach((el) => { el.onclick = () => select(el.dataset.id); hoverable(el, el.dataset.id); });
  }
  nav.querySelectorAll(".item").forEach((el) => el.classList.toggle("selected", el.dataset.id === selected));
  // Scroll the list only, never the page: on the stacked phone layout scrollIntoView would drag the
  // page up from the visual when a region is tapped.
  const sel = nav.querySelector(".item.selected");
  if (sel) { const top = sel.offsetTop - nav.offsetTop, bot = top + sel.offsetHeight; if (top < nav.scrollTop) nav.scrollTop = top; else if (bot > nav.scrollTop + nav.clientHeight) nav.scrollTop = bot - nav.clientHeight; }
}
function renderMain() {
  const main = $("main"); const q = byId(selected);
  if (!q) { main.innerHTML = `<p class="empty">No questions yet.</p>`; return; }
  const s = local.staged[q.id] || {}; const d = local.drafts[q.id] || {};
  const rec = q.rec || {};
  const crumb = [`${esc(q.id).toUpperCase()} · round ${esc(q.round)}`];
  crumb.push(q.deps && q.deps.length ? `<span>after ${q.deps.map((x) => `<a href="#" data-go="${esc(x)}">${esc(x).toUpperCase()}</a>`).join(", ")}</span>` : `<span>root</span>`);
  if (q.durable) crumb.push(`<span>durable</span>`);
  if (q.updated) crumb.push(`<span class="upd">recommendation updated</span>`);
  if (q.status === "deferred") crumb.push(`<span>deferred</span>`);
  if (q.status === "reopened") crumb.push(`<span>reopened</span>`);
  const opts = (q.options || []).map((o) => {
    const isRec = rec.option === o.k, chosen = q.answer && q.answer.option === o.k, staged = s.answer && s.answer.option === o.k;
    return `<li class="opt${isRec ? " rec" : ""}${chosen ? " chosen" : ""}${staged ? " staged" : ""}" data-opt="${esc(o.k)}"><span class="k">${esc(o.k)}</span><span>${isRec ? `<div class="tag">Recommended</div>` : ""}${esc(o.text)}</span><span class="check">${CHECK}</span></li>`;
  }).join("") + (q.status === "answered" && q.answer && q.answer.kind === "text" && q.answer.text
    ? `<li class="opt chosen text-answer"><span class="k"></span><span><div class="tag">Your answer</div>${esc(q.answer.text)}</span><span class="check">${CHECK}</span></li>` : "");
  const why = rec.option ? `<p class="why"><b>Why ${esc(rec.option)}.</b> ${esc(rec.why)}</p>`
    : rec.text ? `<p class="why"><b>Suggested.</b> ${esc(rec.text)}${rec.why ? " — " + esc(rec.why) : ""}</p>` : rec.why ? `<p class="why">${esc(rec.why)}</p>` : "";
  let stagedLine = "";
  if (s.defer) stagedLine = "Staged: defer this question";
  else if (s.reopen) stagedLine = "Staged: reopen this question";
  else if (s.answer) stagedLine = s.answer.kind === "accept" ? `Staged: accept ${esc(s.answer.option)}` : s.answer.option ? `Staged: option ${esc(s.answer.option)}` : `Staged text: “${esc(s.answer.text)}”`;
  if (stagedLine) stagedLine = `<div class="staged-line">${stagedLine}<a href="#" id="clear-staged">clear</a></div>`;
  const hasOpts = (q.options || []).length;
  const controls = `
      <div class="answer-row">
        <textarea id="free" aria-label="Your answer" placeholder="${q.status === "answered" ? "Change your answer, or add nuance…" : hasOpts ? "Free-text answer, if none of the options fit…" : "Your answer…"}">${esc(d.free || "")}</textarea>
        ${rec.option ? `<button id="accept" type="button">Accept ${esc(rec.option)}</button>` : ""}
        <button id="stage-text" type="button">Stage text</button>
      </div>
      <div class="links">${isOpen(q) ? `<a href="#" id="defer">Defer this question</a>` : `<a href="#" id="reopen">Reopen this question</a>`}</div>`;
  const picked = (q.status === "answered" && q.answer) || !!s.answer;
  main.innerHTML = `<article class="card${picked ? " picked" : ""}">
      <div class="crumb">${crumb.join("")}</div>
      <div class="title-row"><h2>${esc(q.title)}</h2></div>
      <p class="body">${esc(q.body)}</p>
      ${opts ? `<ul class="opts">${opts}</ul>` : ""}
      ${why}${stagedLine}${controls}
    </article>`;
  main.querySelectorAll("[data-go]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); select(a.dataset.go); }));
  main.querySelectorAll(".opt:not(.text-answer)").forEach((o) => (o.onclick = () => pick(o.dataset.opt)));
  const ac = $("accept"); if (ac) ac.onclick = () => stageAnswer(q.id, { kind: "accept", option: rec.option });
  $("stage-text").onclick = () => { const t = $("free").value.trim(); if (t) { (local.drafts[q.id] = local.drafts[q.id] || {}).free = ""; stageAnswer(q.id, { kind: "text", text: t }); } else $("free").focus(); };
  $("free").oninput = (e) => { (local.drafts[q.id] = local.drafts[q.id] || {}).free = e.target.value; renderFooter(); };
  const cl = $("clear-staged"); if (cl) cl.onclick = (e) => { e.preventDefault(); clearStaged(q.id); };
  const df = $("defer"); if (df) df.onclick = (e) => { e.preventDefault(); stageDefer(q.id); };
  const ro = $("reopen"); if (ro) ro.onclick = (e) => { e.preventDefault(); stageReopen(q.id); };
}
function renderVisual() {
  const v = S.visual; const busy = working();
  $("visual-strip").innerHTML = `<span class="kind">${v.kind === "diagram" ? "Diagram" : "Prototype"}</span>
    <span class="ver"><b>v${esc(v.version)}</b>${v.note ? " · " + esc(v.note) : ""}${v.at ? " · " + hhmm(v.at) : ""}</span>
    ${v.stale ? `<span id="visual-stale" role="status">Out of date · regenerate to include the latest decisions</span>` : ""}
    <span class="right">${busy ? `<span class="spin"></span> regenerating…` : `<a href="#" id="regen">Regenerate</a>`}</span>`;
  const r = $("regen"); if (r) r.onclick = (e) => { e.preventDefault(); toast("Regenerate requested (mockup)"); };
}
function msgHtml(m) { return `<div class="msg ${m.who === "agent" ? "agent" : "user"}"><div class="who">${esc(m.who)}${m.at ? " · " + hhmm(m.at) : ""}</div><div class="text">${esc(m.text)}</div></div>`; }
function renderAside() {
  const aside = $("aside");
  if (activeView() === "visualize") return renderFeedback(aside);
  const q = byId(selected);
  if (!q) { aside.innerHTML = ""; return; }
  const s = local.staged[q.id] || {}; const d = local.drafts[q.id] || {};
  const thread = Array.isArray(q.thread) ? q.thread : [];
  const msgs = thread.map(msgHtml).join("")
    + (s.thread || []).map((t, i) => `<div class="msg user staged"><div class="who">you · staged</div><div class="text">${esc(t)}</div><a href="#" class="rm" data-rm="${i}" title="Remove">×</a></div>`).join("");
  aside.innerHTML = `
    <div class="head"><h3>Discussion</h3><div class="sub">${esc(q.id).toUpperCase()} · ${esc(q.title)}<span class="count">${thread.length} message${thread.length === 1 ? "" : "s"}</span></div></div>
    <div class="msgs">${msgs || `<div class="empty-thread">Nothing yet. Ask anything about this question; the agent answers here on the next send.</div>`}</div>
    <div class="compose"><textarea id="thread-in" aria-label="Message about ${esc(q.id).toUpperCase()}" placeholder="Dig deeper on ${esc(q.id).toUpperCase()}…">${esc(d.thread || "")}</textarea><button id="stage-thread" type="button">Add to discussion</button></div>`;
  aside.querySelectorAll("[data-rm]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); removeThread(q.id, Number(a.dataset.rm)); }));
  $("stage-thread").onclick = () => { const t = $("thread-in").value.trim(); if (t) stageThread(q.id, t); else $("thread-in").focus(); };
  $("thread-in").oninput = (e) => { (local.drafts[q.id] = local.drafts[q.id] || {}).thread = e.target.value; renderFooter(); };
}
function renderFeedback(aside) {
  const v = S.visual; const d = local.drafts.__visual || {};
  const thread = Array.isArray(v.thread) ? v.thread : [];
  const msgs = thread.map(msgHtml).join("")
    + local.vfeedback.map((t, i) => `<div class="msg user staged"><div class="who">you · staged</div><div class="text">${esc(t)}</div><a href="#" class="rm" data-rmf="${i}" title="Remove">×</a></div>`).join("");
  aside.innerHTML = `
    <div class="head"><h3>Visual feedback</h3><div class="sub">${v.kind === "diagram" ? "Diagram" : "Prototype"} · v${esc(v.version)}<span class="count">${thread.length} message${thread.length === 1 ? "" : "s"}</span></div></div>
    <div class="msgs">${msgs || `<div class="empty-thread">Nothing yet. Say what is wrong or missing in the visual; the agent redraws it on the next send. If a note contradicts an answered question, that question is reopened for you.</div>`}</div>
    <div class="compose"><textarea id="feedback-in" aria-label="Feedback on the visual" placeholder="Feedback on the visual…">${esc(d.thread || "")}</textarea><button id="stage-feedback" type="button">Add feedback</button></div>`;
  aside.querySelectorAll("[data-rmf]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); removeFeedback(Number(a.dataset.rmf)); }));
  $("stage-feedback").onclick = () => { const t = $("feedback-in").value.trim(); if (t) stageFeedback(t); else $("feedback-in").focus(); };
  $("feedback-in").oninput = (e) => { (local.drafts.__visual = local.drafts.__visual || {}).thread = e.target.value; renderFooter(); };
}
function renderFooter() {
  const n = stagedCount(); const dr = draftList(); const list = $("staged-list");
  const parts = Object.entries(local.staged).map(([id, s]) => {
    const bits = [];
    if (s.reopen) bits.push("reopen"); if (s.defer) bits.push("defer");
    if (s.answer) bits.push(s.answer.option ? "→ " + s.answer.option : "→ text");
    if (s.thread && s.thread.length) bits.push(`+${s.thread.length} msg`);
    return `${esc(id).toUpperCase()} ${bits.join(" ")}`;
  });
  if (local.vfeedback.length) parts.push(`visual +${local.vfeedback.length} msg`);
  const drafts = dr.length ? `${dr.length} draft${dr.length === 1 ? "" : "s"} · ${dr.map(([label]) => esc(label)).join(" · ")}` : "";
  list.innerHTML = n ? `<b>${n} staged</b> · ${parts.join(" · ")}${drafts ? " · " + drafts : ""}`
    : drafts || "Nothing staged. Pick an option, accept a recommendation, or write in the discussion.";
  const fa = $("finish-area");
  if (confirmFinish) fa.innerHTML = `<span class="confirm">Finish this grill? Everything staged goes with it; the agent writes the design doc and stops. <button id="finish-yes" type="button">Finish</button><button id="finish-no" type="button">Cancel</button></span>`;
  else fa.innerHTML = `<button id="finish" type="button"${sendState(false).disabled ? " disabled" : ""}>Finish grill</button>`;
  const f = $("finish"); if (f && !f.disabled) f.onclick = () => { confirmFinish = true; render(); };
  const fy = $("finish-yes"); if (fy) fy.onclick = () => send(true);
  const fn = $("finish-no"); if (fn) fn.onclick = () => { confirmFinish = false; render(); };
  const { disabled, why } = sendState(); const total = n + dr.length; const b = $("send");
  b.disabled = disabled; b.textContent = total ? `Send ${total} to Agent` : "Send to Agent";
  $("send-why").textContent = why;
}

// ---- actions ----
function select(id) {
  if (!byId(id)) return;
  selected = id; render();
  restHighlight();
  if (activeView() === "questions") $("main").scrollTop = 0;
}
function setView(v) { local.view = v; render(); restHighlight(); }
function pick(k) {
  const q = byId(selected); const s = local.staged[q.id];
  if (s && s.answer && s.answer.option === k) { delete s.answer; prune(q.id); commit(); return; } // second click unstages
  stageAnswer(q.id, { kind: k === (q.rec || {}).option ? "accept" : "option", option: k });
}

$("send").onclick = () => send();
$("visualize").onclick = () => setView(activeView() === "visualize" ? "questions" : "visualize");
$("terms-toggle").onclick = () => $("terms").classList.toggle("show");
document.addEventListener("click", (e) => { if (!e.target.closest("#terms") && !e.target.closest("#terms-toggle")) $("terms").classList.remove("show"); });
setInterval(() => { if (working()) renderStatus(); }, 1000);

/* ---- keyboard (subset of spec §7; the full layer is plan Task 19) ------ */
document.addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); return; }
  const t = e.target; const typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable);
  if (e.key === "Escape") { if (typing) t.blur(); $("terms").classList.remove("show"); return; }
  if (typing || e.ctrlKey || e.altKey || e.metaKey) return;
  const i = ORDER.indexOf(selected); const q = byId(selected); const s = local.staged[q.id] || {};
  const k = e.key; const inQ = activeView() === "questions";
  if (k === "j" || k === "k") { const n = ORDER[i + (k === "j" ? 1 : -1)]; if (n) select(n); }
  else if (/^[1-4]$/.test(k) && inQ) { const o = (q.options || [])[+k - 1]; if (o) pick(o.k); else return; }
  else if (k === "a" && inQ && q.rec && q.rec.option) stageAnswer(q.id, { kind: "accept", option: q.rec.option });
  else if (k === "f" && inQ) $("free").focus();
  else if (k === "r") (inQ ? $("thread-in") : $("feedback-in")).focus();
  else if (k === "v") setView(inQ ? "visualize" : "questions");
  else if (k === "u") clearStaged(q.id);
  else if (k === "d" && isOpen(q)) s.defer ? clearStaged(q.id) : stageDefer(q.id);
  else if (k === "o" && !isOpen(q)) s.reopen ? clearStaged(q.id) : stageReopen(q.id);
  else return;
  e.preventDefault();
});

document.body.tabIndex = -1;
render();
// Open on the current round: its header at the top of the list.
{ const cur = $("nav").querySelector(".round.current"); if (cur) $("nav").scrollTop = cur.offsetTop - $("nav").offsetTop - 8; }
</script>
