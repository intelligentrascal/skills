<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grill · Studio</title>
<link rel="stylesheet" href="../../skills/grilling-ui/page/tokens.css" />
<link rel="stylesheet" href="theme-studio.css" />
<style>
  /* Studio — visual-first conversation (spec §7 Studio row). Theme: theme-studio.css, tokens only; no network. */
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }

  /* ---------- header: material bar ---------- */
  .top {
    position: relative; z-index: var(--z-sticky);
    display: flex; align-items: center; gap: var(--sp-3) var(--sp-4); flex-wrap: wrap;
    min-height: 56px; padding: var(--sp-2) var(--sp-6);
    background: var(--material);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hairline);
    min-width: 0;
  }
  .top h1 { font-family: var(--font-ui); font-size: var(--t-body); font-weight: 600; letter-spacing: var(--track-ui); margin: 0; white-space: nowrap; }
  .top .doc { padding: 2px 8px; border-radius: var(--r-chip); background: var(--paper-2); white-space: nowrap; }
  /* segmented control */
  .switch { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-pill); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--hairline); }
  .switch a {
    padding: 2px 14px; border-radius: var(--r-pill);
    font-size: var(--t-footnote); line-height: 20px; color: var(--ink-2); text-decoration: none;
    transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
  }
  @media (hover: hover) { .switch a:hover { color: var(--ink); text-decoration: none; } }
  .switch a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--hairline-2); }
  .top .spacer { flex: 1; }
  /* switch: an Apple toggle, ink when on */
  .toggle { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--t-footnote); color: var(--ink-2); padding: 4px 10px 4px 6px; }
  .toggle .sw { width: 30px; height: 18px; border-radius: var(--r-pill); background: var(--hairline-2); position: relative; flex: none; transition: background-color var(--dur-hover) var(--ease-out); }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 0.5px var(--hairline-2); transition: transform var(--dur-hover) var(--ease-out); }
  .toggle[aria-pressed="true"] { border-color: transparent; background: transparent; color: var(--ink); }
  .toggle[aria-pressed="true"] .sw { background: var(--pill); }
  .toggle[aria-pressed="true"] .sw::after { transform: translateX(12px); }
  .status { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--t-footnote); color: var(--ink-2); white-space: nowrap; }

  /* ---------- studio grid ---------- */
  .studio { display: grid; grid-template-columns: minmax(0, 3fr) minmax(380px, 2fr); min-height: 0; }

  /* ---------- visual pane: the product on the paper ---------- */
  .visual { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--paper); }
  .vbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; padding: var(--sp-4) var(--sp-6) var(--sp-3); font-size: var(--t-footnote); color: var(--ink-3); min-width: 0; }
  .vbar b { font-size: var(--t-body); color: var(--ink); font-weight: 600; }
  .vbar .linked { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .vbar .linked .meta { font-size: var(--t-caption); margin-right: 2px; }
  .qchip {
    font-size: var(--t-caption); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums;
    padding: 0 10px; line-height: 22px; border-radius: var(--r-pill);
    color: var(--ink-2); background: var(--surface); border: 1px solid var(--hairline);
  }
  @media (hover: hover) { .qchip:hover { color: var(--ink); background: var(--surface); border-color: var(--hairline-2); } }
  .qchip.on { border-color: var(--butter); color: var(--butter-ink); background: var(--butter); }
  .stale {
    display: flex; align-items: center; gap: var(--sp-3); margin: 0 var(--sp-6) var(--sp-3);
    padding: 8px 8px 8px 16px; background: var(--peach); border-radius: var(--r-tile);
    font-size: var(--t-footnote); color: var(--peach-ink);
  }
  .stale .msgtxt { flex: 1; min-width: 0; }
  .stale strong { font-weight: 600; }
  .stale button { font-size: var(--t-caption); padding: 4px 14px; flex: none; border-color: transparent; background: var(--surface); color: var(--ink); font-weight: 600; }
  .frame-wrap { padding: 0 var(--sp-6) var(--sp-6); min-height: 0; display: flex; }
  #visual-frame {
    flex: 1; width: 100%; min-height: 0;
    border: 1px solid var(--hairline); border-radius: var(--r-sheet);
    background: var(--surface); box-shadow: var(--shadow-product);
  }

  /* empty state: before the first draw */
  .empty { overflow-y: auto; padding: var(--sp-12) var(--sp-10); min-height: 0; }
  .empty .inner { max-width: 60ch; margin: 0 auto; }
  .empty h2 { font-size: var(--t-title1); line-height: 1.08; letter-spacing: var(--track-display); margin: 0 0 var(--sp-3); }
  .empty .lede { font-size: var(--t-lead); line-height: 1.5; color: var(--ink-2); margin: 0 0 var(--sp-8); }
  .agreed { list-style: none; margin: 0 0 var(--sp-8); padding: 0; border-top: 1px solid var(--hairline); }
  .agreed li { display: grid; grid-template-columns: 18px 36px minmax(0, 1fr); gap: var(--sp-2); padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: var(--t-body); line-height: 1.5; }
  .agreed li::before { content: "\2713"; color: var(--mint-ink); font-weight: 700; font-size: var(--t-footnote); padding-top: 1px; }
  .agreed .id { font-size: var(--t-caption); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-3); padding-top: 3px; }
  .agreed .t { font-weight: 600; }
  .agreed .arrow { color: var(--ink-3); margin: 0 var(--sp-1); }
  .agreed .a { color: var(--ink-2); }
  .cta { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
  .cta button.primary { font-size: var(--t-body); padding: 10px 24px; }

  /* ---------- rail ---------- */
  .rail {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0;
    background: var(--surface); border-left: 1px solid var(--hairline);
  }
  .rhead { padding: var(--sp-4) var(--sp-5) var(--sp-3); border-bottom: 1px solid var(--hairline); display: grid; gap: var(--sp-2); }
  .rhead .row { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--t-footnote); color: var(--ink-2); }
  .rhead h2 { font-size: 24px; letter-spacing: var(--track-display); margin: 0 var(--sp-2) 0 0; }
  .needs a { font-weight: 600; font-variant-numeric: tabular-nums; }
  .jump { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
  .jump button {
    font-size: var(--t-caption); font-variant-numeric: tabular-nums; padding: 0; width: 26px; height: 26px; text-align: center;
    border-radius: 50%; color: var(--ink-2); border-color: transparent; background: transparent;
  }
  @media (hover: hover) { .jump button:hover { background: var(--paper-2); border-color: transparent; } }
  .jump button.cur { color: var(--on-ink); background: var(--pill); font-weight: 600; }
  .jump .lbl { font-size: var(--t-caption); color: var(--ink-3); margin-right: var(--sp-1); }

  .timeline { overflow-y: auto; min-height: 0; scroll-padding-top: 44px; }
  .round-h {
    position: sticky; top: 0; z-index: var(--z-raised);
    display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2);
    margin: 0; padding: var(--sp-2) var(--sp-5);
    background: var(--material-hi);
    -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--hairline);
    font-family: var(--font-ui); font-size: var(--t-footnote); font-weight: 600; letter-spacing: var(--track-ui); line-height: 22px; color: var(--ink-2);
  }
  .round-h span + span { font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .round-h.current { color: var(--ink); }
  .round-h .n-open { background: var(--butter); color: var(--butter-ink); font-weight: 600; font-size: var(--t-caption); padding: 0 8px; border-radius: var(--r-chip); line-height: 20px; }
  .round-body { padding: var(--sp-2) var(--sp-5) var(--sp-4); display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }

  /* collapsed one-line card (answered / deferred) */
  .line {
    display: grid; grid-template-columns: 16px 34px auto minmax(0, 1fr); gap: var(--sp-2); align-items: baseline;
    padding: var(--sp-2); margin: 0 calc(-1 * var(--sp-2)); width: calc(100% + 2 * var(--sp-2));
    border: 0; border-radius: var(--r-row); background: transparent; font-size: var(--t-sub); text-align: left;
  }
  @media (hover: hover) { .line:hover { background: var(--paper); border: 0; } }
  .line:active { transform: none; background: var(--paper-2); }
  .line .ic { font-size: var(--t-caption); font-weight: 700; color: var(--mint-ink); }
  .line.deferred .ic { color: var(--ink-3); }
  .line .id { font-size: var(--t-caption); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-3); }
  .line .t { font-weight: 600; white-space: nowrap; }
  .line .a { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .a .arrow { color: var(--ink-3); margin-right: var(--sp-1); }
  .line.staged .a { color: var(--peri-ink); }
  .line.linked .id { text-decoration: underline dotted var(--ochre); text-underline-offset: 3px; }

  /* full card */
  .card {
    border: 1px solid var(--hairline); border-radius: var(--r-card); background: var(--surface);
    padding: var(--sp-4) var(--sp-5); margin: var(--sp-2) 0; scroll-margin-top: 48px;
    transition: border-color var(--dur-hover) var(--ease-out);
  }
  @media (hover: hover) { .card:hover { border-color: var(--hairline-2); } }
  .card.selected { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .card.flash { border-color: var(--butter-ink); box-shadow: 0 0 0 4px var(--butter); }
  .card .meta-row { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--t-caption); color: var(--ink-3); flex-wrap: wrap; }
  .card .meta-row .id { font-weight: 500; font-variant-numeric: tabular-nums; }
  .invis { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; line-height: 20px; border-radius: var(--r-pill); border: 1px solid var(--hairline); }
  .card:hover .invis, .card.selected .invis { color: var(--butter-ink); background: var(--butter-wash); border-color: var(--butter); }
  .card h3 { font-size: var(--t-title3); line-height: 1.25; margin: var(--sp-2) 0 var(--sp-1); }
  .card .body { font-size: var(--t-sub); color: var(--ink-2); margin: 0 0 var(--sp-3); }
  .was { font-size: var(--t-footnote); color: var(--ink-2); margin: 0 0 var(--sp-3); }
  .was b { color: var(--ink); font-weight: 600; }
  .opts { display: grid; gap: 6px; margin: 0 0 var(--sp-3); }
  .card .opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--sp-3); align-items: start; font-size: var(--t-sub); line-height: 1.45; padding: var(--sp-2) var(--sp-3); }
  .card .opt > span:last-child { padding-top: 1px; }
  .card .opt .tag { font-size: var(--t-caption); font-weight: 600; color: var(--peri-ink); margin-left: var(--sp-2); white-space: nowrap; }
  .card .opt.rec { border: 1px dashed var(--peri-ink); background: var(--peri-wash); }
  .card .opt.rec .k { border-style: dashed; border-color: var(--peri-ink); color: var(--peri-ink); }
  .card .opt.chosen { border-color: var(--mint-ink); background: var(--mint); }
  .card .opt.chosen .k { background: var(--mint-ink); border-color: var(--mint-ink); color: var(--surface); }
  /* .was-chosen: the "Was:" line above carries it; the option keeps its rec/staged look */
  .card .opt.staged { border: 1px solid var(--peri-ink); background: var(--peri); }
  .card .opt.staged .k { background: var(--peri-ink); border: 1px solid var(--peri-ink); color: var(--surface); }
  .why { font-size: var(--t-footnote); color: var(--ink-2); margin: 0 0 var(--sp-3); }
  .why b { color: var(--ink); font-weight: 600; }
  .staged-text { font-size: var(--t-sub); padding: 10px 14px; border-radius: var(--r-tile); margin: 0 0 var(--sp-3); background: var(--peri); color: var(--ink); }
  .staged-text .lbl { font-size: var(--t-caption); color: var(--peri-ink); font-weight: 600; display: block; margin-bottom: 2px; }
  .acts { display: flex; gap: var(--sp-1); flex-wrap: wrap; align-items: center; }
  .acts button { font-size: var(--t-footnote); padding: 4px 12px; }
  .acts button[data-act="accept"] { border-color: var(--ink); font-weight: 600; }
  .acts button[data-act="accept"].staged { border-color: var(--peri-ink); color: var(--peri-ink); }
  .acts .sep { flex: 1; }

  /* thread and visual feedback: message bubbles in the stream */
  .msg {
    display: block; justify-self: start; max-width: 92%; text-align: left;
    font-size: var(--t-sub); line-height: 1.45; color: var(--ink);
    padding: var(--sp-2) var(--sp-3); margin: 3px 0 3px var(--sp-4);
    border: 1px solid transparent; border-radius: 16px 16px 16px 6px; background: var(--paper-2);
  }
  @media (hover: hover) { .msg:hover { background: var(--stone); border-color: transparent; } }
  .msg:active { transform: none; }
  .msg.user { justify-self: end; margin: 3px 0 3px var(--sp-10); border-radius: 16px 16px 6px 16px; background: var(--surface); border-color: var(--hairline-2); }
  @media (hover: hover) { .msg.user:hover { background: var(--paper); border-color: var(--hairline-2); } }
  .msg .who { display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 1px; }
  .msg .who .q { font-variant-numeric: tabular-nums; }
  .msg .who .w { color: var(--ink-2); }
  .msg.vis { background: var(--butter-wash); border-color: var(--butter); }
  @media (hover: hover) { .msg.vis:hover { background: var(--butter); border-color: var(--butter); } }
  .msg.vis .who .v { color: var(--butter-ink); }
  .msg.staged { background: var(--peri); border: 1px dashed var(--peri-ink); }
  @media (hover: hover) { .msg.staged:hover { background: var(--peri); border: 1px dashed var(--peri-ink); } }
  .msg.staged .who, .msg.staged .who .w { color: var(--peri-ink); }
  .msg .t { color: var(--ink); }

  /* ---------- composer ---------- */
  .composer { border-top: 1px solid var(--hairline); padding: var(--sp-3) var(--sp-5) var(--sp-4); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); background: var(--surface); }
  .cbox { border: 1px solid var(--hairline-2); border-radius: var(--r-card); background: var(--surface); transition: border-color var(--dur-hover) var(--ease-out); }
  .cbox:focus-within { transition: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }
  .cbox .row1 { display: flex; align-items: center; gap: var(--sp-2); padding: 8px 10px 0; }
  #chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: var(--t-caption); font-weight: 600; letter-spacing: 0; padding: 0 10px; line-height: 22px; border-radius: var(--r-pill);
    background: var(--stone); border: 1px solid transparent; color: var(--stone-ink); white-space: nowrap;
  }
  #chip .cyc { font-weight: 400; opacity: .8; }
  #chip.m-answer { background: var(--mint); color: var(--mint-ink); }
  #chip.m-visual { background: var(--butter); color: var(--butter-ink); }
  @media (hover: hover) { #chip:hover { border-color: currentColor; } }
  .cbox .hint { font-size: var(--t-caption); color: var(--ink-3); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #composer-in { border: 0; background: transparent; min-height: 48px; max-height: 160px; resize: none; padding: 6px 12px 12px; display: block; box-shadow: none; }
  #composer-in:focus, #composer-in:focus-visible { outline: none; box-shadow: none; }
  .sendrow { display: flex; align-items: center; gap: var(--sp-2); }
  .sendrow .staged-list { flex: 1; min-width: 0; font-size: var(--t-footnote); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sendrow .staged-list b { color: var(--peri-ink); font-weight: 600; }
  .sendrow button { font-size: var(--t-sub); padding: 8px 16px; white-space: nowrap; }
  .sendrow button.primary { padding: 8px 20px; }

  .toast { bottom: var(--sp-6); }

  /* ---------- < 760 px: visual above rail, page scrolls ---------- */
  @media (max-width: 759px) {
    html, body { height: auto; }
    body { display: block; height: auto; overflow: visible; }
    .top { gap: var(--sp-2) var(--sp-3); padding: var(--sp-2) var(--sp-4); }
    .top .doc { display: none; }
    .top .spacer { display: none; }
    .status { order: 5; }
    .studio { display: block; }
    section.visual { height: 60vh; }
    .vbar { padding: var(--sp-3) var(--sp-4) var(--sp-2); }
    .vbar .linked { margin-left: 0; }
    .stale { margin: 0 var(--sp-4) var(--sp-2); }
    .frame-wrap { padding: 0 var(--sp-4) var(--sp-4); }
    #visual-frame { border-radius: var(--r-card); }
    .empty { padding: var(--sp-6) var(--sp-4); }
    .empty h2 { font-size: 30px; }
    .empty .lede { font-size: var(--t-callout); }
    .rail { display: block; border-left: 0; border-top: 1px solid var(--hairline); }
    .rhead { padding: var(--sp-4); }
    .timeline { overflow: visible; }
    .round-body { padding: var(--sp-2) var(--sp-4) var(--sp-4); }
    .round-h { padding: var(--sp-2) var(--sp-4); }
    .line { grid-template-columns: 16px 32px minmax(0, 1fr); }
    .line .a { grid-column: 3; }
    .line .t { white-space: normal; }
    .card { padding: var(--sp-4); }
    .card, .line, .msg { scroll-margin-bottom: 180px; scroll-margin-top: 48px; }
    .composer { position: sticky; bottom: 0; z-index: var(--z-sticky); padding: var(--sp-2) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom)); background: var(--material-hi); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
    .cbox .hint { display: none; }
    .toast { bottom: 150px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>grill-with-ui skill</h1>
  <span class="doc path" id="doc-path"></span>
  <nav class="switch" aria-label="Layout">
    <a href="inbox.html">Inbox</a><a href="brief.html">Brief</a><a href="studio.html" aria-current="page">Studio</a>
  </nav>
  <span class="spacer"></span>
  <button type="button" class="toggle ghost" id="first-draw" aria-pressed="false" title="Preview the state before any visual has been drawn"><span class="sw" aria-hidden="true"></span>Before first draw</button>
  <span class="status" role="status"><span class="dot" id="agent-dot"></span><span id="agent-status"></span></span>
  <button type="button" id="finish">Finish</button>
</header>

<div class="studio">
  <section class="visual" id="visual" aria-label="Visual"></section>

  <section class="rail" aria-label="Conversation">
    <div class="rhead" id="rhead"></div>
    <div class="timeline" id="timeline"></div>
    <div class="composer">
      <div class="cbox">
        <div class="row1">
          <button type="button" id="chip" title="Change where this message goes (click to cycle)"></button>
          <span class="hint">↵ stage · ⇧↵ newline · ⌘↵ send all</span>
        </div>
        <label for="composer-in" class="sr">Message</label>
        <textarea id="composer-in" rows="2"></textarea>
      </div>
      <div class="sendrow">
        <span class="staged-list" id="staged-list"></span>
        <button type="button" id="stage-btn">Stage</button>
        <button type="button" class="primary" id="send" disabled>Send to agent</button>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const S = SESSION;
  const Q = S.questions;
  const byId = Object.fromEntries(Q.map((q) => [q.id, q]));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const QID = /^q\d+$/;
  const up = (id) => id.toUpperCase();
  const hhmm = (iso) => new Date(iso).toISOString().slice(11, 16);

  // Which questions have a region in the visual (data-q in the drawn HTML).
  const LINKED = [...new Set([...VISUAL_HTML.matchAll(/data-q="(q\d+)"/g)].map((m) => m[1]))]
    .sort((a, b) => +a.slice(1) - +b.slice(1));

  // ---------- state ----------
  const staged = {};            // qid -> { answer?, thread?: [text], defer?, reopen? } ; "visual" -> { thread: [...] }
  let selected = null;          // qid
  let mode = "thread";          // thread | answer | visual
  let firstDraw = false;        // "before first draw" preview
  let expanded = new Set();     // answered/deferred ids shown as full cards
  let clock = Date.parse(S.agent.since);
  const now = () => new Date((clock += 60000)).toISOString();

  // ---------- time model: round starts ----------
  const rounds = [...new Set(Q.map((q) => q.round))].sort((a, b) => a - b);
  const maxR = rounds[rounds.length - 1];
  const t0 = Date.parse(S.created), t1 = Date.parse(S.agent.since);
  const roundStart = {};
  for (const r of rounds) {
    const interp = t0 + (t1 - t0) * (r - 1) / Math.max(1, maxR - 1);
    const firsts = Q.filter((q) => q.round === r && q.status === "answered").flatMap((q) => q.thread.map((m) => Date.parse(m.at)));
    roundStart[r] = Math.min(interp, firsts.length ? Math.min(...firsts) - 60000 : Infinity);
  }
  const roundAt = (t) => rounds.filter((r) => roundStart[r] <= t).pop() || rounds[0];

  // ---------- helpers ----------
  const optText = (q, k) => (q.options.find((o) => o.k === k) || {}).text || "";
  const short = (t, n = 96) => { const s = String(t).split(/(?<=\.)\s/)[0].replace(/\.$/, ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  function answerLine(q, a) {
    a = a || q.answer;
    if (!a) return "";
    if (a.kind === "text") return a.text;
    return `${a.option} · ${short(optText(q, a.option))}`;
  }
  const isOpen = (q) => q.status === "open" || q.status === "reopened";
  const stagedCount = () => Object.values(staged).reduce((n, s) => n + (s.answer ? 1 : 0) + (s.defer ? 1 : 0) + (s.reopen ? 1 : 0) + (s.thread ? s.thread.length : 0), 0);
  function stageFor(id) { return (staged[id] = staged[id] || {}); }
  function clean(id) { const s = staged[id]; if (s && !s.answer && !s.defer && !s.reopen && !(s.thread && s.thread.length)) delete staged[id]; }

  // ---------- linkage (parent side of the Task 20 protocol) ----------
  let frame = null;
  function highlight(ids) {
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ highlight: ids.filter((x) => QID.test(x)) }, "*");
    document.querySelectorAll(".qchip").forEach((c) => c.classList.toggle("on", ids.includes(c.dataset.q)));
  }
  const rest = () => highlight(selected && LINKED.includes(selected) ? [selected] : []);
  addEventListener("message", (e) => {
    if (!frame || e.source !== frame.contentWindow || !e.data || typeof e.data !== "object") return;
    if (typeof e.data.clicked === "string" && QID.test(e.data.clicked) && byId[e.data.clicked]) select(e.data.clicked, { scroll: true, flash: true });
    else if (e.data.key === "send") send();
    else if (e.data.key === "escape") { frame.blur(); document.body.focus(); }
  });

  // ---------- header ----------
  $("doc-path").textContent = "→ " + S.doc;
  function setStatus(working) {
    $("agent-dot").classList.toggle("working", working);
    $("agent-status").textContent = working ? "Agent working on your send…" : `Agent waiting for you · since ${hhmm(S.agent.since)}`;
  }
  setStatus(false);
  $("first-draw").onclick = () => { firstDraw = !firstDraw; $("first-draw").setAttribute("aria-pressed", String(firstDraw)); if (firstDraw && mode === "visual") mode = selected ? "thread" : "visual"; renderVisual(); renderComposer(); };
  $("finish").onclick = () => toast(`Finish would write ${S.doc} (${Q.filter(isOpen).length} questions still open)`);

  // ---------- visual pane ----------
  function renderVisual() {
    const v = S.visual;
    const pane = $("visual");
    if (firstDraw) {
      frame = null;
      const agreed = Q.filter((q) => q.status === "answered");
      pane.innerHTML = `
        <div class="vbar"><b>Visual</b><span>Not drawn yet</span></div><div></div>
        <div class="empty"><div class="inner">
          <h2>Agreed so far</h2>
          <p class="lede">${agreed.length} decisions across ${new Set(agreed.map((q) => q.round)).size} rounds. Visualize turns them into a prototype you can point at; each region links back to the question that decided it.</p>
          <ul class="agreed">${agreed.map((q) => `<li><span class="id">${up(q.id)}</span><span><span class="t">${esc(q.title)}</span><span class="arrow">→</span><span class="a">${esc(answerLine(q))}</span></span></li>`).join("")}</ul>
          <div class="cta"><button type="button" class="primary" id="visualize">Visualize</button><span class="meta">Sends immediately; the agent draws while you keep answering.</span></div>
        </div></div>`;
      $("visualize").onclick = () => { toast("Visualize sent · the agent will draw v1"); firstDraw = false; $("first-draw").setAttribute("aria-pressed", "false"); renderVisual(); renderComposer(); };
      return;
    }
    pane.innerHTML = `
      <div class="vbar">
        <b>Visual</b><span>${esc(v.kind.replace(/^./, (c) => c.toUpperCase()))} v${v.version} · drawn ${hhmm(v.at)}</span>
        <span class="linked" aria-label="Questions linked to regions"><span class="meta">Linked</span>${LINKED.map((id) => `<button type="button" class="qchip" data-q="${id}" title="${esc(byId[id] ? byId[id].title : id)}">${up(id)}</button>`).join("")}</span>
      </div>
      ${v.stale ? `<div class="stale" role="note"><span class="msgtxt"><strong>Out of date.</strong> ${esc(v.note.replace(/^v\d+:\s*/, "").replace(/;\s*stale since/, " · stale since"))}.</span><button type="button" id="redraw">Visualize</button></div>` : "<div></div>"}
      <div class="frame-wrap"><iframe id="visual-frame" title="Visual prototype v${v.version}" sandbox="allow-scripts"></iframe></div>`;
    frame = $("visual-frame");
    frame.srcdoc = VISUAL_HTML;
    frame.addEventListener("load", rest);
    pane.querySelectorAll(".qchip").forEach((c) => {
      c.onmouseenter = () => highlight([c.dataset.q]);
      c.onmouseleave = rest;
      c.onclick = () => select(c.dataset.q, { scroll: true, flash: true });
    });
    const rd = $("redraw"); if (rd) rd.onclick = () => toast("Visualize sent · the agent will redraw v4");
  }

  // ---------- rail head ----------
  function renderHead() {
    const cur = Q.filter((q) => q.round === maxR);
    const open = cur.filter((q) => q.status === "open").length;
    const reop = Q.filter((q) => q.status === "reopened");
    $("rhead").innerHTML = `
      <div class="row"><h2>Conversation</h2>
        <span>Round ${maxR} · ${open} open</span>
        ${reop.length ? `<span class="needs">· reopened ${reop.map((q) => `<a href="#${q.id}" data-go="${q.id}">${up(q.id)}</a>`).join(" ")}</span>` : ""}
      </div>
      <div class="jump" role="navigation" aria-label="Jump to round"><span class="lbl">Round</span>${rounds.map((r) => `<button type="button" data-r="${r}" class="${r === maxR ? "cur" : ""}" aria-label="Jump to round ${r}">${r}</button>`).join("")}</div>`;
    $("rhead").querySelectorAll("[data-go]").forEach((a) => a.onclick = (e) => { e.preventDefault(); select(a.dataset.go, { scroll: true, flash: true }); });
    $("rhead").querySelectorAll("[data-r]").forEach((b) => b.onclick = () => jumpRound(+b.dataset.r));
  }
  function jumpRound(r) {
    const sec = document.querySelector(`[data-round="${r}"]`);
    if (!sec) return;
    const tl = $("timeline");
    if (getComputedStyle(tl).overflowY === "auto") tl.scrollTo({ top: sec.offsetTop - tl.offsetTop, behavior: "smooth" });
    else sec.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---------- timeline ----------
  function items() {
    const out = [];
    for (const q of Q) {
      out.push({ kind: "q", ord: 0, at: roundStart[q.round], round: q.round, q });
      for (const m of q.thread) out.push({ kind: "msg", ord: 1, at: Date.parse(m.at), round: q.round, q, m });
      const st = staged[q.id];
      if (st && st.thread) st.thread.forEach((t, i) => out.push({ kind: "msg", ord: 2, at: Infinity, round: q.round, q, m: { who: "user", text: t }, staged: true, idx: i }));
    }
    for (const m of (S.visual.thread || [])) out.push({ kind: "vis", ord: 1, at: Date.parse(m.at), round: roundAt(Date.parse(m.at)), m });
    const sv = staged.visual;
    if (sv && sv.thread) sv.thread.forEach((t, i) => out.push({ kind: "vis", ord: 2, at: Infinity, round: maxR, m: { who: "user", text: t }, staged: true, idx: i }));
    return out.sort((a, b) => a.round - b.round || a.at - b.at || a.ord - b.ord);
  }

  function renderCard(q) {
    const st = staged[q.id] || {};
    const full = isOpen(q) || expanded.has(q.id) || q.id === selected;
    const linked = LINKED.includes(q.id);
    if (!full) {
      const deferred = q.status === "deferred";
      const sa = st.answer ? answerLine(q, st.answer) : "";
      return `<button type="button" class="line ${deferred ? "deferred" : ""} ${sa || st.reopen ? "staged" : ""} ${linked ? "linked" : ""}" id="${q.id}" data-q="${q.id}"
          aria-label="${up(q.id)} ${esc(q.title)}: ${deferred ? "deferred" : esc(answerLine(q))}">
        <span class="ic" aria-hidden="true">${deferred ? "–" : "✓"}</span><span class="id">${up(q.id)}</span><span class="t">${esc(q.title)}</span>
        <span class="a"><span class="arrow">→</span>${st.reopen ? "reopen staged" : sa ? "staged: " + esc(sa) : deferred ? "deferred" : esc(answerLine(q))}</span>
      </button>`;
    }
    const answered = q.status === "answered";
    const was = q.status === "reopened" && q.answer ? q.answer.option : null;
    const opts = q.options.map((o) => {
      const rec = q.rec && q.rec.option === o.k;
      const chosen = answered && q.answer && q.answer.option === o.k;
      const isStaged = st.answer && st.answer.option === o.k;
      const cls = ["opt", rec && !chosen ? "rec" : "", chosen ? "chosen" : "", was === o.k ? "was-chosen" : "", isStaged ? "staged" : ""].join(" ");
      return `<button type="button" class="${cls}" data-opt="${o.k}" aria-pressed="${isStaged ? "true" : "false"}"><span class="k">${o.k}</span><span>${esc(o.text)}${rec ? `<span class="tag">Recommended</span>` : ""}${isStaged ? `<span class="tag">Staged</span>` : ""}</span></button>`;
    }).join("");
    const badge = st.answer || st.defer || st.reopen ? `<span class="chip staged">${st.defer ? "Defer staged" : st.reopen ? "Reopen staged" : "Staged"}</span>` : `<span class="chip ${q.status}">${q.status[0].toUpperCase() + q.status.slice(1)}</span>`;
    const stagedText = st.answer && st.answer.kind === "text" ? `<div class="staged-text"><span class="lbl">Your answer · staged</span>${esc(st.answer.text)}</div>` : "";
    const answeredLine = answered && q.answer ? `<p class="was">Decided: <b>${esc(answerLine(q))}</b>${q.answer.kind === "accept" ? " (accepted the recommendation)" : ""}</p>` : "";
    const wasLine = q.status === "reopened" && q.answer ? `<p class="was">Was: <b>${esc(answerLine(q))}</b></p>` : "";
    const acts = answered
      ? `<button type="button" class="ghost" data-act="thread">Reply</button><button type="button" class="ghost" data-act="reopen">${st.reopen ? "Unstage reopen" : "Reopen"}</button><span class="sep"></span><button type="button" class="ghost" data-act="collapse">Collapse</button>`
      : q.status === "deferred"
        ? `<button type="button" class="ghost" data-act="reopen">${st.reopen ? "Unstage reopen" : "Reopen"}</button><span class="sep"></span><button type="button" class="ghost" data-act="collapse">Collapse</button>`
        : `<button type="button" data-act="accept"${st.answer && st.answer.kind === "accept" ? ' class="staged"' : ""}>Accept ${q.rec.option}</button>
           <button type="button" class="ghost" data-act="answer">Answer in words</button>
           <button type="button" class="ghost" data-act="thread">Reply</button>
           <span class="sep"></span>
           ${st.answer || st.defer ? `<button type="button" class="ghost" data-act="unstage">Unstage</button>` : `<button type="button" class="ghost" data-act="defer">Defer</button>`}`;
    return `<article class="card ${q.id === selected ? "selected" : ""}" id="${q.id}" data-q="${q.id}" tabindex="-1" aria-labelledby="h-${q.id}">
      <div class="meta-row"><span class="id">${up(q.id)}</span>${badge}${q.updated ? `<span class="chip updated">Rec updated</span>` : ""}${q.deps.length ? `<span>after ${q.deps.map(up).join(", ")}</span>` : "<span>root</span>"}${linked ? `<span class="invis vismark" title="Hover to see it outlined in the visual">In visual</span>` : ""}</div>
      <h3 id="h-${q.id}">${esc(q.title)}</h3>
      <p class="body">${esc(q.body)}</p>
      ${wasLine}${answered ? "" : `<div class="opts">${opts}</div><p class="why"><b>Why ${q.rec.option}.</b> ${esc(q.rec.why)}</p>`}
      ${answeredLine}${stagedText}
      <div class="acts">${acts}</div>
    </article>`;
  }

  function renderMsg(it) {
    if (it.kind === "vis") {
      return `<button type="button" class="msg vis ${it.m.who} ${it.staged ? "staged" : ""}" data-vis="1" ${it.staged ? `data-unstage-vis="${it.idx}"` : ""}>
        <span class="who"><span class="v">Visual</span> · <span class="w">${it.m.who === "user" ? "you" : "agent"}</span>${it.staged ? " · staged" : " · " + hhmm(it.m.at)}</span><span class="t">${esc(it.m.text)}</span></button>`;
    }
    return `<button type="button" class="msg ${it.m.who} ${it.staged ? "staged" : ""}" data-q="${it.q.id}" data-msg="1">
      <span class="who"><span class="q">${up(it.q.id)}</span> · <span class="w">${it.m.who === "user" ? "you" : "agent"}</span>${it.staged ? " · staged" : " · " + hhmm(it.m.at)}</span><span class="t">${esc(it.m.text)}</span></button>`;
  }

  function renderTimeline(opts = {}) {
    const tl = $("timeline");
    const keep = tl.scrollTop;
    const groups = new Map();
    for (const it of items()) { if (!groups.has(it.round)) groups.set(it.round, []); groups.get(it.round).push(it); }
    let html = "";
    for (const [r, list] of groups) {
      const qs = list.filter((i) => i.kind === "q").map((i) => i.q);
      const open = qs.filter(isOpen).length;
      const summary = open ? `${open} open` : `${qs.length} decided`;
      html += `<section data-round="${r}" aria-label="Round ${r}"><h3 class="round-h ${r === maxR ? "current" : ""}"><span>Round ${r}${r === maxR ? " · current" : ""}</span><span class="${open ? "n-open" : "n-done"}">${summary}</span></h3><div class="round-body">`;
      for (const it of list) html += it.kind === "q" ? renderCard(it.q) : renderMsg(it);
      html += `</div></section>`;
    }
    tl.innerHTML = html;
    if (!opts.reset) tl.scrollTop = keep;
    wireTimeline(tl);
  }

  function wireTimeline(tl) {
    tl.querySelectorAll("[data-q]").forEach((el) => {
      const id = el.dataset.q;
      el.addEventListener("mouseenter", () => highlight([id]));
      el.addEventListener("mouseleave", rest);
    });
    tl.querySelectorAll(".line").forEach((el) => el.onclick = () => { expanded.add(el.dataset.q); select(el.dataset.q, { scroll: true }); });
    tl.querySelectorAll(".msg[data-msg]").forEach((el) => el.onclick = () => select(el.dataset.q));
    tl.querySelectorAll(".msg[data-vis]").forEach((el) => el.onclick = () => { if (el.dataset.unstageVis != null) return; mode = "visual"; renderComposer(); $("composer-in").focus(); });
    tl.querySelectorAll(".card").forEach((card) => {
      const id = card.dataset.q;
      card.addEventListener("click", (e) => {
        if (e.target.closest("button")) return;
        if (selected !== id) select(id);
      });
      card.querySelectorAll("[data-opt]").forEach((b) => b.onclick = () => {
        const s = stageFor(id);
        if (s.answer && s.answer.option === b.dataset.opt) delete s.answer; else { s.answer = { kind: "option", option: b.dataset.opt }; delete s.defer; }
        clean(id); selected = id; setChip(id); renderAll();
      });
      card.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => act(id, b.dataset.act));
    });
  }

  function act(id, a) {
    const q = byId[id];
    const s = stageFor(id);
    if (a === "accept") { if (s.answer && s.answer.kind === "accept") delete s.answer; else { s.answer = { kind: "accept", option: q.rec.option }; delete s.defer; } }
    else if (a === "defer") { s.defer = true; delete s.answer; }
    else if (a === "unstage") { delete s.answer; delete s.defer; }
    else if (a === "reopen") { s.reopen = !s.reopen; }
    else if (a === "collapse") { expanded.delete(id); if (selected === id) selected = null; clean(id); rest(); renderAll(); return; }
    else if (a === "thread" || a === "answer") { clean(id); selected = id; mode = a; renderAll(); $("composer-in").focus(); return; }
    clean(id); selected = id; renderAll();
  }

  function select(id, o = {}) {
    if (!byId[id]) return;
    selected = id;
    if (!isOpen(byId[id])) expanded.add(id);
    setChip(id);
    renderAll();
    const el = $(id);
    if (el && o.scroll) el.scrollIntoView({ behavior: "smooth", block: "center" });
    if (el && o.flash) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1100); }
  }

  // ---------- composer ----------
  function setChip(id) { if (mode === "visual" || !mode) mode = "thread"; if (byId[id] && byId[id].status !== "open" && byId[id].status !== "reopened" && mode === "answer") mode = "thread"; }
  const MODES = ["thread", "answer", "visual"];
  $("chip").onclick = () => {
    if (!selected) { mode = "visual"; toast("Click a question card to target it"); renderComposer(); return; }
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    renderComposer(); $("composer-in").focus();
  };
  function renderComposer() {
    if (!selected) mode = "visual";
    const chip = $("chip");
    const label = mode === "visual" ? "visual" : `@${selected} ${mode}`;
    chip.className = "m-" + mode;
    chip.innerHTML = `${esc(label)}<span class="cyc" aria-hidden="true">⇄</span>`;
    chip.setAttribute("aria-label", `Target: ${label}. Click to change.`);
    const q = byId[selected];
    const ph = mode === "visual"
      ? (firstDraw ? "Anything the first draw should show…" : "Feedback on the visual: what should change in the next draw…")
      : mode === "answer"
        ? `Answer ${up(selected)} in your own words (replaces picking an option)…`
        : `Ask about or push back on ${up(selected)} · ${q.title}…`;
    $("composer-in").placeholder = ph;
    $("stage-btn").textContent = mode === "answer" ? "Stage answer" : "Stage";
  }
  function stageComposer() {
    const ta = $("composer-in");
    const t = ta.value.trim();
    if (!t) { ta.focus(); return; }
    if (mode === "visual") (stageFor("visual").thread = stageFor("visual").thread || []).push(t);
    else if (mode === "answer") { const s = stageFor(selected); s.answer = { kind: "text", text: t }; delete s.defer; }
    else (stageFor(selected).thread = stageFor(selected).thread || []).push(t);
    ta.value = "";
    renderAll();
    const tl = $("timeline");
    const target = mode === "visual" ? tl.querySelector(".msg.vis.staged:last-of-type") : $(selected);
    if (mode !== "visual" && mode !== "answer") { const all = tl.querySelectorAll(`.msg.staged[data-q="${selected}"]`); const last = all[all.length - 1]; if (last) last.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    else if (target) target.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  $("stage-btn").onclick = stageComposer;
  $("composer-in").addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); stageComposer(); }
  });

  function renderFooter() {
    const n = stagedCount();
    const parts = Object.entries(staged).map(([id, s]) => {
      if (id === "visual") return `visual +${s.thread.length}`;
      const bits = [];
      if (s.answer) bits.push(s.answer.kind === "text" ? "text" : "→ " + s.answer.option);
      if (s.defer) bits.push("defer");
      if (s.reopen) bits.push("reopen");
      if (s.thread && s.thread.length) bits.push(`+${s.thread.length} msg`);
      return `${up(id)} ${bits.join(" ")}`;
    });
    $("staged-list").innerHTML = n ? `<b>${n} staged</b> · ${esc(parts.join(" · "))}` : "Nothing staged yet";
    $("send").disabled = n === 0;
    $("send").textContent = n ? `Send ${n} to agent` : "Send to agent";
  }

  function send() {
    const n = stagedCount();
    if (!n) return;
    for (const [id, s] of Object.entries(staged)) {
      if (id === "visual") { for (const t of s.thread) S.visual.thread.push({ who: "user", text: t, at: now() }); continue; }
      const q = byId[id];
      for (const t of (s.thread || [])) q.thread.push({ who: "user", text: t, at: now() });
      if (s.answer) { q.answer = s.answer; q.status = "answered"; expanded.delete(id); }
      if (s.defer) q.status = "deferred";
      if (s.reopen) q.status = "reopened";
      delete staged[id];
    }
    if (selected && !isOpen(byId[selected])) selected = null;
    setStatus(true);
    toast(`Sent ${n} action${n > 1 ? "s" : ""} as one event`);
    renderAll();
    setTimeout(() => setStatus(false), 2600);
  }
  $("send").onclick = send;

  let toastT;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }

  // ---------- keyboard (subset of spec §7) ----------
  document.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); return; }
    const inField = e.target.closest && e.target.closest("input, textarea, [contenteditable]");
    if (e.key === "Escape") { if (inField) e.target.blur(); return; }
    if (inField || e.ctrlKey || e.altKey || e.metaKey) return;
    const q = byId[selected];
    const openIds = Q.filter(isOpen).map((x) => x.id);
    if (e.key === "j" || e.key === "k") {
      const i = openIds.indexOf(selected);
      const next = e.key === "j" ? openIds[i + 1] || openIds[0] : openIds[i - 1] || openIds[openIds.length - 1];
      if (next) { e.preventDefault(); select(next, { scroll: true }); }
    } else if (e.key === "r" && q) { e.preventDefault(); mode = "thread"; renderComposer(); $("composer-in").focus(); }
    else if (e.key === "f" && q && isOpen(q)) { e.preventDefault(); mode = "answer"; renderComposer(); $("composer-in").focus(); }
    else if (e.key === "a" && q && isOpen(q)) act(q.id, "accept");
    else if (/^[1-4]$/.test(e.key) && q && isOpen(q)) { const o = q.options[+e.key - 1]; if (o) { const b = document.querySelector(`#${q.id} [data-opt="${o.k}"]`); if (b) b.click(); } }
  });

  function renderAll(opts) { renderHead(); renderTimeline(opts); renderComposer(); renderFooter(); rest(); }

  renderVisual();
  renderAll({ reset: true });
  // Land on the current round.
  requestAnimationFrame(() => {
    const tl = $("timeline"), sec = document.querySelector(`[data-round="${maxR}"]`);
    if (sec && getComputedStyle(tl).overflowY === "auto") tl.scrollTop = sec.offsetTop - tl.offsetTop;
  });
})();
</script>
</body>
</html>
